name: Bug report
description: Something in Portikus does not work as it should.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Portikus version
      description: From `dpkg -s portikus` on the server, or the About page.
      placeholder: 0.1.650
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a student
        2. Open a workspace
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include error messages, logs, or screenshots. Remove secrets first.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 140 on Windows 11
