name: Feature request
description: Suggest something Portikus should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and who is it for (students, instructors, or administrators)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: input
    id: version
    attributes:
      label: Portikus version
      description: From `dpkg -s portikus` or the About page, if you run it.
