name: Release

# A release is published when an epic or task branch merges into main, or by
# running this workflow by hand from main for a hotfix.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The apt job reads the published repository and redeploys it, so two
# releases must not overlap or one would drop the other's package.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build the Debian package
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'epic/') || startsWith(github.event.pull_request.head.ref, 'task/')))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the merge commit on main, not the PR head, so the version
          # counts main's commits and the tag points at main.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          # The package version counts commits, so the full history is needed.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache nfpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/portikus/nfpm
          key: nfpm-${{ runner.os }}-${{ hashFiles('scripts/build-deb.sh') }}
      - name: Build Debian package
        run: pnpm build:deb
      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portikus-deb
          path: |
            dist/deb/*.deb
            dist/deb/VERSION
          retention-days: 7

  publish:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portikus-deb
          path: dist/deb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          VERSION="$(cat dist/deb/VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to publish."
            exit 0
          fi
          # Ansible reads the checksum from this file instead of a pin in the repo.
          (cd dist/deb && sha256sum portikus_*.deb > SHA256SUMS)
          gh release create "v$VERSION" \
            --target "$TARGET_SHA" \
            --title "portikus $VERSION" \
            --notes "Control-plane package built from $TARGET_SHA" \
            dist/deb/portikus_*.deb \
            dist/deb/SHA256SUMS

  apt-repo:
    name: Sign the apt repository
    runs-on: ubuntu-latest
    needs: build
    # The only job that can read APT_SIGNING_KEY (docs/EPIC-15.md, ruling 17).
    environment: publish
    env:
      APT_URL: https://toddawhittaker.github.io/portikus/apt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portikus-deb
          path: dist/deb
      - name: Install apt-ftparchive
        run: command -v apt-ftparchive || { sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils; }
      # The live Pages site is the only state this stateless job has: fetch
      # the packages it lists, each checked against its published checksum.
      - name: Download the published packages
        run: |
          mkdir -p site/apt
          if ! curl -fsSL "$APT_URL/dists/trixie/main/binary-amd64/Packages" -o packages.txt; then
            echo "No published repository yet; starting empty."
            exit 0
          fi
          awk '/^Filename: /{f=$2} /^SHA256: /{print $2, f}' packages.txt | while read -r sum file; do
            [[ "$file" =~ ^pool/main/p/portikus/portikus_[A-Za-z0-9.+~-]+_amd64\.deb$ ]] || { echo "unexpected path $file" >&2; exit 1; }
            mkdir -p "site/apt/$(dirname "$file")"
            curl -fsSL "$APT_URL/$file" -o "site/apt/$file"
            echo "$sum  site/apt/$file" | sha256sum -c --quiet
          done
      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: scripts/publish-apt-repo.sh site/apt dist/deb/portikus_*.deb
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    name: Deploy the apt repository to Pages
    runs-on: ubuntu-latest
    needs: apt-repo
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apt/
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
