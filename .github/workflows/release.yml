name: Release

# A release is published when an epic or task branch merges into main, or by
# running this workflow by hand from main for a hotfix. It runs on the push
# to main, not on the pull request event, because the publish environment
# admits only main and a pull request run's ref is refs/pull/N/merge.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The signed index expires 30 days after it is made (Valid-Until), so it
  # is signed again weekly even when nothing is released.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# The apt job reads the published repository and redeploys it, so two
# releases must not overlap or one would drop the other's package. A group
# keeps only one waiting run and cancels it for a newer one, so the weekly
# re-sign has a group of its own and can never cancel a waiting release.
# The two kinds keep apart with scripts/apt-writers.mjs instead: a re-sign
# skips itself while a release that will sign is unfinished, and a release's
# apt job waits for any unfinished re-sign (docs/WORKFLOW.md, "CI").
concurrency:
  group: ${{ github.event_name == 'schedule' && 'apt-resign' || 'release' }}
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether this push is a release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      resign: ${{ steps.decide.outputs.resign }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: decide
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          APT_URL: https://toddawhittaker.github.io/portikus/apt
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = schedule ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            # A release that will sign the index makes this run unneeded, and must
            # not race it. One waiting for approval or ruled no release does not count.
            # A failed lookup fails this run rather than signing past a release.
            unfinished="$(gh api "repos/$GH_REPO/actions/workflows/release.yml/runs?branch=main&per_page=50" \
              | node scripts/apt-writers.mjs releases "$RUN_ID")"
            releases=""
            for id in $unfinished; do
              signer="$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" | node scripts/apt-writers.mjs signs "$id")"
              releases="$releases${releases:+$'\n'}$signer"
            done
            releases="$(echo "$releases" | sed '/^$/d')"
            if [ -n "$releases" ]; then
              echo "Release runs ${releases//$'\n'/ } are unfinished and will sign the index; not signing it here."
              echo "resign=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A release in the last 6 days signed it already. Anything unreadable signs again.
            published="$(curl -fsSL "$APT_URL/dists/trixie/InRelease" | sed -n 's/^Date: //p' | head -n 1)" || published=""
            if [ -n "$published" ] && signed="$(date -d "$published" +%s)" \
              && [ $(( $(date +%s) - signed )) -lt $(( 6 * 86400 )) ]; then
              echo "The apt index was signed on $published, less than 6 days ago; not signing it again."
              echo "resign=false" >> "$GITHUB_OUTPUT"
            else
              echo "resign=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # The pull request that put this commit on main. GitHub can list it a
          # few seconds late, and main changes only by pull request, so an empty
          # answer after the retries is an error, not a skip.
          head=""
          for attempt in 1 2 3 4 5; do
            head="$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.base.ref == "main" and .merged_at != null) | .head.ref][0] // ""')"
            [ -z "$head" ] || break
            [ "$attempt" = 5 ] || sleep 10
          done
          if [ -z "$head" ]; then
            echo "No merged pull request found for $SHA after 5 tries; rerun Release once GitHub lists it." >&2
            exit 1
          fi
          echo "Merged from: $head"
          case "$head" in
            epic/*|task/*) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "release=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build the Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gate
    if: needs.gate.outputs.release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The package version counts commits, so the full history is needed.
          fetch-depth: 0
          persist-credentials: false
      # A package must never name a workspace image that was not published.
      # A version bump builds the image in workspace-image.yml on the same push,
      # so wait for it before creating any release.
      - name: Wait for the workspace image release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          image="image-$(cat infra/workspace-image/VERSION)"
          for minute in $(seq 1 75); do
            if gh release view "$image" >/dev/null 2>&1; then
              echo "Release $image is published."
              exit 0
            fi
            echo "Release $image is not published yet (minute $minute of 75)."
            sleep 60
          done
          echo "Release $image was not published within 75 minutes. Check the Workspace image workflow, then rerun Release." >&2
          exit 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache nfpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/portikus/nfpm
          key: nfpm-${{ runner.os }}-${{ hashFiles('scripts/build-deb.sh') }}
      - name: Build Debian package
        run: pnpm build:deb
      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portikus-deb
          path: |
            dist/deb/*.deb
            dist/deb/VERSION
          retention-days: 7

  publish:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      # Only for the version; the package itself is served by the apt repository.
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portikus-deb
          path: dist/deb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          VERSION="$(cat dist/deb/VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to publish."
            exit 0
          fi
          gh release create "v$VERSION" \
            --target "$TARGET_SHA" \
            --title "portikus $VERSION" \
            --notes "Control-plane package built from $TARGET_SHA. Install it from the apt repository: sudo apt install portikus=$VERSION"

  apt-repo:
    name: Sign the apt repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate, build]
    # After a release build, or alone for the weekly re-sign.
    if: >-
      !cancelled() && needs.gate.result == 'success'
      && (needs.build.result == 'success' || needs.gate.outputs.resign == 'true')
    # The only job that can read APT_SIGNING_KEY (docs/SPEC.md section 21.13).
    environment: publish
    permissions:
      actions: read
      contents: read
    env:
      APT_URL: https://toddawhittaker.github.io/portikus/apt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A re-sign that checked before this release could sign would read the
      # repository and deploy it again, so let it finish first. The re-sign
      # never waits for a release, so the two cannot deadlock.
      - name: Wait for an unfinished re-sign
        if: github.event_name != 'schedule'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # A failed lookup fails the job rather than publishing past a re-sign.
          while true; do
            resigns="$(gh api "repos/$GH_REPO/actions/workflows/release.yml/runs?event=schedule&per_page=20" \
              | node scripts/apt-writers.mjs resigns "$RUN_ID")"
            [ -n "$resigns" ] || break
            echo "Waiting for re-sign runs ${resigns//$'\n'/ } to finish."
            sleep 30
          done
      - name: Download the package
        if: needs.build.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portikus-deb
          path: dist/deb
      - name: Install apt-ftparchive
        timeout-minutes: 5
        run: command -v apt-ftparchive || { sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends apt-utils; }
      # The live Pages site is the only state this stateless job has. Trust it
      # only through InRelease signed by our key, and fail closed otherwise.
      - name: Download the published packages
        run: |
          mkdir -p site/apt
          dist="$APT_URL/dists/trixie"
          code="$(curl -sSL -o InRelease -w '%{http_code}' "$dist/InRelease")"
          if [ "$code" = 404 ]; then
            # The first release: nothing is published, so Packages must be missing too.
            code="$(curl -sSL -o /dev/null -w '%{http_code}' "$dist/main/binary-amd64/Packages")"
            [ "$code" = 404 ] || { echo "InRelease is missing but Packages answered $code" >&2; exit 1; }
            echo "No published repository yet; starting empty."
            exit 0
          fi
          [ "$code" = 200 ] || { echo "InRelease answered $code" >&2; exit 1; }
          gpg --dearmor < packaging/portikus-archive-keyring.asc > "$RUNNER_TEMP/archive.gpg"
          gpgv --keyring "$RUNNER_TEMP/archive.gpg" --output Release InRelease
          want="$(awk '/^SHA256:/{s=1; next} /^[^ ]/{s=0} s && $3 == "main/binary-amd64/Packages" {print $1}' Release)"
          [ -n "$want" ] || { echo "the signed Release lists no Packages checksum" >&2; exit 1; }
          code="$(curl -sSL -o packages.txt -w '%{http_code}' "$dist/main/binary-amd64/Packages")"
          [ "$code" = 200 ] || { echo "Packages answered $code" >&2; exit 1; }
          echo "$want  packages.txt" | sha256sum -c --quiet
          awk '/^Filename: /{f=$2} /^SHA256: /{print $2, f}' packages.txt | while read -r sum file; do
            [[ "$file" =~ ^pool/main/p/portikus/portikus_[A-Za-z0-9.+~-]+_amd64\.deb$ ]] || { echo "unexpected path $file" >&2; exit 1; }
            mkdir -p "site/apt/$(dirname "$file")"
            curl -fsSL "$APT_URL/$file" -o "site/apt/$file"
            echo "$sum  site/apt/$file" | sha256sum -c --quiet
          done
      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        # A weekly re-sign has no new package, and must not start an empty repository.
        run: |
          shopt -s nullglob
          debs=(dist/deb/portikus_*.deb)
          if [ ${#debs[@]} = 0 ] && [ ! -d site/apt/pool ]; then
            echo "Nothing is published yet, so there is nothing to sign again." >&2
            exit 1
          fi
          scripts/publish-apt-repo.sh site/apt "${debs[@]}"
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    name: Deploy the apt repository to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: apt-repo
    # The default success() would also require the build, skipped by a re-sign.
    if: ${{ !cancelled() && needs.apt-repo.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apt/
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
