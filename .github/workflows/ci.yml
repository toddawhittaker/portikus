name: CI

on:
  pull_request:
    branches: [main, "epic/**"]
  push:
    branches: [main, "epic/**"]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changed.outputs.app }}
      infra: ${{ steps.changed.outputs.infra }}
    steps:
      # Full history is needed to diff against the base branch or the
      # previous push; nothing else in this job needs a checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: changed
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$GITHUB_BASE_REF"
            changed=$(git diff --no-renames --name-only "origin/$GITHUB_BASE_REF...HEAD")
          elif [ -z "$GITHUB_EVENT_BEFORE" ] || [ "$GITHUB_EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changed=$(git ls-files)
          elif ! git cat-file -e "$GITHUB_EVENT_BEFORE^{commit}" 2>/dev/null; then
            # A force-push can leave the previous SHA unreachable; treat everything as changed.
            changed=$(git ls-files)
          else
            changed=$(git diff --no-renames --name-only "$GITHUB_EVENT_BEFORE..HEAD")
          fi
          echo "Changed files:"
          echo "$changed"
          app=false
          infra=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              docs/*|design/*|screenshots/*|.claude/*) ;;
              infra/*)
                infra=true
                ;;
              scripts/*|packaging/*|*.sh)
                app=true
                infra=true
                ;;
              *.md)
                case "$path" in */*) app=true ;; esac
                ;;
              .github/workflows/ci.yml)
                app=true
                infra=true
                ;;
              *)
                app=true
                ;;
            esac
          done <<< "$changed"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"

  app:
    name: Application checks
    runs-on: ubuntu-latest
    needs: changes
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: portikus
          POSTGRES_DB: portikus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Detect application code
        id: detect
        run: |
          if [ -f pnpm-workspace.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No pnpm workspace yet; skipping."; fi
      # The workspace-agent tests need a real tmux for terminals, zip for the
      # project archive, and ripgrep for project search, none of which the
      # runner image ships.
      - name: Install tmux, zip, and ripgrep
        if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux zip unzip ripgrep
      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm typecheck
      - if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm lint
      - if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm test:coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:portikus@127.0.0.1:5432/portikus_test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 3
          if-no-files-found: ignore
      - if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm build
      - name: Cache nfpm
        if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/portikus/nfpm
          key: nfpm-${{ runner.os }}-${{ hashFiles('scripts/build-deb.sh') }}
      # A build-only check: the package is not kept, so the version does not matter.
      - name: Build Debian package
        if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm build:deb
        env:
          PORTIKUS_VERSION: 0.0.0+ci

  # The browser tests are the slowest part of CI, so they run in parallel
  # shards, each with its own database and ports, alongside the app job.
  e2e-shard:
    name: Browser end-to-end tests (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: portikus
          POSTGRES_DB: portikus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Detect end-to-end tests
        id: detect
        run: |
          if [ -f pnpm-workspace.yaml ] && grep -q '"test:e2e"' package.json; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No test:e2e script yet; skipping."; fi
      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # With the browser cached this only installs the system libraries.
      - if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # The Playwright servers run the compiled output, and Vite serves the
      # ui package's theme and fonts from its dist, so build both first.
      - if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm typecheck && pnpm --filter @portikus/ui build
      - id: run
        if: steps.detect.outputs.present == 'true' && needs.changes.outputs.app == 'true'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        env:
          TEST_DATABASE_URL: postgres://postgres:portikus@127.0.0.1:5432/portikus_test
      - name: Upload the Playwright report
        if: failure() && steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The branch rulesets require a check with this exact name, so it stays
  # one job that passes only when every shard passed.
  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: Check every shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ]

  # Sign-in through a real Dex at the commit site.yml pins, configured by the
  # role's own template (docs/EPIC-12B.md, Part A item 12). Not a required
  # check, so a Dex upgrade shows its failure here without blocking merges.
  dex-signin:
    name: Dex sign-in
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.infra == 'true'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: portikus
          POSTGRES_DB: portikus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DEX_DIR: /tmp/dex
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned Dex version and commit
        id: pin
        run: |
          set -euo pipefail
          version=$(awk '$1 == "dex_version:" { print $2 }' infra/ansible/site.yml)
          commit=$(awk '$1 == "dex_commit:" { print $2 }' infra/ansible/site.yml)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] && [ -n "$version" ]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # The binary and the pages it serves, from the pinned source.
      - name: Cache the Dex build
        id: dex-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.DEX_DIR }}/out
          key: dex-${{ runner.os }}-${{ steps.pin.outputs.commit }}
      - name: Fetch Dex at the pinned commit
        if: steps.dex-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init -q "$DEX_DIR/src"
          cd "$DEX_DIR/src"
          git fetch -q --depth 1 https://github.com/dexidp/dex.git "${{ steps.pin.outputs.commit }}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
      - uses: actions/setup-go@v7
        if: steps.dex-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: ${{ env.DEX_DIR }}/src/go.mod
          # The Dex build cache above covers reruns.
          cache: false
      # The same flags as the dex role (infra/ansible/roles/dex/tasks/main.yml).
      - name: Build Dex
        if: steps.dex-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.DEX_DIR }}/src
        env:
          GOFLAGS: -buildvcs=false
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          mkdir -p "$DEX_DIR/out"
          go build -trimpath -ldflags "-w -X main.version=${{ steps.pin.outputs.version }}" -o "$DEX_DIR/out/dex" ./cmd/dex
          cp -r web "$DEX_DIR/out/web"
      - name: Check the Dex version
        run: '"$DEX_DIR/out/dex" version | grep -F "Dex Version: ${{ steps.pin.outputs.version }}"'
      # The role's real template and guards, with the published test users.
      - name: Render the Dex configuration
        run: >-
          ansible-playbook infra/tests/dex-render-test.yml
          -e dex_render_dest="$DEX_DIR/config.yaml"
          -e dex_web_dir="$DEX_DIR/out/web"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The proto the API's client is built from must match the pinned Dex
      # (docs/EPIC-14.md, risk 5).
      - name: Check the Dex API proto matches the pinned commit
        run: >-
          curl -sfL "https://raw.githubusercontent.com/dexidp/dex/${{ steps.pin.outputs.commit }}/api/v2/api.proto"
          | cmp - packages/auth/proto/dex-api.proto
      # PostgreSQL storage and the gRPC API behind mutual TLS, as the dex role
      # will run them (docs/EPIC-14.md rulings 19 and 20). "other" is a second
      # authority, for a client Dex must refuse.
      - name: Give Dex PostgreSQL storage and the gRPC API
        env:
          PGPASSWORD: portikus
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -c 'create database dex'
          pnpm exec tsx -e '
            import { writeDexGrpcCerts } from "./packages/auth/src/testing/fake-dex-grpc.ts";
            writeDexGrpcCerts(process.env.DEX_DIR + "/grpc", "ci");
            writeDexGrpcCerts(process.env.DEX_DIR + "/grpc", "other");
          '
          yq -i '
            .storage = {"type": "postgres", "config": {"host": "127.0.0.1", "port": 5432,
              "database": "dex", "user": "postgres", "password": "portikus", "ssl": {"mode": "disable"}}} |
            .grpc = {"addr": "127.0.0.1:5557",
              "tlsCert": strenv(DEX_DIR) + "/grpc/ci-server.crt",
              "tlsKey": strenv(DEX_DIR) + "/grpc/ci-server.key",
              "tlsClientCA": strenv(DEX_DIR) + "/grpc/ci-ca.crt"}
          ' "$DEX_DIR/config.yaml"
      - name: Start Dex
        run: |
          set -euo pipefail
          "$DEX_DIR/out/dex" serve "$DEX_DIR/config.yaml" >"$DEX_DIR/dex.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5556/dex/.well-known/openid-configuration >/dev/null && exit 0
            sleep 1
          done
          cat "$DEX_DIR/dex.log"
          exit 1
      # The one-time users-file import the dex role runs (docs/EPIC-14.md
      # ruling 23), into Dex's empty storage; the sign-in tests below use it.
      - name: Import the users fixture into Dex
        env:
          PGPASSWORD: portikus
          DATABASE_URL: postgres://postgres:portikus@127.0.0.1:5432/dex_import
          DEX_GRPC_ADDR: 127.0.0.1:5557
          DEX_GRPC_CA: ${{ env.DEX_DIR }}/grpc/ci-ca.crt
          DEX_GRPC_CERT: ${{ env.DEX_DIR }}/grpc/ci-client.crt
          DEX_GRPC_KEY: ${{ env.DEX_DIR }}/grpc/ci-client.key
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -c 'create database dex_import'
          # The command imports @portikus/db from its build, as on the VM.
          pnpm exec tsc -b packages/db
          pnpm exec tsx packages/db/src/migrate.ts
          run_import() {
            pnpm exec tsx packages/auth/src/dex-import-main.ts \
              --input infra/tests/fixtures/users.sample.json --issuer http://127.0.0.1:5556/dex
          }
          run_import | tee "$DEX_DIR/import-1.txt"
          grep -qx 'Imported into Dex: carol, alice' "$DEX_DIR/import-1.txt"
          grep -qx 'Grants set: none' "$DEX_DIR/import-1.txt"
          grep -qx 'Accounts created for a grant: carol' "$DEX_DIR/import-1.txt"
          # A second run finds Dex holding passwords and imports nothing.
          run_import | tee "$DEX_DIR/import-2.txt"
          grep -qx 'Dex already holds 2 passwords; nothing imported.' "$DEX_DIR/import-2.txt"
      - name: Sign in through Dex, and manage Dex users through its gRPC API
        run: >-
          pnpm exec vitest run
          packages/auth/src/dex.integration.test.ts
          packages/auth/src/dex-api.integration.test.ts
        env:
          DEX_TEST_ISSUER: http://127.0.0.1:5556/dex
          TEST_DATABASE_URL: postgres://postgres:portikus@127.0.0.1:5432/portikus_test
          DEX_GRPC_ADDR: 127.0.0.1:5557
          DEX_GRPC_CA: ${{ env.DEX_DIR }}/grpc/ci-ca.crt
          DEX_GRPC_CERT: ${{ env.DEX_DIR }}/grpc/ci-client.crt
          DEX_GRPC_KEY: ${{ env.DEX_DIR }}/grpc/ci-client.key
          DEX_GRPC_OTHER_CERT: ${{ env.DEX_DIR }}/grpc/other-client.crt
          DEX_GRPC_OTHER_KEY: ${{ env.DEX_DIR }}/grpc/other-client.key
      - name: Show the Dex log
        if: failure()
        run: cat "$DEX_DIR/dex.log" || true

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - name: Detect infrastructure code
        id: detect
        run: |
          [ -d infra/tofu ] && echo "tofu=true" >> "$GITHUB_OUTPUT"
          [ -d infra/ansible ] && echo "ansible=true" >> "$GITHUB_OUTPUT"
          find . -name '*.sh' -not -path './node_modules/*' -not -path './dist/*' -not -path './.claude/*' | grep -q . && echo "shell=true" >> "$GITHUB_OUTPUT"
          true
      - uses: opentofu/setup-opentofu@v2
        if: steps.detect.outputs.tofu == 'true' && needs.changes.outputs.infra == 'true'
      - if: steps.detect.outputs.tofu == 'true' && needs.changes.outputs.infra == 'true'
        run: |
          set -euo pipefail
          tofu fmt -check -recursive infra/tofu
          for env in dev-libvirt rehearsal-libvirt; do
            (cd "infra/tofu/environments/$env" && tofu init -backend=false && tofu validate)
          done
      - name: Cache Ansible collections
        id: collections
        if: steps.detect.outputs.ansible == 'true' && needs.changes.outputs.infra == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('infra/ansible/requirements.yml') }}
      - name: Install Ansible collections
        if: steps.detect.outputs.ansible == 'true' && needs.changes.outputs.infra == 'true' && steps.collections.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml
      - if: steps.detect.outputs.ansible == 'true' && needs.changes.outputs.infra == 'true'
        run: pipx install ansible-lint && ansible-lint infra/ansible
      - name: shellcheck
        if: steps.detect.outputs.shell == 'true' && needs.changes.outputs.infra == 'true'
        # age is for the backup scope test below.
        run: sudo apt-get install -y shellcheck age && find . -name '*.sh' -not -path './node_modules/*' -not -path './dist/*' -not -path './.claude/*' -print0 | xargs -0 shellcheck && shellcheck packaging/scripts/* infra/host/portikus-backup-export
      - name: Smoke test cleanup scope
        if: steps.detect.outputs.shell == 'true' && needs.changes.outputs.infra == 'true'
        run: bash infra/tests/cleanup-scope-test.sh
      - name: Security test cleanup scope
        if: steps.detect.outputs.shell == 'true' && needs.changes.outputs.infra == 'true'
        run: bash infra/tests/security-cleanup-scope-test.sh
      - name: Clipboard shim
        if: steps.detect.outputs.shell == 'true' && needs.changes.outputs.infra == 'true'
        run: bash infra/tests/clipboard-shim-test.sh
      - name: Caddy preview routes
        if: steps.detect.outputs.shell == 'true' && needs.changes.outputs.infra == 'true'
        run: bash infra/tests/caddy-preview-test.sh
      - name: LTI platforms file
        if: steps.detect.outputs.shell == 'true' && needs.changes.outputs.infra == 'true'
        run: bash infra/tests/lti-platforms-test.sh
      - name: Backup scope
        if: steps.detect.outputs.shell == 'true' && needs.changes.outputs.infra == 'true'
        run: bash infra/tests/backup-scope-test.sh
