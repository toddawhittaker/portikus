name: CI

on:
  pull_request:
    branches: [main, "epic/**"]
  push:
    branches: [main, "epic/**"]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: Application checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: portikus
          POSTGRES_DB: portikus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Detect application code
        id: detect
        run: |
          if [ -f pnpm-workspace.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No pnpm workspace yet; skipping."; fi
      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck
      - if: steps.detect.outputs.present == 'true'
        run: pnpm lint
      - if: steps.detect.outputs.present == 'true'
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:portikus@127.0.0.1:5432/portikus_test
      - if: steps.detect.outputs.present == 'true'
        run: pnpm build
      - name: Cache nfpm
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/portikus/nfpm
          key: nfpm-${{ runner.os }}-${{ hashFiles('scripts/build-deb.sh') }}
      # A build-only check: the package is not kept, so the version does not matter.
      - name: Build Debian package
        if: steps.detect.outputs.present == 'true'
        run: pnpm build:deb
        env:
          PORTIKUS_VERSION: 0.0.0+ci

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v7
      - name: Detect end-to-end tests
        id: detect
        run: |
          if [ -f pnpm-workspace.yaml ] && grep -q '"test:e2e"' package.json; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No test:e2e script yet; skipping."; fi
      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: steps.detect.outputs.present == 'true'
        run: pnpm test:e2e

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect infrastructure code
        id: detect
        run: |
          [ -d infra/tofu ] && echo "tofu=true" >> "$GITHUB_OUTPUT"
          [ -d infra/ansible ] && echo "ansible=true" >> "$GITHUB_OUTPUT"
          find . -name '*.sh' -not -path './node_modules/*' -not -path './.claude/*' | grep -q . && echo "shell=true" >> "$GITHUB_OUTPUT"
          true
      - uses: opentofu/setup-opentofu@v2
        if: steps.detect.outputs.tofu == 'true'
      - if: steps.detect.outputs.tofu == 'true'
        run: tofu fmt -check -recursive infra/tofu && cd infra/tofu/environments/dev-libvirt && tofu init -backend=false && tofu validate
      - name: Cache Ansible collections
        id: collections
        if: steps.detect.outputs.ansible == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('infra/ansible/requirements.yml') }}
      - name: Install Ansible collections
        if: steps.detect.outputs.ansible == 'true' && steps.collections.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml
      - if: steps.detect.outputs.ansible == 'true'
        run: pipx install ansible-lint && ansible-lint infra/ansible
      - name: shellcheck
        if: steps.detect.outputs.shell == 'true'
        run: sudo apt-get install -y shellcheck && find . -name '*.sh' -not -path './node_modules/*' -not -path './.claude/*' -print0 | xargs -0 shellcheck && shellcheck packaging/scripts/*
