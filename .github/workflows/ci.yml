name: CI

on:
  pull_request:
    branches: [main, "epic/**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: Application checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect application code
        id: detect
        run: |
          if [ -f pnpm-workspace.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No pnpm workspace yet; skipping."; fi
      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck
      - if: steps.detect.outputs.present == 'true'
        run: pnpm lint
      - if: steps.detect.outputs.present == 'true'
        run: pnpm test
      - if: steps.detect.outputs.present == 'true'
        run: pnpm build

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v7
      - name: Detect end-to-end tests
        id: detect
        run: |
          if [ -f pnpm-workspace.yaml ] && grep -q '"test:e2e"' package.json; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No test:e2e script yet; skipping."; fi
      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.detect.outputs.present == 'true'
        run: pnpm test:e2e

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect infrastructure code
        id: detect
        run: |
          [ -d infra/tofu ] && echo "tofu=true" >> "$GITHUB_OUTPUT"
          [ -d infra/ansible ] && echo "ansible=true" >> "$GITHUB_OUTPUT"
          find . -name '*.sh' -not -path './node_modules/*' | grep -q . && echo "shell=true" >> "$GITHUB_OUTPUT"
          true
      - uses: opentofu/setup-opentofu@v2
        if: steps.detect.outputs.tofu == 'true'
      - if: steps.detect.outputs.tofu == 'true'
        run: tofu fmt -check -recursive infra/tofu && cd infra/tofu/environments/dev-libvirt && tofu init -backend=false && tofu validate
      - if: steps.detect.outputs.ansible == 'true'
        run: pipx install --include-deps ansible-lint && ansible-galaxy collection install --force -r infra/ansible/requirements.yml && ansible-lint infra/ansible
      - name: shellcheck
        if: steps.detect.outputs.shell == 'true'
        run: sudo apt-get install -y shellcheck && find . -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 shellcheck
