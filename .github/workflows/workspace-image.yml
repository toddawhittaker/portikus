name: Workspace image

# Builds the workspace image and publishes it as the release image-<VERSION>
# with a signed SHA256SUMS (docs/EPIC-15.md, ruling 19).
on:
  push:
    branches: [main]
    paths:
      - infra/workspace-image/**
  # Prove the build on a pull request; publish never runs there.
  pull_request:
    branches: [main, "epic/**"]
    paths:
      - infra/workspace-image/**
      - .github/workflows/workspace-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-image
  cancel-in-progress: false

jobs:
  build:
    name: Build the image
    # Pinned: the build depends on the host's debootstrap and distrobuilder behaviour, and ubuntu-latest moves to 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(cat infra/workspace-image/VERSION)"
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || { echo "bad VERSION $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          exists=false
          if gh release view "image-$VERSION" >/dev/null 2>&1; then
            echo "Release image-$VERSION already exists; bump infra/workspace-image/VERSION to publish."
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          # A pull request always builds, to prove the recipe; publish never runs there.
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$exists" == false ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      # The same pinned commit the image_builder role builds (docs/adr/0004).
      - name: Read the distrobuilder commit
        if: steps.version.outputs.build == 'true'
        id: distrobuilder
        run: |
          COMMIT="$(sed -n 's/^ *image_builder_distrobuilder_commit: *"\([0-9a-f]\{40\}\)".*/\1/p' infra/ansible/site.yml)"
          [[ -n "$COMMIT" ]] || { echo "distrobuilder commit not found in infra/ansible/site.yml" >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        if: steps.version.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debootstrap squashfs-tools rsync gnupg pkg-config libgpgme-dev libbtrfs-dev
      - name: Cache distrobuilder
        if: steps.version.outputs.build == 'true'
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/portikus/distrobuilder
          key: distrobuilder-${{ runner.os }}-${{ steps.distrobuilder.outputs.commit }}
      - name: Fetch distrobuilder source
        if: steps.version.outputs.build == 'true' && steps.cache.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ steps.distrobuilder.outputs.commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/distrobuilder"
          cd "$RUNNER_TEMP/distrobuilder"
          git init -q
          git remote add origin https://github.com/lxc/distrobuilder.git
          git fetch -q --depth 1 origin "$COMMIT"
          git checkout -q FETCH_HEAD
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.version.outputs.build == 'true' && steps.cache.outputs.cache-hit != 'true'
        with:
          go-version-file: ${{ runner.temp }}/distrobuilder/go.mod
          # The built binary is cached instead, keyed by commit.
          cache: false
      - name: Build distrobuilder
        if: steps.version.outputs.build == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP/distrobuilder"
          mkdir -p ~/.cache/portikus/distrobuilder
          go build -o ~/.cache/portikus/distrobuilder/distrobuilder ./distrobuilder
      - name: Build the image
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          sudo PORTIKUS_IMAGE_VERSION="$VERSION" ~/.cache/portikus/distrobuilder/distrobuilder build-incus \
            infra/workspace-image/portikus.yaml out \
            -o image.serial="$VERSION" \
            -o image.release=trixie
          sudo chown -R "$(id -u):$(id -g)" out
      # T6 extends this with packages and tool versions (ruling 24).
      - name: Write the manifest and checksums
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DISTROBUILDER_COMMIT: ${{ steps.distrobuilder.outputs.commit }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg recipe_version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg distrobuilder "$DISTROBUILDER_COMMIT" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, source: "published", recipe_version: $recipe_version, commit: $commit, distrobuilder_commit: $distrobuilder, built_at: $built_at}' \
            > out/manifest.json
          cd out
          for f in incus.tar.xz rootfs.squashfs manifest.json; do
            size="$(stat -c %s "$f")"
            # GitHub refuses release assets of 2 GiB or more.
            if (( size >= 2147483648 )); then
              echo "$f is $size bytes, over the 2 GiB release asset limit" >&2
              exit 1
            fi
          done
          sha256sum incus.tar.xz rootfs.squashfs manifest.json > SHA256SUMS
      - name: Upload the image
        if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-image
          path: |
            out/incus.tar.xz
            out/rootfs.squashfs
            out/manifest.json
            out/SHA256SUMS
          compression-level: 0
          retention-days: 1

  publish:
    name: Sign and publish the image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.exists == 'false'
    # Signing happens here, away from the root build, and only this job can
    # read APT_SIGNING_KEY.
    environment: publish
    permissions:
      contents: write
    steps:
      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workspace-image
          path: out
      - name: Verify checksums and sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          cd out
          sha256sum -c SHA256SUMS
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import 2>/dev/null
          gpg --batch --yes --armor --detach-sign -o SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "image-$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Workspace image $VERSION" \
            --notes "Workspace image built from $GITHUB_SHA. Verify SHA256SUMS.asc with portikus-archive-keyring.gpg, then SHA256SUMS." \
            --latest=false \
            out/incus.tar.xz out/rootfs.squashfs out/manifest.json out/SHA256SUMS out/SHA256SUMS.asc
