<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ConfirmDialog</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{position:'relative',height:'470px',overflow:'hidden'}},
 h(P.ConfirmDialog,{inline:true,id:'rb',title:'Reset Docker?',
  description:'Docker will start empty. Your files are not affected.',
  lost:['Docker images and containers','Docker volumes, including database data'],
  survives:['Projects & home folder','Recovery points'],
  confirmText:'reset docker', typedValue:'reset', confirmLabel:'Reset Docker'})
));
</script>
</body>
</html>
