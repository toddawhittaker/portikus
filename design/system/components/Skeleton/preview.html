<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Skeleton</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{padding:'16px 20px',display:'grid',gridTemplateColumns:'220px 1fr',gap:'24px'}},
 h('div',{style:{background:'var(--surface-sunken)',padding:'12px',display:'grid',gap:'10px'}},
  [80,64,72,48,90,56].map(function(w,i){return h('div',{key:i,style:{display:'flex',gap:'8px',alignItems:'center',paddingLeft:(i%3)*16+'px'}},h(P.Skeleton,{variant:'block',width:'14px',height:'14px'}),h(P.Skeleton,{width:w+'%'}));})),
 h('div',{style:{display:'grid',gap:'12px',alignContent:'start'}},
  h(P.Skeleton,{variant:'block',width:'40%',height:'20px'}),
  h(P.Skeleton,{lines:3}),
  h(P.Skeleton,{variant:'block',height:'64px'}))
));
</script>
</body>
</html>
