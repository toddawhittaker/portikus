<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Menu</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
function noop() {}
function open(trigger, menu){ return h(P.MenuRoot,{open:true,modal:false,onOpenChange:noop}, h(P.MenuTrigger,{asChild:true},trigger), menu); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'demo',style:{alignItems:'flex-start',gap:'200px'}},
 open(h(P.IconButton,{icon:'plus',label:'New tab'}),
  h(P.Menu,{label:'New tab',align:'start'},
   h(P.MenuLabel,null,'Open in todo-api'),
   h(P.MenuItem,{icon:'terminal',shortcut:['Mod','Alt','T']},'Terminal'),
   h(P.MenuItem,{icon:'agent'},'Claude Code'),
   h(P.MenuItem,{icon:'agent'},'Codex'),
   h(P.MenuItem,{icon:'file',shortcut:['Mod','Alt','N']},'File'),
   h(P.MenuItem,{icon:'preview'},'Preview'))),
 open(h(P.IconButton,{icon:'more',label:'Workspace actions'}),
  h(P.Menu,{label:'Workspace actions',align:'start'},
   h(P.MenuItem,{icon:'play'},'Start'),
   h(P.MenuItem,{icon:'stop'},'Stop'),
   h(P.MenuItem,{icon:'restart',disabled:true},'Restart'),
   h(P.MenuSeparator),
   h(P.MenuItem,{icon:'trash',danger:true},'Reset Docker…'),
   h(P.MenuItem,{icon:'lock',danger:true},'Revoke access…')))
));
</script>
</body>
</html>
