<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PaneHandle</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
function noop() {}
function side(text){ return h('div',{style:{width:'180px',background:'var(--surface-sunken)',padding:'10px 12px',color:'var(--ink-muted)',fontSize:'13px'}},text); }
// PaneHandle needs a react-resizable-panels Group around it, so this card draws the markup it renders.
function handle(label, state){ return h('div',{className:'pk-handle',role:'separator','aria-label':label,'aria-orientation':'vertical','data-orientation':'vertical','data-separator':state},h('span',{className:'pk-handle-grip'})); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{padding:'16px 20px'}},
 h('div',{style:{display:'flex',height:'200px',border:'1px solid var(--line)'}},
  side('Projects (idle handle)'),
  handle('Resize project list','inactive'),
  h('div',{style:{flex:1,background:'var(--surface-work)',padding:'10px 16px',color:'var(--ink-muted)',fontSize:'13px'}},'Work area'),
  handle('Resize file tree','hover'),
  side('Files (hover shows the grip)'),
  handle('Resize preview','active'),
  side('Dragging shows the focus colour'))
));
</script>
</body>
</html>
