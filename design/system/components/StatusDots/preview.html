<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusDots</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>
<style>
/* Copied from apps/web: these classes are not part of packages/ui, so bundle.css does not carry them. */
/* apps/web/src/app.css */
.pk-dot {
	flex: none;
	width: 8px;
	height: 8px;
	border-radius: var(--radius-full);
	background: currentColor;
}
.pk-tone-running {
	color: var(--status-running);
}
.pk-tone-warning {
	color: var(--status-warning);
}
.pk-tone-error {
	color: var(--status-error);
}
.pk-tone-starting {
	color: var(--status-starting);
}
.pk-tone-stopped {
	color: var(--status-stopped);
}
/* apps/web/src/course/glance.css */
.pk-class-sentence {
	display: flex;
	flex-wrap: wrap;
	align-items: baseline;
	gap: var(--space-1) var(--space-2);
	margin: 0;
	font-size: var(--text-lg);
	line-height: var(--leading-lg);
	color: var(--ink);
}
.pk-class-sentence strong {
	font-weight: 600;
}
.pk-class-sentence [data-tone="warning"] {
	color: var(--status-warning);
	font-weight: 600;
}
.pk-class-sentence [data-tone="error"] {
	color: var(--status-error);
	font-weight: 600;
}
.pk-class-sep {
	color: var(--ink-faint);
}
.pk-class-dots {
	display: flex;
	flex-wrap: wrap;
	gap: 6px;
	min-block-size: 10px;
}
.pk-class-dot {
	inline-size: 10px;
	block-size: 10px;
	border-radius: 50%;
	box-sizing: border-box;
	border: 1.5px solid var(--line-strong);
}
.pk-class-dot[data-kind="running"] {
	border-color: var(--status-running);
	background: var(--status-running);
}
.pk-class-dot[data-kind="waiting"] {
	border-color: var(--status-warning);
	background: var(--status-warning);
}
.pk-class-dot[data-kind="error"] {
	border-color: var(--status-error);
	background: var(--status-error);
}
.pk-class-dot[data-kind="moving"] {
	border-color: var(--status-starting);
	background: var(--status-starting);
}
.pk-class-dot[data-kind="none"] {
	border-style: dashed;
}
.pk-class-key {
	display: flex;
	flex-wrap: wrap;
	gap: var(--space-1) var(--space-4);
	margin: 0;
	padding: 0;
	list-style: none;
	font-size: var(--text-xs);
	line-height: var(--leading-xs);
	color: var(--ink-muted);
}
.pk-class-key > li {
	display: inline-flex;
	align-items: center;
	gap: var(--space-1\.5);
}
</style>
</head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
function noop() {}
var kinds=['waiting','waiting','error','running','running','running','moving','stopped','stopped','none'];
var key=[['waiting','Waiting for help'],['error','Workspace error'],['running','Running'],['moving','Starting or stopping'],['stopped','Stopped'],['none','No workspace yet']];
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{padding:'16px 20px',display:'grid',gap:'16px'}},
 h('div',null,h('p',{className:'demo-cap'},'A normal state on an administrator or course page: the plain StateBadge'),
  h('div',{style:{display:'flex',gap:'16px',alignItems:'center',flexWrap:'wrap'}},
   h(P.StateBadge,{state:'running',plain:true,statusRole:false}),h(P.StateBadge,{state:'stopped',plain:true,statusRole:false}),h(P.StateBadge,{state:'starting',desiredState:'running',plain:true,statusRole:false}),
   h('span',{style:{display:'inline-flex',gap:'6px',alignItems:'center',fontSize:'12px'}},h('span',{className:'pk-dot pk-tone-running','aria-hidden':true}),'All healthy'))),
 h('div',null,h('p',{className:'demo-cap'},'Class now: one dot per student, who needs the instructor first, with its key'),
  h('p',{className:'pk-class-sentence',style:{margin:'0 0 8px'}},h('strong',null,'10 students'),h('span',{className:'pk-class-sep'},' · '),'3 running',h('span',{className:'pk-class-sep'},' · '),h('span',{'data-tone':'warning'},'2 waiting for help')),
  h('span',{className:'pk-class-dots','aria-hidden':true},kinds.map(function(k,i){return h('span',{key:i,className:'pk-class-dot','data-kind':k});})),
  h('ul',{className:'pk-class-key','aria-hidden':true},key.map(function(k){return h('li',{key:k[0]},h('span',{className:'pk-class-dot','data-kind':k[0]}),k[1]);})))));
</script>
</body>
</html>
