<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SaveBar</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>
<style>
/* Copied from apps/web: these classes are not part of packages/ui, so bundle.css does not carry them. */
/* apps/web/src/admin/admin-frame.css */
.pk-setting-row[data-dirty] {
	box-shadow: inset 2px 0 0 var(--status-warning);
	padding-inline-start: var(--space-3);
}
.pk-save-footer[data-dirty] {
	position: sticky;
	inset-block-end: var(--space-3);
	z-index: 1;
	padding: var(--space-3) var(--space-4);
	border: 1px solid var(--line-strong);
	border-radius: var(--radius-md);
	background: var(--surface-raised);
	box-shadow: var(--shadow-md);
	animation: pk-save-rise var(--duration-fast) var(--ease-standard);
}
@keyframes pk-save-rise {
	from {
		opacity: 0;
		transform: translateY(8px);
	}
}
@media (prefers-reduced-motion: reduce) {
	.pk-save-footer[data-dirty] {
		animation: none;
	}
}
/* apps/web/src/app.css */
.pk-muted {
	color: var(--ink-muted);
}
@layer components {
	.pk-actions {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: var(--space-2);
	}
}
</style>
</head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
function noop() {}
function bar(dirty){
 return h('div',{className:'pk-save-footer','data-dirty':dirty?'':undefined,style:{display:'flex',flexWrap:'wrap',alignItems:'center',justifyContent:'space-between',gap:'12px 16px'}},
  h('div',{style:{display:'grid',gap:'4px',minWidth:0,flex:'1 1 16rem'}},
   h('p',{role:'status',style:{margin:0,fontWeight:dirty?600:400,color:dirty?'var(--ink)':'var(--ink-muted)'}},
    dirty?h('span',{'aria-hidden':true,style:{display:'inline-block',width:'8px',height:'8px',borderRadius:'9999px',background:'var(--status-warning)',marginInlineEnd:'8px',verticalAlign:'middle'}}):null,
    dirty?'2 unsaved changes':'No unsaved changes.')),
  h('div',{className:'pk-actions'},dirty?h(P.Button,null,'Discard changes'):null,h(P.Button,{variant:dirty?'primary':'secondary','aria-disabled':dirty?undefined:true},'Save limits')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'pk-course-main','data-density':'compact','data-controls':'console',style:{padding:'16px 20px',display:'grid',gap:'16px'}},
 h('div',null,h('p',{className:'demo-cap'},'A changed row carries an amber bar; the save row floats while anything is unsaved'),
  h('div',{className:'pk-setting-row','data-dirty':'',style:{paddingBlock:'6px'}},'Idle stop after ',h('strong',null,'45 minutes'),h('span',{className:'pk-muted'},' (default 60)')),
  h('div',{style:{marginTop:'12px'}},bar(true))),
 h('div',null,h('p',{className:'demo-cap'},'Nothing to save: the row rests in the flow, Save says why it will not act'),bar(false))));
</script>
</body>
</html>
