<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MoreMenu</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>
<style>
/* Copied from apps/web: these classes are not part of packages/ui, so bundle.css does not carry them. */
/* apps/web/src/console.css */
:is(.pk-adminframe-scroll, .pk-course-main, [data-controls="console"])[data-density] {
	--pk-control: var(--size-control-md);
	--pk-pad: var(--density-comfortable-pad);
	--pk-font: var(--density-comfortable-font);
	--size-control-sm: var(--size-control-md);
}
:is(.pk-adminframe-scroll, .pk-course-main, [data-controls="console"]) .pk-btn {
	font-size: var(--text-md);
	padding-inline: var(--space-3);
}
@media (width < 35rem) {
	:is(.pk-adminframe-scroll, .pk-course-main) :is(.pk-btn, .pk-iconbtn, select, input:not([type="checkbox"], [type="radio"])) {
		min-height: var(--size-control-lg);
	}
}
</style>
</head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
function noop() {}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'pk-course-main','data-density':'compact','data-controls':'console',style:{padding:'16px 20px'}},
 h('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end',maxWidth:'420px'}},
  h(P.Button,{variant:'primary'},'Add user…'),
  h(P.MenuRoot,{open:true,modal:false},
   h(P.MenuTrigger,{asChild:true},h(P.Button,{iconEnd:'chevron-down'},'More')),
   h(P.Menu,{label:'More ways to add people',align:'end'},h(P.MenuItem,{onSelect:noop},'Invite…'),h(P.MenuItem,{onSelect:noop},'Import from CSV…'))))));
</script>
</body>
</html>
