<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}

<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
function noop() {}
var names=['terminal','agent','file','file-code','file-web','file-style','file-data','file-markdown','file-image','file-archive','file-config','file-text','file-pdf','file-sheet','file-notebook','file-audio','file-video','file-font','file-lock','file-key','file-python','file-java','file-javascript','file-typescript','file-c','file-cpp','file-sql','file-shell','file-go','file-rust','file-csharp','file-ruby','file-php','file-kotlin','file-swift','folder','folder-open','preview','plus','minus','x','pencil','more','chevron-right','chevron-down','chevron-up','chevron-up-down','external','alert','check','bell','info','help','arrow-left','arrow-right','arrow-up','download','search','play','stop','mic','speaker','restart','lock','grip','storage','trash','sign-out','users','activity','shield','school','list','clipboard-list','globe','archive','box','layers','settings','sign-in','copy','map-pin'];

</script>
</body>
</html>
