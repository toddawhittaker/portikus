<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EmptyState</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h(P.EmptyState,{icon:'folder',title:'No projects yet',
  actions:h(F,null,h(P.Button,{variant:'primary',iconStart:'plus'},'New project'),h(P.Button,{variant:'secondary'},'Clone a repository'))},
  'A project is a folder in your workspace. Create one, clone one from Git, or start from a template.'));
</script>
</body>
</html>
