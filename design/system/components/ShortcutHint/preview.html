<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ShortcutHint</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'demo',style:{gap:'28px'}},
 h('span',{style:{display:'inline-flex',gap:'8px',alignItems:'center'}},'Search in project',h(P.ShortcutHint,{keys:['Mod','Shift','F']})),
 h('span',{style:{display:'inline-flex',gap:'8px',alignItems:'center'}},'Same, on macOS',h(P.ShortcutHint,{keys:['Mod','Shift','F'],platform:'mac'})),
 h('span',{style:{display:'inline-flex',gap:'8px',alignItems:'center'}},'Plain, in menus',h(P.ShortcutHint,{keys:['Mod','Alt','T'],plain:true}))
));
</script>
</body>
</html>
