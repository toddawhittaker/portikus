<!-- @dsCard group="Overlays" height=340 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{position:'relative',height:'340px',overflow:'hidden'}},
 h(P.Dialog,{inline:true,id:'dlg',title:'New project',description:'A project is a folder in your workspace.',
  footer:h(F,null,h(P.Button,{variant:'secondary'},'Cancel'),h(P.Button,{variant:'primary'},'Create project'))},
  h('div',{style:{display:'grid',gap:'16px'}},
   h(P.TextField,{id:'pn',label:'Folder name',mono:true,defaultValue:'todo-api',hint:'Created at ~/projects/todo-api'}),
   h(P.Select,{id:'ps',label:'Start from',value:'empty',options:[{value:'empty',label:'Empty folder'},{value:'clone',label:'Clone a Git repository'}]})))
));
</script>
</body>
</html>
