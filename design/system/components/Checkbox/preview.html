<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
function noop() {}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{padding:'16px 20px',display:'grid',gap:'14px'}},
 h(P.Checkbox,{label:'Show hidden and generated files',description:'node_modules, .git, dist and similar folders.',onChange:noop}),
 h(P.Checkbox,{label:'Open preview in a new tab by default',checked:true,onChange:noop}),
 h(P.Checkbox,{label:'Select all projects',indeterminate:true,onChange:noop}),
 h(P.Checkbox,{label:'Keep recovery points (set by your program)',checked:true,disabled:true})
));
</script>
</body>
</html>
