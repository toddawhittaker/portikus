<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portikus</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .tile { fill:var(--brand-tile); }
  .stone { fill:var(--brand-stone); }
  .spark { fill:var(--brand-spark); }
  .words { position:absolute; left:var(--space-10); bottom:var(--space-10); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.92; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      the NameMark at 7x its 32-unit grid (224px): a brand-tile rounded square, the brand-stone portico (pediment, lintel, two columns, a step), a brand-spark prompt and cursor in the doorway
  arrangement the mark itself, centred in the box; no other shapes
  pattern     literal motif, from "Portikus is an entryway, not the destination": the portico frames the prompt
  colours     brand tokens only, so the mark reads the same in both themes
-->
<g transform="translate(128 32) scale(7)">
<path class="tile" d="M0 8a8 8 0 0 1 8-8h16a8 8 0 0 1 8 8v16a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z"/>
<path class="stone" d="M16 5.5 27 11.5H5z M6 12.5h20v2H6z M8 15.5h3.5v9H8z M20.5 15.5H24v9h-3.5z M5.5 25.5h21v2h-21z"/>
<path class="spark" d="M12.8 17.4 16.4 20l-3.6 2.6v-1.7l1.6-.9-1.6-.9z M16.8 21.6h2.8v1.4h-2.8z"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Portikus</h1>
<p class="tag">The entrance to a real workshop, kept calm.</p>
</div>
</div>
</body>
</html>
