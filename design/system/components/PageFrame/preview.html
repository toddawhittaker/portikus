<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PageFrame</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>
<style>
/* Copied from apps/web: these classes are not part of packages/ui, so bundle.css does not carry them. */
/* apps/web/src/console.css */
:is(.pk-adminframe-scroll, .pk-course-main, [data-controls="console"])[data-density] {
	--pk-control: var(--size-control-md);
	--pk-pad: var(--density-comfortable-pad);
	--pk-font: var(--density-comfortable-font);
	--size-control-sm: var(--size-control-md);
}
:is(.pk-adminframe-scroll, .pk-course-main, [data-controls="console"]) .pk-btn {
	font-size: var(--text-md);
	padding-inline: var(--space-3);
}

@media (width < 35rem) {
	:is(.pk-adminframe-scroll, .pk-course-main)[data-density] {
		--pk-control: var(--size-control-lg);
	}
	:is(.pk-adminframe-scroll, .pk-course-main)
		:is(.pk-btn, .pk-iconbtn, select, input:not([type="checkbox"], [type="radio"])) {
		min-height: var(--size-control-lg);
	}
	:is(.pk-adminframe-scroll, .pk-course-main) .pk-iconbtn {
		min-width: var(--size-control-lg);
	}

	:is(.pk-adminframe-scroll, .pk-course-main) .pk-check-box {
		inline-size: 20px;
		block-size: 20px;
	}

	:is(.pk-adminframe-scroll, .pk-course-main) .pk-segmented button {
		min-height: var(--size-control-lg);
		padding-inline: var(--space-4);
	}
	.pk-preset-row {
		align-items: center;
		padding-block: 0;
	}
	.pk-preset-row > label,
	.pk-preset-sites {
		min-height: var(--size-control-lg);
		align-items: center;
	}

	:is(.pk-adminframe-scroll, .pk-course-main)
		label:has(> input:is([type="checkbox"], [type="radio"])) {
		min-block-size: var(--size-control-lg);
	}

	:is(.pk-adminframe-scroll, .pk-course-main)
		.pk-table
		label:has(> input[type="checkbox"]) {
		min-inline-size: var(--size-control-lg);
		align-items: center;
		justify-content: center;
	}

	:is(.pk-adminframe-scroll, .pk-course-main)
		:is(.pk-table-sort, .pk-intro-body > .pk-link, .pk-entity-link, .pk-back-link) {
		display: inline-flex;
		align-items: center;
		min-block-size: var(--size-control-lg);
	}
	:is(.pk-adminframe-scroll, .pk-course-main) .pk-table-sort,
	:is(.pk-adminframe-scroll, .pk-course-main) .pk-log-toggle {
		min-inline-size: var(--size-control-lg);
		min-block-size: var(--size-control-lg);
	}

	:is(.pk-adminframe-scroll, .pk-course-main) summary {
		min-block-size: var(--size-control-lg);
		min-inline-size: var(--size-control-lg);
		align-items: center;
	}

	:is(.pk-adminframe-scroll, .pk-course-main) .pk-toggletip {
		position: relative;
	}
	:is(.pk-adminframe-scroll, .pk-course-main) .pk-toggletip::after {
		content: "";
		position: absolute;
		inset: -10px;
	}
}

@layer base {
	:is(.pk-adminframe-scroll, .pk-course-main) p {
		max-inline-size: 52ch;
	}
}

:is(.pk-adminframe-scroll, .pk-course-main) .pk-table thead th {
	height: 36px;
	background: var(--surface-raised);
	color: var(--ink-muted);
	font-size: 11px;
	line-height: var(--leading-xs);
	font-weight: 600;
	letter-spacing: 0.06em;
	text-transform: uppercase;
}
:is(.pk-adminframe-scroll, .pk-course-main) .pk-table thead th :is(button, a) {
	letter-spacing: inherit;
	text-transform: inherit;
}
:is(.pk-adminframe-scroll, .pk-course-main) .pk-table :is(td, th).pk-num {
	font-variant-numeric: tabular-nums;
	text-align: end;
}
:is(.pk-adminframe-scroll, .pk-course-main)
	.pk-table
	tbody
	tr[aria-selected="true"]
	> :is(td, th) {
	background: var(--accent-soft);
}
:is(.pk-adminframe-scroll, .pk-course-main)
	.pk-table
	tbody
	tr[aria-selected="true"]
	> :first-child {
	box-shadow: inset 2px 0 0 var(--accent);
}

:is(.pk-adminframe-scroll, .pk-course-main) .pk-table .pk-iconbtn {
	color: var(--ink);
}
:is(.pk-adminframe-scroll, .pk-course-main) .pk-table .pk-iconbtn > .pk-icon {
	width: 18px;
	height: 18px;
}

.pk-admin-page {
	display: flex;
	flex-direction: column;
	gap: var(--space-4);
	min-width: 0;
}
.pk-admin-page[data-measure="form"] {
	max-width: 52rem;
}
.pk-admin-head {
	display: grid;
	gap: var(--space-1);
	padding-block-end: var(--space-2);
}

.pk-admin-head .pk-intro-wrap {
	max-width: none;
	display: flex;
	flex-wrap: wrap;
	align-items: baseline;
	column-gap: var(--space-3);
	row-gap: var(--space-1);
}
.pk-admin-head .pk-intro-wrap > .pk-intro[open] {
	flex-basis: 100%;
}

.pk-kv {
	display: grid;
	grid-template-columns: 10.5rem minmax(0, 1fr);
	column-gap: var(--space-4);
	row-gap: var(--space-2);
	margin: 0;
	font-size: var(--text-sm);
	line-height: var(--leading-md);
	font-variant-numeric: tabular-nums;
}
.pk-kv dt {
	color: var(--ink-muted);
}
.pk-kv dd {
	margin: 0;
	min-width: 0;
}

@container (width >= 48rem) {
	.pk-kv--pairs {
		grid-template-columns: 10.5rem minmax(0, 1fr) 10.5rem minmax(0, 1fr);
	}
	.pk-kv--pairs > dt:nth-of-type(2n) {
		padding-inline-start: var(--space-8);
	}
}
@container (width < 30rem) {
	.pk-kv {
		grid-template-columns: minmax(0, 1fr);
		row-gap: 0;
	}
	.pk-kv dt {
		font-size: var(--text-xs);
		font-weight: 600;
	}
	.pk-kv dd + dt {
		margin-block-start: var(--space-3);
	}
}

.pk-stats {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr));
	gap: var(--space-4);
	margin: 0;
}
.pk-stat {
	display: flex;
	flex-direction: column;
	gap: var(--space-1);
	min-width: 0;
	padding: var(--space-4) var(--space-5);
	background: var(--surface-raised);
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
}
.pk-stat[data-tone="warning"] {
	border-inline-start: 4px solid var(--status-warning);
}
.pk-stat dd {
	margin: 0;
}
.pk-stat-label {
	font-size: var(--text-xs);
	line-height: var(--leading-xs);
	font-weight: 600;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: var(--ink-muted);
}
.pk-stat-value {
	font-size: 28px;
	line-height: 36px;
	font-weight: 600;
	letter-spacing: -0.01em;
	font-variant-numeric: tabular-nums;
	color: var(--ink);
}
.pk-stat-of {
	margin-inline-start: 2px;
	font-size: var(--text-md);
	font-weight: 500;
	letter-spacing: 0;
	color: var(--ink-muted);
}
.pk-stat-foot {
	display: grid;
	gap: var(--space-2);
	font-size: var(--text-xs);
	line-height: var(--leading-xs);
	color: var(--ink-muted);
	font-variant-numeric: tabular-nums;
}
.pk-stat-meter.pk-meter-bar {
	block-size: 6px;
	border-radius: 3px;
}
@media (width < 35rem) {
	.pk-stats {
		grid-template-columns: repeat(2, minmax(0, 1fr));
		gap: var(--space-3);
	}
	.pk-stat {
		padding: var(--space-3) var(--space-4);
	}
}

.pk-admin-title {
	font-size: 28px;
	line-height: 36px;
	letter-spacing: -0.015em;
}
:is(.pk-adminframe-scroll, .pk-course-main) .pk-text-heading {
	font-size: 18px;
	line-height: 26px;
	letter-spacing: -0.005em;
}
.pk-overline {
	margin: 0;
	font-size: 11px;
	line-height: var(--leading-xs);
	font-weight: 600;
	letter-spacing: 0.06em;
	text-transform: uppercase;
	color: var(--ink-muted);
}
:is(.pk-adminframe-scroll, .pk-course-main) .pk-group-label {
	font-size: 11px;
	letter-spacing: 0.06em;
	text-transform: uppercase;
}

.pk-eyebrow {
	display: flex;
	align-items: center;
	gap: var(--space-2);
	margin: 0;
	min-width: 0;
	font-size: var(--text-sm);
	line-height: var(--leading-sm);
	color: var(--ink-muted);
}
.pk-eyebrow > .pk-portico {
	flex: none;
	color: var(--accent-text);
}
.pk-eyebrow-sep {
	color: var(--ink-faint);
}
.pk-eyebrow-code {
	color: var(--ink);
}

.pk-back-link {
	justify-self: start;
	gap: var(--space-1);
	border-radius: var(--radius-sm);
	color: var(--accent-text);
	text-decoration: none;
}
.pk-back-link:hover {
	text-decoration: underline;
	text-underline-offset: 3px;
}

:where(.pk-portico) {
	stroke: currentColor;
	stroke-width: 1.5;
	stroke-linecap: round;
	stroke-linejoin: round;
}
.pk-portico-tick {
	stroke: var(--status-running);
	stroke-width: 1.75;
}

.pk-quiet {
	display: flex;
	align-items: center;
	gap: var(--space-3);
	min-height: 56px;
	padding: var(--space-3) var(--space-4);
	border: 1px dashed var(--line);
	border-radius: var(--radius-md);
}
.pk-quiet-mark {
	display: grid;
	place-items: center;
	flex: none;
	inline-size: 36px;
	block-size: 36px;
	border-radius: var(--radius-md);
	background: var(--surface-sunken);
	color: var(--ink-muted);
}
.pk-quiet[data-variant="clear"] .pk-quiet-mark {
	color: var(--accent-text);
}
.pk-quiet-text {
	flex: 1;
	min-width: 0;
	display: grid;
	gap: 2px;
}
.pk-quiet-title {
	margin: 0;
	font-size: var(--text-md);
	line-height: var(--leading-md);
	font-weight: 600;
	color: var(--ink);
}
.pk-quiet-detail {
	margin: 0;
	font-size: var(--text-sm);
	line-height: var(--leading-sm);
	color: var(--ink-muted);
}
.pk-quiet-action {
	flex: none;
}

.pk-attention {
	display: grid;
	margin: 0;
	padding: 0;
	list-style: none;
	background: var(--surface-raised);
	border: 1px solid var(--line);
	border-inline-start: 3px solid var(--status-warning);
	border-radius: var(--radius-md);
}
.pk-attention[data-tone="error"] {
	border-inline-start-color: var(--status-error);
}
.pk-attention-row {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: var(--space-2) var(--space-4);
	padding: var(--space-3) var(--space-4);
}
.pk-attention-row + .pk-attention-row {
	border-block-start: 1px solid var(--line);
}
.pk-attention-icon {
	flex: none;
	color: var(--status-warning);
}
.pk-attention-text {
	flex: 1 1 18rem;
	min-width: 0;
	display: grid;
	gap: 2px;
}
.pk-attention-title {
	margin: 0;
	font-size: var(--text-md);
	line-height: var(--leading-md);
	font-weight: 600;
}
.pk-attention-detail {
	margin: 0;
	font-size: var(--text-sm);
	line-height: var(--leading-sm);
	color: var(--ink-muted);
}
.pk-attention-actions {
	display: flex;
	flex-wrap: wrap;
	gap: var(--space-2);
}

.pk-workbench {
	display: grid;
	grid-template-columns: minmax(0, 1fr);
	gap: var(--space-4);
	align-items: start;
}
@container admin-scroll (width >= 62rem) {
	.pk-workbench[data-inspecting] {
		grid-template-columns: minmax(0, 1fr) 24rem;
	}
}
.pk-inspector {
	display: flex;
	flex-direction: column;
	min-width: 0;
	background: var(--surface-raised);
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
	animation: pk-inspector-in var(--duration-base) var(--ease-standard);
}
@container admin-scroll (width >= 62rem) {
	.pk-inspector {
		position: sticky;
		top: 0;
		max-block-size: calc(100cqh - var(--space-6));
		overflow: hidden;
	}
	.pk-inspector-body {
		overflow-y: auto;
		scrollbar-width: thin;
	}
}
.pk-inspector-head {
	display: grid;
	gap: var(--space-2);
	padding: var(--space-4) var(--space-4) var(--space-3);
	border-block-end: 1px solid var(--line);
}
.pk-inspector-body {
	display: grid;
	gap: var(--space-5);
	padding: var(--space-4);
	min-height: 0;
}
@keyframes pk-inspector-in {
	from {
		opacity: 0;
		transform: translateX(8px);
	}
}
@media (prefers-reduced-motion: reduce) {
	.pk-inspector {
		animation: none;
	}
}

.pk-stat-value {
	font-family: var(--font-mono);
	font-weight: 500;
	letter-spacing: -0.02em;
}
.pk-stat-of {
	font-family: var(--font-sans);
}
.pk-stat-label {
	font-size: 11px;
	letter-spacing: 0.06em;
}

.pk-stats--strip {
	gap: 0;
	background: var(--surface-raised);
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
	overflow: hidden;
}
.pk-stats--strip > .pk-stat {
	border: 0;
	border-radius: 0;
	box-shadow: inset 1px 0 0 var(--line);
	margin-inline-start: -1px;
	padding: var(--space-4) var(--space-5);
}
.pk-stats--strip > .pk-stat[data-tone="warning"] {
	border-inline-start: 0;
	box-shadow:
		inset 1px 0 0 var(--line),
		inset 0 3px 0 var(--status-warning);
}
@media (width < 35rem) {
	.pk-stats--strip > .pk-stat {
		box-shadow:
			inset 1px 0 0 var(--line),
			inset 0 -1px 0 var(--line);
	}
}

.pk-entity-link {
	color: var(--ink);
	font-weight: 600;
	text-decoration: none;
	border-radius: 2px;
}
.pk-entity-link:hover,
.pk-entity-link:focus-visible {
	text-decoration: underline;
	text-decoration-color: var(--accent);
	text-underline-offset: 3px;
}
.pk-entity-link:focus-visible {
	outline: var(--ring-width) solid var(--focus);
	outline-offset: var(--ring-offset);
}

.pk-nav-link {
	display: inline-flex;
	align-items: center;
	gap: var(--space-1);
	align-self: flex-start;
	min-height: 28px;
	color: var(--accent-text);
	font-size: var(--text-sm);
	font-weight: 600;
	text-decoration: none;
}
.pk-nav-link:hover {
	text-decoration: underline;
	text-underline-offset: 3px;
}

.pk-table tbody tr.pk-row-selected > td {
	background: var(--accent-soft);
}

.pk-inspector-tabs.pk-pane-tabs {
	background: var(--surface-raised);
	padding-inline: var(--space-2);
}
.pk-inspector-tabs .pk-pane-tab[aria-selected="true"] {
	background: transparent;
}
.pk-inspector-tab-mark {
	inline-size: 6px;
	block-size: 6px;
	border-radius: 50%;
	background: var(--status-warning);
}
.pk-inspector-panel:is([hidden], [data-state="inactive"]) {
	display: none;
}
.pk-inspector-panel > .pk-detail-section:first-child {
	border-top: 0;
}
.pk-inspector-panel:focus-visible {
	outline: var(--ring-width) solid var(--focus);
	outline-offset: var(--ring-offset-inset);
}

@container admin-scroll (width >= 35rem) {
	.pk-toolbar .pk-label {
		position: absolute;
		width: 1px;
		height: 1px;
		overflow: hidden;
		clip-path: inset(50%);
		white-space: nowrap;
	}
}

.pk-dl .pk-guard-flag > svg {
	display: inline-block;
	margin-inline-end: var(--space-1\.5);
	vertical-align: -2px;
}

.pk-admin-statusbar .pk-statusbar-usage {
	column-gap: var(--space-4);
}
.pk-statusbar-label {
	font-weight: 500;
	color: var(--ink);
}
a.pk-statusbar-item {
	box-sizing: border-box;
	height: 24px;
	padding: 0 var(--space-2);
	border: 1px solid var(--line-strong);
	border-radius: var(--radius-sm);
	color: var(--ink);
	text-decoration: none;
}
a.pk-statusbar-item:hover {
	background: var(--surface-hover);
}
a.pk-statusbar-item:focus-visible {
	outline: var(--ring-width) solid var(--focus);
	outline-offset: var(--ring-offset-inset);
}
.pk-admin-statusbar-state[data-tone="warning"] {
	border-color: var(--status-warning);
}
.pk-admin-statusbar .pk-admin-statusbar-state[data-tone="warning"] > svg {
	color: var(--status-warning);
}
@media (width < 35rem) {
	.pk-admin-statusbar-extra,
	.pk-admin-statusbar .pk-statusbar-where {
		display: none;
	}
	a.pk-statusbar-item {
		height: var(--size-control-lg);
	}
}

@media (width < 35rem) {
	.pk-admin-head > .pk-eyebrow:not(.pk-back-link) {
		display: none;
	}
}
/* apps/web/src/admin/admin-frame.css */
.pk-adminframe {
	display: flex;
	flex-direction: column;
	height: 100%;
}
.pk-adminframe-scroll {
	position: relative;
	flex: 1;
	min-height: 0;
	overflow: auto;
	scrollbar-gutter: stable;
	container: admin-scroll / size;
}
@media (height < 30rem) {
	.pk-adminframe {
		height: auto;
	}
	.pk-adminframe-scroll {
		flex: 1 1 0;
		min-inline-size: 0;
		container-type: inline-size;
	}
	.pk-adminnav {
		position: sticky;
		inset-block-start: 0;
		align-self: flex-start;
		max-block-size: 100dvh;
	}
}
.pk-adminframe {
	flex-direction: row;
	gap: var(--space-6);
}
.pk-adminnav {
	flex: none;
	inline-size: 12rem;
	min-height: 0;
	overflow-y: auto;
	padding-block: var(--space-4);
	padding-inline-end: var(--space-3);
	border-inline-end: 1px solid var(--line);
	scrollbar-width: thin;
}
@media (width >= 64rem) {
	.pk-adminnav {
		inline-size: 14.5rem;
	}
}
.pk-adminnav-list {
	display: flex;
	flex-direction: column;
	gap: var(--space-5);
}
.pk-adminnav-group {
	display: flex;
	flex-direction: column;
	gap: var(--space-0\.5);
	min-width: 0;
}
.pk-adminnav-group-label {
	margin: 0 0 var(--space-1);
	padding-inline: var(--space-3);
	font-size: 11px;
	line-height: var(--leading-xs);
	font-weight: 600;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: var(--ink-faint);
}
.pk-adminnav-group:has([data-testid="admin-tab-shell"]) {
	padding-block-start: var(--space-4);
	border-block-start: 1px solid var(--line);
}
.pk-adminnav-group:has([data-testid="admin-tab-shell"]) .pk-adminnav-group-label {
	display: none;
}
.pk-adminnav-tabs {
	display: flex;
	flex-direction: column;
	gap: var(--space-0\.5);
}
.pk-adminnav-link {
	position: relative;
	display: flex;
	align-items: center;
	gap: var(--space-2);
	min-height: var(--size-control-sm);
	padding-block: var(--space-1);
	padding-inline: var(--space-3);
	border-radius: var(--radius-sm);
	color: var(--ink-muted);
	font-size: var(--text-md);
	line-height: var(--leading-md);
	text-decoration: none;
	outline: none;
}
.pk-adminnav-link > svg {
	flex: none;
	color: var(--ink-faint);
}
.pk-adminnav-link > span {
	min-width: 0;
	overflow-wrap: anywhere;
}
.pk-adminnav-link:hover {
	background: var(--surface-hover);
	color: var(--ink);
}
.pk-adminnav-link:focus-visible {
	outline: var(--ring-width) solid var(--focus);
	outline-offset: var(--ring-offset-inset);
}
.pk-adminnav-link[aria-current="page"] {
	background: var(--surface-selected);
	color: var(--ink);
	font-weight: 600;
}
.pk-adminnav-link[aria-current="page"] > svg {
	color: var(--accent-text);
}
.pk-adminnav-link[aria-current="page"]::before {
	content: "";
	position: absolute;
	inset-inline-start: 0;
	inset-block: var(--space-1);
	inline-size: 2px;
	border-radius: 1px;
	background: var(--accent);
