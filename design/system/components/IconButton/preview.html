<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IconButton</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'demo',style:{alignItems:'flex-start'}},
  h(P.IconButton,{icon:'plus',label:'New tab',shortcut:['Mod','Alt','T'],tooltipOpen:true}),
  h('span',{style:{width:'72px'}}),
  h(P.IconButton,{icon:'search',label:'Search in project'}),
  h(P.IconButton,{icon:'more',label:'Project actions'}),
  h(P.IconButton,{icon:'external',label:'Open preview in new tab',variant:'secondary'}),
  h(P.IconButton,{icon:'folder',label:'Toggle file tree','aria-pressed':true}),
  h(P.IconButton,{icon:'x',label:'Close',size:'sm'})
));
</script>
</body>
</html>
