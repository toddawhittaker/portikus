<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Table</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
var rows=[
 {id:'w1',user:'Avery Chen',email:'achen12@example.edu',state:'running',desired:'running',active:'2 min ago',storage:'6.2 / 20 GB',image:'2026.09.1'},
 {id:'w2',user:'Jordan Ellis',email:'jellis4@example.edu',state:'error',desired:'running',active:'1 hr ago',storage:'19.8 / 20 GB',image:'2026.09.1'},
 {id:'w3',user:'Priya Natarajan',email:'pnatara@example.edu',state:'stopped',desired:'running',active:'just now',storage:'3.4 / 20 GB',image:'2026.08.3'},
 {id:'w4',user:'Sam Okafor',email:'sokafor@example.edu',state:'stopped',desired:'stopped',active:'3 days ago',storage:'11.0 / 20 GB',image:'2026.08.3'}];
var cols=[
 {key:'user',header:'Student',sortable:true,sort:'asc',render:function(r){return h('div',null,h('div',{style:{fontWeight:500}},r.user),h('div',{style:{color:'var(--ink-muted)',fontSize:'12px',lineHeight:'16px'}},r.email));}},
 {key:'state',header:'State',sortable:true,render:function(r){return h(P.StateBadge,{state:r.state,desiredState:r.desired});}},
 {key:'active',header:'Last activity',sortable:true,muted:true},
 {key:'storage',header:'Docker storage',align:'right',mono:true},
 {key:'image',header:'Image',mono:true,muted:true},
 {key:'actions',header:'Actions',render:function(r){return h(P.IconButton,{icon:'more',label:'Actions for '+r.user,size:'sm'});}}];
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{'data-density':'compact',style:{padding:'16px 20px'}}, h(P.Table,{label:'Workspaces',columns:cols,rows:rows,selectedKey:'w2'})));
</script>
</body>
</html>
