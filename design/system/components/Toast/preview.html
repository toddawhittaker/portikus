<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
</style></head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
function noop() {}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{height:'356px'}},
 h(P.ToastProvider,null,
  h(P.Toast,{tone:'danger',title:'Your workspace could not start',persistent:true,
   actions:h(F,null,h(P.Button,{size:'sm',variant:'primary'},'Reset Docker…'),h(P.Button,{size:'sm',variant:'secondary'},'View details'))},
   'Its storage allocation is full. Docker is using 19.8 GB of your 20 GB Docker quota.'),
  h(P.Toast,{tone:'warning',title:'Projects and home is 82% full',persistent:true,actions:h(P.Button,{size:'sm',variant:'secondary'},'Review storage')},'4.1 GB of 5 GB used.'),
  h(P.Toast,{tone:'success',title:'Recovery point created',persistent:true},'“Before refactor” · just now'))
));
</script>
</body>
</html>
