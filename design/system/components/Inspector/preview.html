<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inspector</title>
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}
.demo{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-col{display:grid;gap:12px}
.demo-cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>
<style>
/* Copied from apps/web: these classes are not part of packages/ui, so bundle.css does not carry them. */
/* apps/web/src/console.css */
.pk-kv {
	display: grid;
	grid-template-columns: 10.5rem minmax(0, 1fr);
	column-gap: var(--space-4);
	row-gap: var(--space-2);
	margin: 0;
	font-size: var(--text-sm);
	line-height: var(--leading-md);
	font-variant-numeric: tabular-nums;
}
.pk-kv dt {
	color: var(--ink-muted);
}
.pk-kv dd {
	margin: 0;
	min-width: 0;
}
@container (width < 30rem) {
	.pk-kv {
		grid-template-columns: minmax(0, 1fr);
		row-gap: 0;
	}
	.pk-kv dt {
		font-size: var(--text-xs);
		font-weight: 600;
	}
	.pk-kv dd + dt {
		margin-block-start: var(--space-3);
	}
}
:is(.pk-adminframe-scroll, .pk-course-main) .pk-text-heading {
	font-size: 18px;
	line-height: 26px;
	letter-spacing: -0.005em;
}
.pk-overline {
	margin: 0;
	font-size: 11px;
	line-height: var(--leading-xs);
	font-weight: 600;
	letter-spacing: 0.06em;
	text-transform: uppercase;
	color: var(--ink-muted);
}
.pk-inspector {
	display: flex;
	flex-direction: column;
	min-width: 0;
	background: var(--surface-raised);
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
	animation: pk-inspector-in var(--duration-base) var(--ease-standard);
}
@container admin-scroll (width >= 62rem) {
	.pk-inspector {
		position: sticky;
		top: 0;
		max-block-size: calc(100cqh - var(--space-6));
		overflow: hidden;
	}
	.pk-inspector-body {
		overflow-y: auto;
		scrollbar-width: thin;
	}
}
.pk-inspector-head {
	display: grid;
	gap: var(--space-2);
	padding: var(--space-4) var(--space-4) var(--space-3);
	border-block-end: 1px solid var(--line);
}
.pk-inspector-body {
	display: grid;
	gap: var(--space-5);
	padding: var(--space-4);
	min-height: 0;
}
@keyframes pk-inspector-in {
	from {
		opacity: 0;
		transform: translateX(8px);
	}
}
@media (prefers-reduced-motion: reduce) {
	.pk-inspector {
		animation: none;
	}
}
.pk-nav-link {
	display: inline-flex;
	align-items: center;
	gap: var(--space-1);
	align-self: flex-start;
	min-height: 28px;
	color: var(--accent-text);
	font-size: var(--text-sm);
	font-weight: 600;
	text-decoration: none;
}
.pk-nav-link:hover {
	text-decoration: underline;
	text-underline-offset: 3px;
}
.pk-inspector-tabs.pk-pane-tabs {
	background: var(--surface-raised);
	padding-inline: var(--space-2);
}
.pk-inspector-tabs .pk-pane-tab[aria-selected="true"] {
	background: transparent;
}
.pk-inspector-tab-mark {
	inline-size: 6px;
	block-size: 6px;
	border-radius: 50%;
	background: var(--status-warning);
}
.pk-inspector-panel:is([hidden], [data-state="inactive"]) {
	display: none;
}
.pk-inspector-panel > .pk-detail-section:first-child {
	border-top: 0;
}
.pk-inspector-panel:focus-visible {
	outline: var(--ring-width) solid var(--focus);
	outline-offset: var(--ring-offset-inset);
}
.pk-dl .pk-guard-flag > svg {
	display: inline-block;
	margin-inline-end: var(--space-1\.5);
	vertical-align: -2px;
}
/* apps/web/src/shell/right-pane.css */
.pk-pane-tabs {
	flex: none;
	display: flex;
	flex-wrap: nowrap;
	align-items: stretch;
	gap: 0;
	box-sizing: border-box;
	height: var(--density-comfortable-tab);
	padding: 0 var(--space-2);
	background: var(--surface);
	border-bottom: 1px solid var(--line);
	overflow-x: auto;
	overflow-y: hidden;
	scrollbar-width: none;
	scroll-padding-inline: var(--space-2);
}
.pk-pane-tabs::-webkit-scrollbar {
	display: none;
}
.pk-pane-tab {
	position: relative;
	flex: none;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-1\.5);
	border: 0;
	background: transparent;
	color: var(--ink-muted);
	font: inherit;
	font-size: var(--text-md);
	line-height: var(--leading-md);
	font-weight: 400;
	white-space: nowrap;
	padding: 0;
	cursor: pointer;
}
.pk-pane-tab-face {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-1\.5);
	align-self: stretch;
	flex: 1 0 auto;
	padding: 0 var(--space-3);
}
.pk-pane-tab-face > svg {
	flex: none;
}
.pk-pane-tab:hover {
	background: var(--surface-hover);
	color: var(--ink);
}
.pk-pane-tab[aria-selected="true"] {
	background: var(--surface-raised);
	color: var(--ink);
}
.pk-pane-tab[aria-selected="true"] .pk-pane-tab-face > svg {
	color: var(--accent-text);
}
.pk-pane-tab[aria-selected="true"]::before {
	content: "";
	position: absolute;
	inset-inline: 0;
	inset-block-end: -1px;
	height: 2px;
	background: var(--accent);
}
@media (forced-colors: active) {
	.pk-pane-tab[aria-selected="true"]::before {
		forced-color-adjust: none;
		background: Highlight;
	}
}
.pk-pane-tab:focus-visible {
	outline: var(--ring-width) solid var(--focus);
	outline-offset: var(--ring-offset-inset);
}
.pk-pane-tab[data-pointer]:focus-visible {
	outline: none;
}
@container pk-right (width < 30rem) {
	.pk-pane-tab {
		font-size: var(--text-sm);
	}
	.pk-pane-tab-face {
		padding-inline: var(--space-2);
	}
	.pk-pane-tab-face > svg {
		display: none;
	}
}
@container pk-right (width < 22rem) {
	.pk-pane-tab {
		flex: 1 0 auto;
		min-inline-size: var(--size-control-md);
	}
	.pk-pane-tab-face {
		padding-inline: var(--space-2);
	}
	.pk-pane-tab-face > svg {
		display: inline-block;
	}
	.pk-pane-tab[aria-selected="false"] .pk-pane-tab-label {
		position: absolute;
		width: 1px;
		height: 1px;
		overflow: hidden;
		clip-path: inset(50%);
		white-space: nowrap;
	}
}
/* apps/web/src/app.css */
.pk-text-heading {
	margin: 0;
	font-size: var(--text-lg);
	line-height: var(--leading-lg);
	font-weight: 600;
}
.pk-mono-small {
	font-family: var(--font-mono);
	font-variant-ligatures: none;
	font-size: 12px;
	line-height: 16px;
}
.pk-muted {
	color: var(--ink-muted);
}
@layer components {
	.pk-actions {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: var(--space-2);
	}
	.pk-card {
		box-sizing: border-box;
		background: var(--surface-raised);
		border: 1px solid var(--line);
		border-radius: var(--radius-md);
	}
}
.pk-tag {
	display: inline-flex;
	align-items: center;
	box-sizing: border-box;
	height: var(--size-badge);
	padding: 0 var(--space-2);
	border-radius: var(--radius-sm);
	background: var(--status-stopped-soft);
	border: 0;
	color: var(--status-stopped);
	font-size: var(--text-xs);
	line-height: var(--leading-xs);
	font-weight: 600;
	white-space: nowrap;
	flex: none;
}
.pk-tag[data-quiet] {
	gap: var(--space-1);
	padding: 0;
	background: none;
	color: var(--status-running);
}
.pk-tag--warning {
	background: var(--status-warning-soft);
	border-color: transparent;
	color: var(--status-warning);
}
.pk-detail-head {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: var(--space-3);
	padding: var(--space-4);
}
.pk-detail-section {
	display: grid;
	gap: var(--space-3);
	padding: var(--space-4);
	border-top: 1px solid var(--line);
}
.pk-dl {
	display: grid;
	grid-template-columns: max-content 1fr;
	column-gap: var(--space-4);
	row-gap: var(--space-1);
	margin: 0;
	font-size: var(--text-md);
	line-height: var(--leading-md);
}
.pk-dl dt {
	color: var(--ink-muted);
}
.pk-dl dd {
	margin: 0;
}
.pk-dot {
	flex: none;
	width: 8px;
	height: 8px;
	border-radius: var(--radius-full);
	background: currentColor;
}
.pk-tone-running {
	color: var(--status-running);
}
.pk-tone-warning {
	color: var(--status-warning);
}
.pk-tone-error {
	color: var(--status-error);
}
.pk-tone-starting {
	color: var(--status-starting);
}
.pk-tone-stopped {
	color: var(--status-stopped);
}
</style>
</head>
<body>
<div id="root" class="pk-root"></div>
<script>
var P = window.Portikus, h = React.createElement, F = React.Fragment;
function noop() {}
var tabs=[['overview','activity','Overview',true],['activity','list','Activity'],['account','users','Account']];

 var st=React.useState('overview'), tab=st[0], setTab=st[1];
 return h('section',{className:'pk-card','aria-labelledby':'in-title',style:{maxWidth:'400px',display:'flex',flexDirection:'column'}},

    h('div',{style:{display:'grid',gap:'2px'}},h('h3',{id:'in-title',className:'pk-text-heading',style:{margin:0}},'Diego Santos'),h('span',{className:'pk-mono-small pk-muted'},'ws-dsantos')),

   h(P.TabsContent,{value:'activity',forceMount:true,className:'pk-inspector-panel'},
    h('section',{className:'pk-detail-section'},h('h4',{className:'pk-overline'},'Processes'),h('p',{className:'pk-muted',style:{margin:0}},'node server.js, python3 app.py'))),
   h(P.TabsContent,{value:'account',forceMount:true,className:'pk-inspector-panel'},
    h('section',{className:'pk-detail-section'},h('h4',{className:'pk-overline'},'Account'),h('dl',{className:'pk-dl'},h('dt',null,'Email'),h('dd',null,'dsantos@example.edu'),h('dt',null,'Role'),h('dd',null,'Student'))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{'data-density':'compact','data-controls':'console',className:'pk-course-main',style:{padding:'16px 20px'}},h(Inspector)));
</script>
</body>
</html>
