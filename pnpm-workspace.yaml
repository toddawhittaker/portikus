packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # node-pty compiles a native addon; the workspace agent needs real PTYs.
  node-pty: true
  # protobufjs only prints a version notice on install; nothing to build.
  protobufjs: false
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1
  - '@tanstack/query-core@5.103.1'
  - '@tanstack/react-query@5.103.1'
  - jsdom@30.1.1
# The chat host runs the workspace's shared Claude Code binary (SPEC.md
# §10.1), so the Agent SDK's bundled platform CLIs are never installed.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
# monaco-editor 0.57.0 pins dompurify 3.4.15 exactly, which has open
# Dependabot alerts. Remove this once monaco-editor depends on 3.4.17 or later.
overrides:
  dompurify: 3.4.17
