# gitleaks configuration. Extends the built-in rules.
[extend]
useDefault = true

[allowlist]
description = "Files that legitimately contain secret-shaped strings"
paths = [
  '''\.env\.example$''',
  '''pnpm-lock\.yaml$''',
  # Hashes a test password published on purpose: sample-password-not-secret.
  '''infra/tests/fixtures/users\.sample\.json$''',
]
# RFC 6455's published sample Sec-WebSocket-Key ("the sample nonce"), used by
# infra/tests/caddy-preview-test.sh.
# A task branch commit (Epic 69 T12) whose Playwright spec used a fake AI key
# shaped like a real one; the next commit replaced it and the branch is
# squash-merged, so the commit never reaches main.
# Epic 70 T5b's commit bf860b8e did the same in e2e/admin-ai-triage.spec.ts.
commits = [
  '''0bb15c34fdb4139c4eb612fc2537fbd2f3fe25bf''',
  '''bf860b8eda8887eca4e792c2b7e198314d7cba53''',
]
regexes = [
  '''dGhlIHNhbXBsZSBub25jZQ''',
  # RFC 6238's published test secret "12345678901234567890" in base32, used
  # by infra/tests/totp_test.py.
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
]
