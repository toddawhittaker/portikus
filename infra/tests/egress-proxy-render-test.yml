---
# Renders the egress proxy's squid configuration from a sample allow list and
# checks the rules and their order, with no VM (ADR 0027), then checks which
# sign-in hosts each Dex connector puts on the list.  `make infra-check`
# runs it.  The rehearsal VM checks the same rules against a running squid.
- name: Render and check the egress proxy configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    egress_proxy_port: 3128
    egress_proxy_allowed:
      - login.microsoftonline.com:443
      - sso.canvaslms.com:443
      - keys.example.edu:8443
      - 192.168.10.48:8765
    egress_proxy_site_host: portikus.192.168.10.48.nip.io
    egress_proxy_site_port: "8443"
    egress_proxy_denied_ranges: [10.0.0.0/8, 127.0.0.0/8, 192.168.0.0/16, fc00::/7]

  tasks:
    - name: Render the configuration
      ansible.builtin.set_fact:
        egress_render: "{{ lookup('ansible.builtin.template', '../ansible/roles/egress_proxy/templates/squid.conf.j2') }}"

    - name: Keep only the rule lines, in order
      ansible.builtin.set_fact:
        egress_rules: "{{ egress_render.splitlines() | reject('match', '^(#|$)') | list }}"

    - name: Check the rules
      ansible.builtin.assert:
        that:
          - "'http_port 127.0.0.1:3128' in egress_rules"
          - "'cache deny all' in egress_rules"
          - "'acl portikus_private dst 10.0.0.0/8 127.0.0.0/8 192.168.0.0/16 fc00::/7' in egress_rules"
          # Loopback clients only, first; nothing but the listed rules after; deny last.
          - egress_rules | select('match', '^http_access') | first == 'http_access deny !localhost'
          - egress_rules | select('match', '^http_access') | last == 'http_access deny all'
          # The site is reached by name at loopback, on its own port.
          - "'acl portikus_site dstdomain -n portikus.192.168.10.48.nip.io' in egress_rules"
          - "'acl portikus_site_port port 8443' in egress_rules"
          - "'http_access allow portikus_connect portikus_site portikus_site_port portikus_site_address' in egress_rules"
          # A listed address is allowed exactly, on its port, before the private rule.
          - "'acl portikus_address_1 dst 192.168.10.48' in egress_rules"
          - "'acl portikus_address_1_port port 8765' in egress_rules"
          - egress_rules.index('http_access allow portikus_fetch portikus_address_1 portikus_address_1_port')
            < egress_rules.index('http_access deny portikus_private')
          # Host names on 443 are allowed by CONNECT only, after the private rule.
          - "'acl portikus_hosts_443 dstdomain -n login.microsoftonline.com sso.canvaslms.com' in egress_rules"
          - "'acl portikus_hosts_8443 dstdomain -n keys.example.edu' in egress_rules"
          - egress_rules.index('http_access deny portikus_private')
            < egress_rules.index('http_access allow portikus_connect portikus_hosts_443 portikus_port_443')
          # A host listed with its own port may also get plain HTTP there.
          - egress_rules.index('http_access deny portikus_private')
            < egress_rules.index('http_access allow portikus_fetch portikus_hosts_8443 portikus_port_8443')
          # No name is ever matched by reverse DNS.
          - egress_rules | select('search', ' dstdomain ') | reject('search', ' dstdomain -n ') | list | length == 0
          # Any unlisted address given directly is refused before the names.
          - egress_rules.index('http_access allow portikus_fetch portikus_address_1 portikus_address_1_port')
            < egress_rules.index('http_access deny portikus_ip_literal')
          - egress_rules.index('http_access deny portikus_ip_literal')
            < egress_rules.index('http_access allow portikus_connect portikus_hosts_443 portikus_port_443')
          # No address rule names a host, and no host rule names an address.
          - egress_rules | select('search', 'dstdomain .*192\.168\.10\.48( |$)') | list | length == 0
        fail_msg: "{{ egress_render }}"

    - name: Check which hosts count as an address given directly
      ansible.builtin.assert:
        quiet: true
        that:
          - (item.host is search(ip_literal[0], ignorecase=true) or item.host is search(ip_literal[1])) == item.literal
        fail_msg: "{{ item.host }}"
      loop:
        - {host: 1.1.1.1, literal: true}
        - {host: "2130706433", literal: true}
        - {host: 0x7f.1, literal: true}
        - {host: "2606:4700::1111", literal: true}
        - {host: "[2606:4700::1111]", literal: true}
        - {host: login.microsoftonline.com, literal: false}
        - {host: 1.1.1.1.nip.io, literal: false}
        - {host: cafe.be, literal: false}
      vars:
        ip_literal: "{{ (egress_rules | select('match', '^acl portikus_ip_literal dstdom_regex -n -i ') | first).split()[5:] }}"

    - name: Render with no site and no listed hosts
      ansible.builtin.set_fact:
        egress_empty: >-
          {{ lookup('ansible.builtin.template', '../ansible/roles/egress_proxy/templates/squid.conf.j2',
                    template_vars={'egress_proxy_allowed': [], 'egress_proxy_site_host': ''})
             .splitlines() | select('match', '^http_access') | list }}

    - name: Check that an empty list lets nothing out
      ansible.builtin.assert:
        that:
          - egress_empty == ['http_access deny !localhost', 'http_access deny portikus_ip_literal', 'http_access deny portikus_private', 'http_access deny all']
        fail_msg: "{{ egress_empty }}"

    # ── The sign-in hosts (SPEC.md section 5.1) ─────────
    # Only Dex's connector reaches a provider.  This renders site.yml's own
    # rule, then builds the list with the role's own tasks from sample
    # discovery documents.
    - name: Make a working directory
      ansible.builtin.tempfile:
        state: directory
      register: egress_workdir

    - name: Copy site.yml's discovery rule to a template
      ansible.builtin.copy:
        content: >-
          {{ ((lookup('ansible.builtin.file', playbook_dir ~ '/../ansible/site.yml') | from_yaml)[0].roles
              | selectattr('role', 'equalto', 'egress_proxy') | first).vars.egress_proxy_discovery }}
        dest: "{{ egress_workdir.path }}/discovery.j2"
        mode: "0600"

    - name: Render the discovery list for each sign-in setup
      ansible.builtin.set_fact:
        egress_discovery: >-
          {{ egress_discovery | default({}) | combine({item.name: (lookup('ansible.builtin.template', egress_workdir.path ~ '/discovery.j2',
               template_vars={'portikus_idp': item.idp, 'portikus_dex_upstream': item.upstream,
                              'portikus_entra_issuer': egress_entra_issuer,
                              'portikus_google_issuer': 'https://accounts.google.com',
                              'portikus_dex_upstream_issuer': 'https://sso.example.edu/oauth2/default'}) | trim | from_yaml)}) }}
      loop:
        - {name: none, idp: dex, upstream: none}
        - {name: ldap, idp: dex, upstream: ldap}
        - {name: entra, idp: dex, upstream: entra}
        - {name: google, idp: dex, upstream: google}
        - {name: oidc, idp: dex, upstream: oidc}
        - {name: mock, idp: mock, upstream: entra}
      vars:
        egress_entra_issuer: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/v2.0

    - name: Check each connector's discovery source
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_discovery.none == []
          - egress_discovery.ldap == []
          - egress_discovery.mock == []
          - "egress_discovery.entra == [{'issuer': 'https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/v2.0', 'userinfo': false}]"
          - "egress_discovery.google == [{'issuer': 'https://accounts.google.com', 'userinfo': true}]"
          - "egress_discovery.oidc == [{'issuer': 'https://sso.example.edu/oauth2/default', 'userinfo': true}]"
        fail_msg: "{{ egress_discovery | to_json }}"

    # Entra's real v2.0 document names Microsoft Graph as its userinfo endpoint.
    - name: Build an Entra site's allow list with the role's tasks
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/allow_list.yml
      vars:
        egress_proxy_hosts: []
        egress_proxy_discovery_documents:
          results:
            - item: "{{ egress_discovery.entra[0] }}"
              json:
                issuer: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/v2.0
                authorization_endpoint: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/oauth2/v2.0/authorize
                token_endpoint: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/oauth2/v2.0/token
                jwks_uri: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/discovery/v2.0/keys
                userinfo_endpoint: https://graph.microsoft.com/oidc/userinfo

    - name: Check an Entra site reaches the tenant's hosts and not Microsoft Graph
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_proxy_allowed == ['login.microsoftonline.com:443']
        fail_msg: "{{ egress_proxy_allowed }}"

    - name: Build an OIDC site's allow list with the role's tasks
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/allow_list.yml
      vars:
        egress_proxy_hosts: []
        egress_proxy_discovery_documents:
          results:
            - item: "{{ egress_discovery.oidc[0] }}"
              json:
                issuer: https://sso.example.edu/oauth2/default
                authorization_endpoint: https://sso.example.edu/oauth2/default/v1/authorize
                token_endpoint: https://sso.example.edu/oauth2/default/v1/token
                jwks_uri: https://keys.example.edu/oauth2/default/v1/keys
                userinfo_endpoint: https://userinfo.example.edu/v1/userinfo

    - name: Check an OIDC site reaches its provider's hosts, userinfo included
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_proxy_allowed == ['keys.example.edu:443', 'sso.example.edu:443', 'userinfo.example.edu:443']
        fail_msg: "{{ egress_proxy_allowed }}"

    - name: Remove the working directory
      ansible.builtin.file:
        path: "{{ egress_workdir.path }}"
        state: absent
