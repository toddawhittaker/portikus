---
# Renders the egress proxy's squid configuration from a sample allow list and
# checks the rules and their order, with no VM (ADR 0027), then checks which
# sign-in hosts each Dex connector puts on the list.  `make infra-check`
# runs it.  The rehearsal VM checks the same rules against a running squid.
- name: Render and check the egress proxy configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    egress_proxy_port: 3128
    egress_proxy_site_host: portikus.192.168.10.48.nip.io
    egress_proxy_site_port: "8443"
    egress_proxy_denied_ranges: [10.0.0.0/8, 127.0.0.0/8, 192.168.0.0/16, fc00::/7]
    egress_proxy_include_dir: /etc/portikus/egress-proxy.d

  tasks:
    - name: Build a sample allow list with the role's tasks
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/allow_list.yml
      vars:
        egress_proxy_hosts: [login.microsoftonline.com, sso.canvaslms.com:443, keys.example.edu:8443, 192.168.10.48:8765]
        egress_proxy_discovery_documents: {results: []}

    - name: Render the configuration
      ansible.builtin.set_fact:
        egress_render: "{{ lookup('ansible.builtin.template', '../ansible/roles/egress_proxy/templates/squid.conf.j2') }}"

    - name: Keep only the rule lines, in order
      ansible.builtin.set_fact:
        egress_rules: "{{ egress_render.splitlines() | reject('match', '^(#|$)') | list }}"

    - name: Check the rules
      ansible.builtin.assert:
        that:
          - "'http_port 127.0.0.1:3128' in egress_rules"
          - "'cache deny all' in egress_rules"
          - "'acl portikus_private dst 10.0.0.0/8 127.0.0.0/8 192.168.0.0/16 fc00::/7' in egress_rules"
          # Loopback clients only, first; nothing but the listed rules after; deny last.
          - egress_rules | select('match', '^http_access') | first == 'http_access deny !localhost'
          - egress_rules | select('match', '^http_access') | last == 'http_access deny all'
          # The site is reached by name at loopback, on its own port.
          - "'acl portikus_site dstdomain -n portikus.192.168.10.48.nip.io' in egress_rules"
          - "'acl portikus_site_port port 8443' in egress_rules"
          - "'http_access allow portikus_connect portikus_site portikus_site_port portikus_site_address' in egress_rules"
          # A listed address is allowed exactly, on its port, before the private rule.
          - "'acl portikus_address_1 dst 192.168.10.48' in egress_rules"
          - "'acl portikus_address_1_port port 8765' in egress_rules"
          - egress_rules.index('http_access allow portikus_fetch portikus_address_1 portikus_address_1_port')
            < egress_rules.index('http_access deny portikus_private')
          # Host names on 443 are allowed by CONNECT only, after the private rule.
          - "'acl portikus_hosts_443 dstdomain -n login.microsoftonline.com sso.canvaslms.com' in egress_rules"
          - "'acl portikus_hosts_8443 dstdomain -n keys.example.edu' in egress_rules"
          - egress_rules.index('http_access deny portikus_private')
            < egress_rules.index('http_access allow portikus_connect portikus_hosts_443 portikus_port_443')
          # A host listed with its own port may also get plain HTTP there.
          - egress_rules.index('http_access deny portikus_private')
            < egress_rules.index('http_access allow portikus_fetch portikus_hosts_8443 portikus_port_8443')
          # No name is ever matched by reverse DNS.
          - egress_rules | select('search', ' dstdomain ') | reject('search', ' dstdomain -n ') | list | length == 0
          # Any unlisted address given directly is refused before the names.
          - egress_rules.index('http_access allow portikus_fetch portikus_address_1 portikus_address_1_port')
            < egress_rules.index('http_access deny portikus_ip_literal')
          - egress_rules.index('http_access deny portikus_ip_literal')
            < egress_rules.index('http_access allow portikus_connect portikus_hosts_443 portikus_port_443')
          # Included rules, such as the alert hosts (ADR 0052), come after
          # both address denies and before the final deny.
          - "'include /etc/portikus/egress-proxy.d/*.conf' in egress_rules"
          - egress_rules.index('http_access deny portikus_ip_literal')
            < egress_rules.index('include /etc/portikus/egress-proxy.d/*.conf')
          - egress_rules.index('http_access deny portikus_private')
            < egress_rules.index('include /etc/portikus/egress-proxy.d/*.conf')
          - egress_rules.index('include /etc/portikus/egress-proxy.d/*.conf')
            == egress_rules.index('http_access deny all') - 1
          # No address rule names a host, and no host rule names an address.
          - egress_rules | select('search', 'dstdomain .*192\.168\.10\.48( |$)') | list | length == 0
        fail_msg: "{{ egress_render }}"

    - name: Check which hosts count as an address given directly
      ansible.builtin.assert:
        quiet: true
        that:
          - (item.host is search(ip_literal[0], ignorecase=true) or item.host is search(ip_literal[1])) == item.literal
        fail_msg: "{{ item.host }}"
      loop:
        - {host: 1.1.1.1, literal: true}
        - {host: "2130706433", literal: true}
        - {host: 0x7f.1, literal: true}
        - {host: "2606:4700::1111", literal: true}
        - {host: "[2606:4700::1111]", literal: true}
        - {host: login.microsoftonline.com, literal: false}
        - {host: 1.1.1.1.nip.io, literal: false}
        - {host: cafe.be, literal: false}
      vars:
        ip_literal: "{{ (egress_rules | select('match', '^acl portikus_ip_literal dstdom_regex -n -i ') | first).split()[5:] }}"

    - name: Render with no site and no listed hosts
      ansible.builtin.set_fact:
        egress_empty: >-
          {{ lookup('ansible.builtin.template', '../ansible/roles/egress_proxy/templates/squid.conf.j2',
                    template_vars={'egress_proxy_allowed': [], 'egress_proxy_host_entries': [], 'egress_proxy_site_host': ''})
             .splitlines() | select('match', '^http_access') | list }}

    - name: Check that an empty list lets nothing out
      ansible.builtin.assert:
        that:
          - egress_empty == ['http_access deny !localhost', 'http_access deny portikus_ip_literal', 'http_access deny portikus_private', 'http_access deny all']
        fail_msg: "{{ egress_empty }}"

    # ── The operator's hosts for the admin page (ADR 0059) ─────────
    # The same shape as the page's proxy-hosts.json, which the API reads.
    - name: Render the operator's proxy hosts
      ansible.builtin.set_fact:
        egress_operator_hosts: >-
          {{ lookup('ansible.builtin.template', '../ansible/roles/portikus/templates/operator-proxy-hosts.json.j2')
             | from_json }}

    - name: Check the operator's proxy hosts
      ansible.builtin.assert:
        quiet: true
        that:
          - "egress_operator_hosts == {'version': 1, 'hosts': ['keys.example.edu:8443', 'login.microsoftonline.com', 'sso.canvaslms.com']}"
        fail_msg: "{{ egress_operator_hosts | to_json }}"

    # ── The discovery fetch through Squid (ADR 0027) ─────────
    - name: Render the rule that lets setup read the providers
      ansible.builtin.set_fact:
        egress_setup_rules: >-
          {{ lookup('ansible.builtin.template', '../ansible/roles/egress_proxy/templates/discovery.conf.j2',
                    template_vars={'egress_proxy_discovery': [
                      {'issuer': 'https://login.example.edu/realms/main', 'userinfo': true},
                      {'issuer': 'https://sso.example.edu:8443/', 'userinfo': true},
                      {'issuer': 'https://10.0.0.5/', 'userinfo': true},
                      {'issuer': 'https://bad_host/', 'userinfo': true}]})
             .splitlines() | reject('match', '^(#|$)') | list }}

    - name: Check the rule names each provider by name and port, and nothing else
      ansible.builtin.assert:
        quiet: true
        that:
          - "egress_setup_rules == [
               'acl portikus_setup_discovery_1 dstdomain -n login.example.edu',
               'acl portikus_setup_discovery_1_port port 443',
               'http_access allow portikus_fetch portikus_setup_discovery_1 portikus_setup_discovery_1_port',
               'acl portikus_setup_discovery_2 dstdomain -n sso.example.edu',
               'acl portikus_setup_discovery_2_port port 8443',
               'http_access allow portikus_fetch portikus_setup_discovery_2 portikus_setup_discovery_2_port']"
        fail_msg: "{{ egress_setup_rules }}"

    # ── The first setup's address check, before Squid runs ─────────
    # Against the ranges site.yml gives the role.
    - name: Read the denied ranges from site.yml
      ansible.builtin.set_fact:
        egress_proxy_denied_ranges: >-
          {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../ansible/site.yml') | from_yaml)[0].vars.workspace_egress_denied_ranges }}

    - name: Pass providers that resolve only to internet addresses
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/issuer_check.yml
      vars:
        egress_proxy_issuer_lookups:
          results:
            - item: {issuer: https://login.example.edu}
              stdout_lines:
                - "93.184.216.34   STREAM login.example.edu"
                - "93.184.216.34   DGRAM"
                - "2606:2800:220:1:248:1893:25c8:1946 STREAM"

    - name: Refuse each private, loopback or link-local answer, and no answer
      ansible.builtin.include_tasks: egress-proxy-issuer-case.yml
      loop:
        - ["10.100.0.1      STREAM sso.example.edu"]
        - ["127.0.0.1       STREAM sso.example.edu"]
        - ["169.254.169.254 STREAM sso.example.edu"]
        - ["93.184.216.34   STREAM sso.example.edu", "192.168.10.48   STREAM"]
        - ["::1             STREAM sso.example.edu"]
        - ["fe80::1         STREAM sso.example.edu"]
        - ["fd00::1         STREAM sso.example.edu"]
        - ["::ffff:10.0.0.1 STREAM sso.example.edu"]
        - []
      loop_control:
        loop_var: egress_refused_lines

    # ── The discovery fetch itself ─────────
    # Before Squid runs, curl must use the address the check passed, not a
    # second lookup, and never follow a redirect anywhere.
    - name: Build the first setup's fetch commands with the role's tasks
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/discovery_commands.yml
      vars:
        egress_proxy_via_squid: false
        egress_proxy_discovery:
          - {issuer: "https://login.example.edu/", userinfo: true}
          - {issuer: "https://sso.example.edu:8443/realms/main", userinfo: true}
        egress_proxy_issuer_lookups:
          results:
            - stdout_lines: ["2606:2800:220:1:248:1893:25c8:1946 STREAM login.example.edu", "93.184.216.34   STREAM"]
            - stdout_lines: ["2606:2800:220:1:248:1893:25c8:1946 STREAM sso.example.edu"]

    - name: Check the first setup's fetch is pinned, HTTPS only, with no redirect
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_proxy_discovery_commands | length == 2
          - egress_fetch[0][:10] == ['curl', '--silent', '--show-error', '--proto', '=https', '--max-redirs', '0', '--max-time', '30', '--write-out']
          # curl itself turns the two characters \n into a newline.
          - egress_fetch[0][10] == '\\n%{http_code}'
          - "'--location' not in egress_fetch[0] and '-L' not in egress_fetch[0]"
          - egress_fetch[0][11:] == ['--noproxy', '*', '--resolve', 'login.example.edu:443:93.184.216.34', 'https://login.example.edu/.well-known/openid-configuration']
          - egress_fetch[1][11:] == ['--noproxy', '*', '--resolve', 'sso.example.edu:8443:[2606:2800:220:1:248:1893:25c8:1946]',
                                     'https://sso.example.edu:8443/realms/main/.well-known/openid-configuration']
        fail_msg: "{{ egress_fetch | to_json }}"
      vars:
        egress_fetch: "{{ egress_proxy_discovery_commands | map(attribute='argv') | list }}"

    - name: Build a re-run's fetch command through Squid with the role's tasks
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/discovery_commands.yml
      vars:
        egress_proxy_via_squid: true
        egress_proxy_discovery: [{issuer: "https://login.example.edu", userinfo: true}]
        egress_proxy_issuer_lookups: {results: [{skipped: true}]}

    - name: Check a re-run's fetch goes through Squid, with no redirect
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_proxy_discovery_commands[0].argv[5:7] == ['--max-redirs', '0']
          - egress_proxy_discovery_commands[0].argv[11:] == ['--proxy', 'http://127.0.0.1:3128', 'https://login.example.edu/.well-known/openid-configuration']
        fail_msg: "{{ egress_proxy_discovery_commands | to_json }}"

    - name: Read a provider's 200 answer with the role's tasks
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/discovery_documents.yml
      vars:
        egress_proxy_via_squid: false
        egress_proxy_discovery_fetches:
          results:
            - item: {item: {issuer: https://login.example.edu, userinfo: true}}
              rc: 0
              stdout: "{\"issuer\": \"https://login.example.edu\", \"jwks_uri\": \"https://keys.example.edu/k\"}\n200"
              stderr: ""

    - name: Check the document was read
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_proxy_discovery_documents.results | length == 1
          - egress_proxy_discovery_documents.results[0].item.issuer == 'https://login.example.edu'
          - egress_proxy_discovery_documents.results[0].json.jwks_uri == 'https://keys.example.edu/k'
        fail_msg: "{{ egress_proxy_discovery_documents | to_json }}"

    - name: Refuse each answer that is no document
      ansible.builtin.include_tasks: egress-proxy-discovery-case.yml
      loop:
        - fetch: {rc: 0, stdout: "<a href=\"https://10.0.0.1/doc\">moved</a>\n302", stderr: ""}
          message: "(a redirect to https://10.0.0.1/doc, which setup does not follow)"
        - fetch: {rc: 0, stdout: "\n307", stderr: ""}
          message: "(a redirect to another address, which setup does not follow)"
        - fetch: {rc: 60, stdout: "\n000", stderr: "curl: (60) SSL certificate problem\n"}
          message: "(curl: (60) SSL certificate problem)"
        - fetch: {rc: 0, stdout: "not found\n404", stderr: ""}
          message: "(HTTP status 404)"
        - fetch: {rc: 0, stdout: "<html>sign in</html>\n200", stderr: ""}
          message: "the answer is not JSON"
        - fetch: {rc: 0, stdout: "[1, 2]\n200", stderr: ""}
          message: "(the answer is not a JSON object)"
      loop_control:
        loop_var: egress_refused_fetch
        label: "{{ egress_refused_fetch.message }}"

    # ── The sign-in hosts (SPEC.md section 5.1) ─────────
    # Only Dex's connector reaches a provider.  This renders site.yml's own
    # rule, then builds the list with the role's own tasks from sample
    # discovery documents.
    - name: Make a working directory
      ansible.builtin.tempfile:
        state: directory
      register: egress_workdir

    - name: Copy site.yml's discovery rule to a template
      ansible.builtin.copy:
        content: >-
          {{ ((lookup('ansible.builtin.file', playbook_dir ~ '/../ansible/site.yml') | from_yaml)[0].roles
              | selectattr('role', 'equalto', 'egress_proxy') | first).vars.egress_proxy_discovery }}
        dest: "{{ egress_workdir.path }}/discovery.j2"
        mode: "0600"

    - name: Render the discovery list for each sign-in setup
      ansible.builtin.set_fact:
        egress_discovery: >-
          {{ egress_discovery | default({}) | combine({item.name: (lookup('ansible.builtin.template', egress_workdir.path ~ '/discovery.j2',
               template_vars={'portikus_dex_upstream': item.upstream,
                              'portikus_entra_issuer': egress_entra_issuer,
                              'portikus_google_issuer': 'https://accounts.google.com',
                              'portikus_dex_upstream_issuer': 'https://sso.example.edu/oauth2/default'}) | trim | from_yaml)}) }}
      loop:
        - {name: none, upstream: none}
        - {name: ldap, upstream: ldap}
        - {name: entra, upstream: entra}
        - {name: google, upstream: google}
        - {name: oidc, upstream: oidc}
      vars:
        egress_entra_issuer: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/v2.0

    - name: Check each connector's discovery source
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_discovery.none == []
          - egress_discovery.ldap == []
          - "egress_discovery.entra == [{'issuer': 'https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/v2.0', 'userinfo': false}]"
          - "egress_discovery.google == [{'issuer': 'https://accounts.google.com', 'userinfo': true}]"
          - "egress_discovery.oidc == [{'issuer': 'https://sso.example.edu/oauth2/default', 'userinfo': true}]"
        fail_msg: "{{ egress_discovery | to_json }}"

    # Entra's real v2.0 document names Microsoft Graph as its userinfo endpoint.
    - name: Build an Entra site's allow list with the role's tasks
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/allow_list.yml
      vars:
        egress_proxy_hosts: []
        egress_proxy_discovery_documents:
          results:
            - item: "{{ egress_discovery.entra[0] }}"
              json:
                issuer: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/v2.0
                authorization_endpoint: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/oauth2/v2.0/authorize
                token_endpoint: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/oauth2/v2.0/token
                jwks_uri: https://login.microsoftonline.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/discovery/v2.0/keys
                userinfo_endpoint: https://graph.microsoft.com/oidc/userinfo

    - name: Check an Entra site reaches the tenant's hosts and not Microsoft Graph
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_proxy_allowed == ['login.microsoftonline.com:443']
        fail_msg: "{{ egress_proxy_allowed }}"

    - name: Build an OIDC site's allow list with the role's tasks
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/allow_list.yml
      vars:
        egress_proxy_hosts: []
        egress_proxy_discovery_documents:
          results:
            - item: "{{ egress_discovery.oidc[0] }}"
              json:
                issuer: https://sso.example.edu/oauth2/default
                authorization_endpoint: https://sso.example.edu/oauth2/default/v1/authorize
                token_endpoint: https://sso.example.edu/oauth2/default/v1/token
                jwks_uri: https://keys.example.edu/oauth2/default/v1/keys
                userinfo_endpoint: https://userinfo.example.edu/v1/userinfo

    - name: Check an OIDC site reaches its provider's hosts, userinfo included
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_proxy_allowed == ['keys.example.edu:443', 'sso.example.edu:443', 'userinfo.example.edu:443']
        fail_msg: "{{ egress_proxy_allowed }}"

    # A provider's document must never open the management network or the
    # metadata service; only the operator's own list may name an address.
    - name: Build an allow list from a hostile discovery document
      ansible.builtin.include_tasks: ../ansible/roles/egress_proxy/tasks/allow_list.yml
      vars:
        egress_proxy_hosts: [192.168.10.48:8765]
        egress_proxy_discovery_documents:
          results:
            - item: "{{ egress_discovery.oidc[0] }}"
              json:
                issuer: https://10.100.0.1:22
                authorization_endpoint: http://169.254.169.254:80/latest/meta-data
                token_endpoint: https://169.254.169.254/token
                jwks_uri: https://sso.example.edu:8443/keys
                userinfo_endpoint: https://[fd00::1]/userinfo

    - name: Check a discovery document adds no address and no other port
      ansible.builtin.assert:
        quiet: true
        that:
          - egress_proxy_allowed == ['192.168.10.48:8765']
        fail_msg: "{{ egress_proxy_allowed }}"

    - name: Remove the working directory
      ansible.builtin.file:
        path: "{{ egress_workdir.path }}"
        state: absent
