---
# The administrator alert settings with no VM (STACK.md section 15): which
# values setup accepts, that alerts.env is gone (ADR 0052), and the units
# that report a failure through portikus-alert@.service.  `make infra-check` runs it; the rehearsal VM
# sends real alerts.
- name: Check the alert settings and the units
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    # Made-up keys, whose form alone is checked.
    alerts_test_key: uTestUserKey
    alerts_test_token: aTestAppToken
    alerts_test_cases:
      - { name: nothing set, accept: true }
      - name: Pushover alone
        accept: true
        vars: { user: "{{ alerts_test_key }}", token: "{{ alerts_test_token }}" }
      - name: a Slack webhook alone
        accept: true
        vars: { webhook: "https://hooks.slack.com/services/T000/B000/XXXX" }
      - name: both, the webhook with a query
        accept: true
        vars:
          user: "{{ alerts_test_key }}"
          token: "{{ alerts_test_token }}"
          webhook: "https://alerts.example.edu/hook?team=ops&x=1"
      - name: a webhook on port 443 written out
        accept: true
        vars: { webhook: "https://ntfy.example.org:443/portikus" }
      # The egress proxy opens only port 443 for alert hosts (ADR 0052).
      - { name: a webhook on its own port, accept: false, vars: { webhook: "https://alerts.example.edu:8443/hook" } }
      - { name: a user key without its app token, accept: false, vars: { user: "{{ alerts_test_key }}" } }
      - { name: an app token without its user key, accept: false, vars: { token: "{{ alerts_test_token }}" } }
      - name: a key holding a newline
        accept: false
        vars: { user: "abc\nALERT_WEBHOOK_URL=https://evil.example", token: "{{ alerts_test_token }}" }
      - { name: a plain http webhook, accept: false, vars: { webhook: "http://hooks.slack.com/services/T000" } }
      - { name: a webhook that is not a URL, accept: false, vars: { webhook: hooks.slack.com/services/T000 } }
      - { name: a webhook with a space, accept: false, vars: { webhook: "https://hooks.slack.com/a b" } }
      - { name: a webhook with a quote, accept: false, vars: { webhook: "https://hooks.slack.com/a\"b" } }
      - { name: a webhook ending in a newline, accept: false, vars: { webhook: "https://hooks.slack.com/a\n" } }
      - { name: a webhook with no host, accept: false, vars: { webhook: "https:///services/T000" } }
      - { name: a webhook whose host is a wildcard, accept: false, vars: { webhook: "https://*.example.org/hook" } }
      # A leading dot would stand for every subdomain in the proxy's list.
      - { name: a webhook whose host starts with a dot, accept: false, vars: { webhook: "https://.example.org/hook" } }
      - { name: a webhook with a user name, accept: false, vars: { webhook: "https://me@example.org/hook" } }
      - { name: a webhook at an address, accept: false, vars: { webhook: "https://192.0.2.10/hook" } }

  tasks:
    - name: Try each case
      ansible.builtin.include_tasks: alerts-render-case.yml
      loop: "{{ alerts_test_cases }}"
      loop_control:
        loop_var: alerts_case
        label: "{{ alerts_case.name }}"

    - name: Read the units and the play
      ansible.builtin.set_fact:
        alerts_api_unit: "{{ lookup('ansible.builtin.file', '../../packaging/systemd/portikus-api.service').splitlines() }}"
        alerts_worker_unit: "{{ lookup('ansible.builtin.file', '../../packaging/systemd/portikus-worker.service').splitlines() }}"
        alerts_backup_unit: "{{ lookup('ansible.builtin.file', '../../packaging/systemd/portikus-backup.service').splitlines() }}"
        alerts_offsite_unit: "{{ lookup('ansible.builtin.file', '../../packaging/systemd/portikus-backup-offsite.service').splitlines() }}"
        alerts_template_unit: "{{ lookup('ansible.builtin.file', '../../packaging/systemd/portikus-alert@.service').splitlines() }}"
        alerts_nfpm: "{{ lookup('ansible.builtin.file', '../../packaging/nfpm.yaml') | from_yaml }}"
        alerts_main_tasks: "{{ lookup('ansible.builtin.file', '../ansible/roles/portikus/tasks/main.yml') | from_yaml }}"
        alerts_tasks: "{{ lookup('ansible.builtin.file', '../ansible/roles/portikus/tasks/alerts.yml') | from_yaml }}"
        alerts_postgresql_tasks: "{{ lookup('ansible.builtin.file', '../ansible/roles/postgresql/tasks/main.yml') | from_yaml }}"
        alerts_caddy_tasks: "{{ lookup('ansible.builtin.file', '../ansible/roles/caddy/tasks/main.yml') | from_yaml }}"
        alerts_site: "{{ lookup('ansible.builtin.file', '../ansible/site.yml') }}"
        alerts_cli: "{{ lookup('ansible.builtin.file', '../../packaging/bin/portikus') }}"
        alerts_postinst: "{{ lookup('ansible.builtin.file', '../../packaging/scripts/postinst') }}"
        alerts_prerm: "{{ lookup('ansible.builtin.file', '../../packaging/scripts/prerm') }}"

    # The services read notify.json at each send (ADR 0052).
    - name: Check the API and the worker no longer read alerts.env, and alert when they fail
      ansible.builtin.assert:
        that:
          - "'OnFailure=portikus-alert@%n.service' in item.unit"
          - item.unit | select('search', 'alerts[.]env') | list == []
          - item.unit.index('OnFailure=portikus-alert@%n.service') < item.unit.index('[Service]')
      loop:
        - { name: api, unit: "{{ alerts_api_unit }}" }
        - { name: worker, unit: "{{ alerts_worker_unit }}" }
      loop_control:
        label: "{{ item.name }}"

    - name: Check the backup and the off-site copy alert when they fail
      ansible.builtin.assert:
        that:
          - "'OnFailure=portikus-alert@%n.service' in item.unit"
          - item.unit.index('OnFailure=portikus-alert@%n.service') < item.unit.index('[Service]')
      loop:
        - { name: backup, unit: "{{ alerts_backup_unit }}" }
        - { name: backup-offsite, unit: "{{ alerts_offsite_unit }}" }
      loop_control:
        label: "{{ item.name }}"

    - name: Check the template runs alert-failed with stamps that outlive each run, and the package ships it
      ansible.builtin.assert:
        that:
          - "'ExecStart=/usr/bin/portikus alert-failed %i' in alerts_template_unit"
          - "'RuntimeDirectory=portikus-alert' in alerts_template_unit"
          - "'RuntimeDirectoryPreserve=yes' in alerts_template_unit"
          # A template with its own OnFailure= would chain alerts about alerts.
          - alerts_template_unit | select('match', '^OnFailure=') | list == []
          - alerts_nfpm.contents | selectattr('dst', 'equalto', '/usr/lib/systemd/system/portikus-alert@.service')
            | map(attribute='src') | list == ['./packaging/systemd/portikus-alert@.service']

    - name: Check setup no longer writes alerts.env, removes it after seeding, and portikus alert does not read it
      ansible.builtin.assert:
        that:
          - alerts_main_tasks | selectattr('name', 'equalto', 'Deploy the alert channels file') | list == []
          - alerts_remove | length == 1
          - alerts_remove[0]['ansible.builtin.file'].path == '/etc/portikus/alerts.env'
          - alerts_remove[0]['ansible.builtin.file'].state == 'absent'
          - (alerts_tasks | map(attribute='name') | list).index(alerts_remove[0].name)
            > (alerts_tasks | map(attribute='name') | list).index('Create notify.json if it is missing, from secrets.yaml or alerts.env')
          - alerts_cli is not search('alerts[.]env')
      vars:
        alerts_remove: >-
          {{ alerts_tasks | selectattr('name', 'equalto', 'Remove the old alerts.env once notify.json is seeded') | list }}

    - name: Check PostgreSQL and Caddy alert when they fail, with only a reload
      ansible.builtin.assert:
        that:
          - alerts_dropin | length == 1
          - alerts_dropin[0]['ansible.builtin.copy'].dest == item.dest
          - alerts_dropin[0]['ansible.builtin.copy'].content == '[Unit]\nOnFailure=portikus-alert@%n.service\n'
          - alerts_dropin[0].notify is string
          - alerts_dropin[0].notify is match('^Reload systemd')
      vars:
        alerts_dropin: >-
          {{ item.tasks | selectattr('name', 'equalto', item.task) | list }}
      loop:
        - task: Alert the administrator when PostgreSQL fails
          tasks: "{{ alerts_postgresql_tasks }}"
          dest: /etc/systemd/system/postgresql@.service.d/20-portikus-alert.conf
        - task: Alert the administrator when Caddy fails
          tasks: "{{ alerts_caddy_tasks }}"
          dest: /etc/systemd/system/caddy.service.d/20-portikus-alert.conf
      loop_control:
        label: "{{ item.dest }}"

    # The alerts job writes the proxy's alert hosts from notify.json (ADR 0052).
    - name: Check setup no longer lists alert hosts for the egress proxy
      ansible.builtin.assert:
        that:
          - alerts_site is not search('portikus_alert_egress_hosts')
          - alerts_site is search('egress_proxy_hosts:')

    - name: Check the API and the worker join the group that reads notify.json, and portikus alert does too
      ansible.builtin.assert:
        that:
          - "'SupplementaryGroups=portikus-notify' in alerts_api_unit"
          - "'SupplementaryGroups=portikus-notify' in alerts_worker_unit"
          - alerts_cli is search('--uid=portikus-worker')
          - alerts_cli is search('-p SupplementaryGroups=portikus-notify')
          - alerts_postinst is search('addgroup --system portikus-notify')

    - name: Check the package ships the alerts job and its units, and removal stops and disables them
      ansible.builtin.assert:
        that:
          - alerts_nfpm.contents | selectattr('dst', 'equalto', '/usr/lib/portikus/alerts-job')
            | map(attribute='src') | list == ['./packaging/alerts/alerts-job']
          - alerts_nfpm.contents | selectattr('dst', 'equalto', '/usr/lib/systemd/system/portikus-alerts-job.path')
            | list | length == 1
          - alerts_nfpm.contents | selectattr('dst', 'equalto', '/usr/lib/systemd/system/portikus-alerts-job.service')
            | list | length == 1
          - alerts_prerm is search('systemctl stop [^|]*portikus-alerts-job[.]path')
          - alerts_prerm is search('systemctl stop [^|]*portikus-alerts-job[.]service')
          - alerts_prerm is search('systemctl disable [^|]*portikus-alerts-job[.]path')
