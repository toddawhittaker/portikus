---
# Reads one LTI platforms file as the portikus role does, with no VM.
# infra/tests/lti-platforms-test.sh calls it once per case:
#
#   ansible-playbook infra/tests/lti-platforms-load.yml -e portikus_lti_platforms_file=<file>
- name: Load an LTI platforms file as the role does
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Load the file
      ansible.builtin.include_tasks: ../ansible/roles/portikus/tasks/lti_load.yml

    - name: Print the result for the test script
      ansible.builtin.debug:
        msg: "LTI-RESULT {{ {'on': portikus_lti_platforms is not none, 'cidrs': portikus_lti_keyset_cidrs} | to_json }}"
