---
# Renders the dex role's real configuration template from a users file and
# checks the result, with no VM (docs/EPIC-12B.md, Part A items 6 and 12).
# `make infra-check` runs it; the CI dex-signin job runs it to get a config
# it can start Dex with:
#
#   ansible-playbook infra/tests/dex-render-test.yml -e dex_render_dest=/tmp/dex.yaml
#
# Every value below can be overridden with -e.
- name: Render and check the Dex configuration
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  # The role's defaults hold the hash pattern its guards use.
  vars_files:
    - ../ansible/roles/dex/defaults/main.yml

  vars:
    dex_render_users_file: "{{ playbook_dir }}/fixtures/users.sample.json"
    dex_render_dest: "{{ dex_render_workdir.path }}/config.yaml"
    portikus_public_url: http://127.0.0.1:3000
    portikus_dex_issuer: http://127.0.0.1:5556/dex
    dex_port: 5556
    # A test value; Ansible generates the real one on the VM.
    dex_client_secret: portikus-ci-dex-client-secret-not-a-real-one
    portikus_oidc_student_group: portikus-students
    portikus_oidc_admin_group: portikus-administrators
    portikus_oidc_instructor_group: instructor
    # Added to the fixture here, because the package tests count its users.
    dex_render_instructor:
      username: ivy
      email: ivy@example.edu
      displayName: Ivy Instructor
      role: instructor
      userId: 6f0c1d2e-8a4b-4c3d-9e5f-7a6b5c4d3e2f
      passwordHash: "$2b$12$MGOrI4Vq522K69kyskhWsetEom1fjLdaDyzNB.G7ktesUbWKQEFfG"

  tasks:
    - name: Make a working directory
      ansible.builtin.tempfile:
        state: directory
      register: dex_render_workdir

    # A checkout does not keep file modes, so the fixture is copied to the
    # 0600 file the role insists on rather than relaxing the check.
    - name: Copy the users file, with an instructor, with the mode the role requires
      ansible.builtin.copy:
        content: "{{ dex_render_fixture | combine({'users': dex_render_fixture.users + [dex_render_instructor]}) | to_nice_json }}"
        dest: "{{ dex_render_workdir.path }}/users.json"
        mode: "0600"
      vars:
        dex_render_fixture: "{{ lookup('ansible.builtin.file', dex_render_users_file) | from_json }}"

    # Ruling 4 of docs/EPIC-13.md adds instructor; any other role stays refused.
    - name: Check the role refuses an unknown role
      block:
        - name: Write a users file with an unknown role
          ansible.builtin.copy:
            content: "{{ {'version': 1, 'users': [dex_render_instructor | combine({'role': 'teacher'})]} | to_json }}"
            dest: "{{ dex_render_workdir.path }}/bad-role.json"
            mode: "0600"

        - name: Load it through the role's guards
          ansible.builtin.include_tasks: ../ansible/roles/dex/tasks/users.yml
          vars:
            portikus_users_file: "{{ dex_render_workdir.path }}/bad-role.json"

        - name: Note that the guards accepted it
          ansible.builtin.set_fact:
            dex_render_bad_role_accepted: true
      rescue:
        - name: Note the refusal
          ansible.builtin.set_fact:
            dex_render_bad_role_accepted: false

    - name: Require the unknown role to have been refused
      ansible.builtin.assert:
        quiet: true
        that:
          - not dex_render_bad_role_accepted
        fail_msg: "users.yml accepted the role 'teacher'"

    - name: Load the users file through the role's own guards
      ansible.builtin.include_tasks: ../ansible/roles/dex/tasks/users.yml
      vars:
        portikus_users_file: "{{ dex_render_workdir.path }}/users.json"

    # Cost 16 would let the 300 counted attempts burn about 20 CPU-minutes.
    - name: Check the role accepts bcrypt costs 10 to 12 and nothing higher
      ansible.builtin.assert:
        quiet: true
        that:
          - (prefix ~ '10$' ~ salt) is match(dex_bcrypt_pattern)
          - (prefix ~ '12$' ~ salt) is match(dex_bcrypt_pattern)
          - (prefix ~ '13$' ~ salt) is not match(dex_bcrypt_pattern)
          - (prefix ~ '16$' ~ salt) is not match(dex_bcrypt_pattern)
      vars:
        prefix: "$2b$"
        salt: MGOrI4Vq522K69kyskhWsetEom1fjLdaDyzNB.G7ktesUbWKQEFfG

    - name: Render the configuration template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../ansible/roles/dex/templates/config.yaml.j2"
        dest: "{{ dex_render_dest }}"
        mode: "0600"

    - name: Read the rendered configuration
      ansible.builtin.set_fact:
        dex_rendered: "{{ lookup('ansible.builtin.file', dex_render_dest) | from_yaml }}"

    - name: Check the provider settings
      ansible.builtin.assert:
        quiet: true
        that:
          - dex_rendered.issuer == portikus_dex_issuer
          - dex_rendered.storage.type == 'memory'
          - dex_rendered.web.http == '127.0.0.1:' ~ dex_port
          - dex_rendered.enablePasswordDB
          - dex_rendered.oauth2.skipApprovalScreen
          - dex_rendered.oauth2.passwordConnector is not defined
          - dex_rendered.staticClients | length == 1
          - dex_rendered.staticClients[0].id == 'portikus'
          - dex_rendered.staticClients[0].secret == dex_client_secret
          - dex_rendered.staticClients[0].redirectURIs == [portikus_public_url ~ '/auth/callback']

    - name: Check one entry per user, with groups following the role
      ansible.builtin.assert:
        quiet: true
        that:
          - dex_rendered.staticPasswords | length == dex_users.users | length
          - entry.email == item.email
          - entry.hash == item.passwordHash
          - entry.username == item.username
          - entry.preferredUsername == item.username
          - entry.name == item.displayName
          - entry.userID == item.userId
          - entry.emailVerified
          - >-
            entry.groups == [{'administrator': portikus_oidc_admin_group,
                              'instructor': portikus_oidc_instructor_group,
                              'student': portikus_oidc_student_group}[item.role]]
      vars:
        entry: "{{ dex_rendered.staticPasswords | selectattr('userID', 'equalto', item.userId) | first }}"
      loop: "{{ dex_users.users }}"
      loop_control:
        label: "{{ item.username }}"

    - name: Check the instructor has the instructor group
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            (dex_rendered.staticPasswords | selectattr('username', 'equalto', 'ivy') | first).groups
            == ['instructor']
          - dex_users.users | map(attribute='role') | unique | sort == ['administrator', 'instructor', 'student']

    # Before the package is installed there is no revoke command, and the
    # users must still be recorded, or the next deploy revokes nothing.
    # Check mode, because the real tasks chown to root.
    - name: Run the session revoke tasks with no revoke command
      ansible.builtin.include_tasks:
        file: ../ansible/roles/dex/tasks/revoke.yml
        apply:
          check_mode: true
      vars:
        dex_users_revoke_script: "{{ dex_render_workdir.path }}/no-such-revoke.js"
        dex_users_state_file: "{{ dex_render_workdir.path }}/deployed-users.json"
        dex_users_revoke_input: "{{ dex_render_workdir.path }}/revoke-input.json"
        portikus_database_url: postgresql://unused

    - name: Check the users were recorded anyway
      ansible.builtin.assert:
        quiet: true
        that:
          - dex_users_recorded is not skipped
          - dex_users_recorded is changed
          - dex_users_deployed | map(attribute='username') | list == dex_users.users | map(attribute='username') | list
        fail_msg: "revoke.yml did not record the deployed users when the revoke command was missing"

    - name: Remove the working directory
      ansible.builtin.file:
        path: "{{ dex_render_workdir.path }}"
        state: absent
      when: dex_render_dest.startswith(dex_render_workdir.path)
