---
# Docker pull-through caches on the workspace gateway (ADR 0045, SPEC.md
# 16.6).  Debian's docker-registry in proxy mode, as its own
# user, on its own loop-file filesystem.  The units and the root cache
# helper come with the portikus package; the helper writes the registry
# configs and applies the admin page's requests.  This role makes what they
# need and enables them.  Nothing outside the helper depends on the storage.

- name: Require the gateway address the caches and the platform are fixed to
  ansible.builtin.assert:
    that:
      - incus_network_cidr | ansible.utils.ipaddr('address') == registry_cache_gateway
    fail_msg: >-
      The Docker caches listen on {{ registry_cache_gateway }}, which
      packages/contracts/src/docker-cache.ts fixes; incus_network_cidr is
      {{ incus_network_cidr }}.

# Debian's unit listens on every interface.  Masked before the package is
# installed, so its postinst cannot start it even once.
- name: Mask Debian's own registry service
  ansible.builtin.file:
    src: /dev/null
    dest: /etc/systemd/system/docker-registry.service
    state: link
    force: true

- name: Install the registry
  ansible.builtin.apt:
    name:
      - docker-registry
      - e2fsprogs
      - openssl
    state: present

- name: Keep Debian's own registry service stopped and masked
  ansible.builtin.systemd_service:
    name: docker-registry.service
    state: stopped
    masked: true

- name: Create the caches' group
  ansible.builtin.group:
    name: portikus-registry
    system: true

- name: Create the caches' user
  ansible.builtin.user:
    name: portikus-registry
    group: portikus-registry
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

# ── Configuration, token and certificates ─────────────────────────

- name: Create the registry configuration directory
  ansible.builtin.file:
    path: "{{ registry_cache_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The API writes requests here and reads status.json (ADR 0030 pattern).
- name: Create the cache helper's request directory
  ansible.builtin.file:
    path: "{{ registry_cache_jobs_dir }}"
    state: directory
    owner: root
    group: portikus
    mode: "0770"
  notify: Restart portikus-api

# The registry sends it with each notification; root writes it into the
# configs, and the worker checks it.
- name: Generate the notification token
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > {{ registry_cache_config_dir }}/events-token
    creates: "{{ registry_cache_config_dir }}/events-token"
  no_log: true
  notify:
    - Restart portikus-worker
    - Restart the running Docker caches

- name: Let only root and the worker read the notification token
  ansible.builtin.file:
    path: "{{ registry_cache_config_dir }}/events-token"
    owner: root
    group: portikus-worker
    mode: "0640"

# The ghcr.io cache is on by default; the administrator's later choice stays.
- name: Start with the ghcr.io cache on
  ansible.builtin.copy:
    dest: "{{ registry_cache_config_dir }}/ghcr-enabled"
    content: "on\n"
    force: false
    owner: root
    group: root
    mode: "0644"

# Sites set up while the default was off get it on once, as migration 0033
# does for the settings row, so the file and the database agree.
- name: Turn the ghcr.io cache on once for sites set up while it was off
  ansible.builtin.shell:
    cmd: printf 'on\n' > ghcr-enabled && touch ghcr-default-on
    chdir: "{{ registry_cache_config_dir }}"
    creates: "{{ registry_cache_config_dir }}/ghcr-default-on"

# The authority may sign only ghcr.io, and workspaces trust it only through
# /etc/docker/certs.d.  Its key stays root's.
- name: Create the ghcr.io cache's authority and certificate
  ansible.builtin.shell:
    chdir: "{{ registry_cache_config_dir }}"
    cmd: |
      set -eu
      umask 077
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 3650 \
        -subj "/CN=Portikus ghcr.io cache authority" -keyout ghcr-ca.key -out ghcr-ca.crt \
        -addext "basicConstraints=critical,CA:TRUE,pathlen:0" \
        -addext "keyUsage=critical,keyCertSign,cRLSign" \
        -addext "nameConstraints=critical,permitted;DNS:ghcr.io"
      openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
        -subj "/CN=ghcr.io" -keyout ghcr.key -out ghcr.csr
      printf 'subjectAltName=DNS:ghcr.io\nbasicConstraints=critical,CA:FALSE\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature\n' > ghcr.ext
      openssl x509 -req -in ghcr.csr -CA ghcr-ca.crt -CAkey ghcr-ca.key -CAcreateserial \
        -days 3650 -extfile ghcr.ext -out ghcr.crt
      rm -f ghcr.csr ghcr.ext ghcr-ca.srl
    creates: "{{ registry_cache_config_dir }}/ghcr.crt"
  notify: Restart the running Docker caches

- name: Keep the authority's key root's alone
  ansible.builtin.file:
    path: "{{ registry_cache_config_dir }}/ghcr-ca.key"
    owner: root
    group: root
    mode: "0600"

- name: Let the caches' group read the ghcr.io key
  ansible.builtin.file:
    path: "{{ registry_cache_config_dir }}/ghcr.key"
    owner: root
    group: portikus-registry
    mode: "0640"

# The controller copies the authority into workspaces while ghcr.io is on.
- name: Make the certificates readable
  ansible.builtin.file:
    path: "{{ registry_cache_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ghcr-ca.crt
    - ghcr.crt

# ── The cache's own filesystem ────────────────────────────────────

- name: Look at the cache's file
  ansible.builtin.stat:
    path: "{{ registry_cache_image }}"
  register: registry_cache_image_stat

- name: Require a cache of 1 GiB or more
  ansible.builtin.assert:
    that:
      - portikus_registry_cache_gib | int >= 1
    fail_msg: "portikus_registry_cache_gib must be a whole number of GiB, 1 or more."

- name: Read the free space beside the cache's file
  ansible.builtin.command:
    argv: [df, --output=avail, -B1, "{{ registry_cache_image | dirname }}"]
  register: registry_cache_free
  changed_when: false
  check_mode: false

# The old file counts by what it really holds: an earlier mkfs discarded its reservation.
- name: Count the free space, the old cache file's included
  ansible.builtin.set_fact:
    registry_cache_room_bytes: >-
      {{ registry_cache_free.stdout_lines | last | int
      + (registry_cache_image_stat.stat.blocks | default(0) | int) * 512 }}

# A cache is only an optimisation, so a small disk shrinks it or turns it off, never fails setup.
- name: Work out the cache's size
  ansible.builtin.include_tasks: size.yml

- name: Work out the cache's size in bytes
  ansible.builtin.set_fact:
    registry_cache_bytes: "{{ registry_cache_gib_chosen | int * 1073741824 }}"

- name: Say the cache is smaller than asked
  ansible.builtin.debug:
    msg: >-
      WARNING: the Docker cache is {{ registry_cache_gib_chosen }} GiB, not the
      {{ portikus_registry_cache_gib }} GiB asked for, so the main disk keeps
      {{ registry_cache_spare_bytes | int // 1073741824 }} GiB free.
  when: 0 < registry_cache_gib_chosen | int < portikus_registry_cache_gib | int

- name: Turn the cache off while the main disk has no room for it
  when: registry_cache_gib_chosen | int == 0
  block:
    - name: Say the cache is off
      ansible.builtin.debug:
        msg: >-
          WARNING: the main disk has no room for even a 1 GiB Docker cache
          and {{ registry_cache_spare_bytes | int // 1073741824 }} GiB to spare,
          so the Docker cache is off and students pull straight from the
          registries.  Free some space and run portikus setup again to turn it on.

    # The units' condition skips them from here on, so nothing points at an absent cache.
    # The cache helper shows the marker's one line on the admin Docker tab.
    - name: Mark the cache off, with the reason
      ansible.builtin.copy:
        dest: "{{ registry_cache_off_marker }}"
        content: "When setup last ran, the main disk had {{ registry_cache_off_free_gib }} GiB free, and setup
          keeps {{ registry_cache_spare_bytes | int // 1073741824 }} GiB of it free, so not even a 1 GiB
          cache fits.\n"
        owner: root
        group: root
        mode: "0644"
      vars:
        # The free space the size decision counted, the old cache file's included.
        registry_cache_off_free_gib: "{{ (registry_cache_room_bytes | int / 1073741824) | round(1, 'floor') }}"

    - name: Stop and disable the caches and their filesystem
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - portikus-registry-ghcr.service
        - portikus-registry-hub.service
        - "{{ registry_cache_mount_unit }}"
      failed_when: false

    - name: Remove the cache's file
      ansible.builtin.file:
        path: "{{ registry_cache_image }}"
        state: absent

- name: Make, mount and start the cache
  when: registry_cache_gib_chosen | int >= 1
  block:
    # A cache is only a cache: a new size means a new, empty filesystem.
    - name: Make the cache's file at its size
      when: >-
        not registry_cache_image_stat.stat.exists
        or registry_cache_image_stat.stat.size != registry_cache_bytes | int
      block:
        - name: Stop the caches and unmount their filesystem
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop:
            - portikus-registry-ghcr.service
            - portikus-registry-hub.service
            - "{{ registry_cache_mount_unit }}"
          failed_when: false

        - name: Remove the old cache file
          ansible.builtin.file:
            path: "{{ registry_cache_image }}"
            state: absent

        # fallocate reserves the space, so a full root filesystem cannot fail
        # the cache; nodiscard below stops mkfs punching it back out.
        - name: Make the cache's file
          ansible.builtin.command:
            argv: [fallocate, --length, "{{ registry_cache_bytes }}", "{{ registry_cache_image }}"]
          changed_when: true

        - name: Make the cache's filesystem
          ansible.builtin.command:
            argv: [mkfs.ext4, -q, -F, -m, "0", -E, nodiscard, -L, portikus-registry, "{{ registry_cache_image }}"]
          changed_when: true
          notify: Restart the running Docker caches

    # An old file made before nodiscard has holes; fallocate fills them and keeps the data.
    - name: Look at how much of the cache's file is reserved
      ansible.builtin.stat:
        path: "{{ registry_cache_image }}"
      register: registry_cache_image_now

    - name: Reserve the whole cache file
      ansible.builtin.command:
        argv: [fallocate, --length, "{{ registry_cache_bytes }}", "{{ registry_cache_image }}"]
      when: registry_cache_image_now.stat.blocks | int * 512 < registry_cache_bytes | int
      changed_when: true

    - name: Make the cache's file root's alone
      ansible.builtin.file:
        path: "{{ registry_cache_image }}"
        owner: root
        group: root
        mode: "0600"

    - name: Mark the cache on
      ansible.builtin.file:
        path: "{{ registry_cache_off_marker }}"
        state: absent

    - name: Create the cache's mount point
      ansible.builtin.file:
        path: "{{ registry_cache_mount }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the cache's mount unit
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ registry_cache_mount_unit }}"
        content: |
          # Managed by Ansible (registry_cache role).  The Docker caches'
          # filesystem; the root cache helper remakes it to clear them.
          [Unit]
          Description=Portikus Docker cache filesystem
          ConditionPathExists=!{{ registry_cache_off_marker }}

          [Mount]
          What={{ registry_cache_image }}
          Where={{ registry_cache_mount }}
          Type=ext4
          Options=loop,nodev,nosuid,noexec

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: registry_cache_mount_file

    - name: Mount the cache's filesystem
      ansible.builtin.systemd_service:
        name: "{{ registry_cache_mount_unit }}"
        enabled: true
        state: started
        daemon_reload: "{{ registry_cache_mount_file is changed }}"

    # ── The caches and the helper ─────────────────────────────────

    # On a held site (hub-held) the unit's condition skips the start, and
    # systemctl start still succeeds.
    - name: Enable and start the Docker Hub cache
      ansible.builtin.systemd_service:
        name: portikus-registry-hub.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Read the ghcr.io cache switch
      ansible.builtin.slurp:
        src: "{{ registry_cache_config_dir }}/ghcr-enabled"
      register: registry_cache_ghcr_switch

    - name: Enable and start the ghcr.io cache while its switch is on
      ansible.builtin.systemd_service:
        name: portikus-registry-ghcr.service
        enabled: true
        state: started
      when: (registry_cache_ghcr_switch.content | b64decode | trim) == "on"

- name: Watch for cache requests, and write the status every minute
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - portikus-registry-job.path
    - portikus-registry-status.timer

# Nothing else loads the egress table until a policy or a reboot, and its
# ghcr.io redirect follows the switch set above.  With no request the helper
# loads the default open table if none is loaded, or reloads the applied one
# keeping learned names, so running it on every setup is harmless.
- name: Load the egress table with the current ghcr.io switch
  ansible.builtin.systemd_service:
    name: portikus-egress-apply.service
    state: started

# The admin page reads it; the timer rewrites it within a minute anyway.
- name: Write the cache status
  ansible.builtin.command:
    argv: [/usr/lib/portikus/registry-job, status]
  changed_when: false
