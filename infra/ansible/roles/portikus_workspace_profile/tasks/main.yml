---
# Incus project and workspace profile (STACK.md section 24, SPEC.md 24.4/24.5).
#
# The profile defines the security and resource constraints applied to
# every student workspace container.  Nesting is enabled only as far
# as nested Docker requires.  No privileged containers, no host Docker
# socket, no Incus admin socket inside workspaces.

- name: Check if Incus project exists
  ansible.builtin.command:
    cmd: incus project show {{ incus_project_name }}
  register: portikus_workspace_profile_proj_check
  changed_when: false
  failed_when: false

- name: Create Incus project
  ansible.builtin.command:
    cmd: >-
      incus project create {{ incus_project_name }}
      -c features.images=true
      -c features.profiles=true
      -c features.storage.volumes=true
  # features.networks stays false: enabling it requires OVN, and workspaces
  # attach to the bridge network owned by the default project.
  when: portikus_workspace_profile_proj_check.rc != 0
  changed_when: true

- name: Check if workspace profile exists
  ansible.builtin.command:
    cmd: incus profile show workspace --project {{ incus_project_name }}
  register: portikus_workspace_profile_check
  changed_when: false
  failed_when: false

- name: Create workspace profile
  ansible.builtin.command:
    cmd: incus profile create workspace --project {{ incus_project_name }}
  when: portikus_workspace_profile_check.rc != 0
  changed_when: true

# Check each profile key and only set it when the value differs.
# Resource limits reference vars from site.yml so they stay in one place.
# SPEC 19.1 suggests 4 vCPU / 6 GiB for a real pilot; the current defaults
# are lower because the pilot VM has only 8 GB total.
- name: Get current workspace profile config
  ansible.builtin.command:
    cmd: incus profile get workspace --project {{ incus_project_name }} {{ item.key }}
  loop:
    - { key: "security.nesting", value: "true" }
    - { key: "security.privileged", value: "false" }
    - { key: "security.idmap.isolated", value: "true" }
    - { key: "security.syscalls.intercept.mknod", value: "true" }
    - { key: "security.syscalls.intercept.setxattr", value: "true" }
    - { key: "security.guestapi", value: "false" }
    - { key: "limits.cpu", value: "{{ workspace_cpu_limit }}" }
    - { key: "limits.memory", value: "{{ workspace_memory_limit }}" }
    - { key: "limits.processes", value: "{{ workspace_process_limit }}" }
  register: portikus_workspace_profile_current
  changed_when: false
  # The key may not be set yet if the profile was just created.
  failed_when: false

- name: Configure workspace profile
  ansible.builtin.command:
    cmd: >-
      incus profile set workspace --project {{ incus_project_name }}
      {{ item.item.key }}={{ item.item.value }}
  loop: "{{ portikus_workspace_profile_current.results }}"
  when: item.stdout | default('') | trim != item.item.value
  changed_when: true

# Parse current profile to check devices.
- name: Get current workspace profile YAML
  ansible.builtin.command:
    cmd: incus profile show workspace --project {{ incus_project_name }}
  register: portikus_workspace_profile_yaml_raw
  changed_when: false

- name: Parse workspace profile
  ansible.builtin.set_fact:
    portikus_workspace_profile_yaml: "{{ portikus_workspace_profile_yaml_raw.stdout | from_yaml }}"

- name: Attach workspace network to profile
  ansible.builtin.command:
    cmd: >-
      incus profile device add workspace eth0 nic
      nictype=bridged
      parent={{ incus_network_name }}
      --project {{ incus_project_name }}
  when: "'eth0' not in (portikus_workspace_profile_yaml.devices | default({}))"
  changed_when: true

- name: Attach workspace storage to profile
  ansible.builtin.command:
    cmd: >-
      incus profile device add workspace root disk
      pool={{ incus_storage_pool_name }}
      path=/
      size={{ workspace_root_disk_quota }}
      --project {{ incus_project_name }}
  when: "'root' not in (portikus_workspace_profile_yaml.devices | default({}))"
  changed_when: true
