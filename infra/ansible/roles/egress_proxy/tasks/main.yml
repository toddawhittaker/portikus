---
# Squid on loopback as the API's forward proxy (ADR 0027).  The API unit may
# reach only loopback and the workspace bridge, so this is its one way out,
# and it lets through only the hosts listed here.

- name: Install squid
  ansible.builtin.apt:
    name: squid
    state: present
    update_cache: true
    cache_valid_time: 3600

# Fetched from the VM, which is where the proxy will be asked to reach them.
- name: Read the providers' discovery documents
  ansible.builtin.uri:
    url: "{{ item.issuer | regex_replace('/+$', '') }}/.well-known/openid-configuration"
    return_content: true
  loop: "{{ egress_proxy_discovery }}"
  register: egress_proxy_discovery_documents

- name: Start the allow list with the listed hosts
  ansible.builtin.set_fact:
    egress_proxy_allowed: "{{ egress_proxy_hosts }}"

- name: Add the hosts the discovery documents name
  ansible.builtin.set_fact:
    egress_proxy_allowed: "{{ egress_proxy_allowed + (egress_proxy_urls | map('urlsplit', 'netloc') | list) }}"
  loop: "{{ egress_proxy_discovery_documents.results }}"
  loop_control:
    label: "{{ item.item.issuer }}"
  vars:
    egress_proxy_urls: >-
      {{ [item.json.issuer, item.json.authorization_endpoint, item.json.token_endpoint, item.json.jwks_uri]
         + ([item.json.userinfo_endpoint] if item.item.userinfo and item.json.userinfo_endpoint is defined else []) }}

# `host` means port 443.  Anything else, such as a URL or a wildcard, is refused.
- name: Normalise the allow list
  ansible.builtin.set_fact:
    egress_proxy_allowed: >-
      {{ egress_proxy_allowed | map('lower') | map('regex_replace', '^([^:]+)$', '\1:443') | unique | sort }}

- name: Require every allowed entry to be a host name or IPv4 address with a port
  ansible.builtin.assert:
    that:
      - item is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*:[0-9]{1,5}$')
    fail_msg: "Egress allow list entry '{{ item }}' is not host or host:port."
    quiet: true
  loop: "{{ egress_proxy_allowed }}"

- name: Show the egress allow list
  ansible.builtin.debug:
    msg: "The API may reach: {{ egress_proxy_allowed | join(', ') if egress_proxy_allowed else 'no outside host' }}"

- name: Deploy the squid configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
    validate: squid -k parse -f %s
  notify: Restart squid

# A stopped proxy stops every SSO sign-in and LMS launch (docs/archive/epics/EPIC-14.md risk 1).
- name: Create the squid drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/squid.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Restart squid when it fails
  ansible.builtin.copy:
    dest: /etc/systemd/system/squid.service.d/10-portikus.conf
    content: |
      # Managed by Ansible (egress_proxy role).
      [Service]
      Restart=on-failure
      RestartSec=2
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for squid
    - Restart squid

- name: Enable and start squid
  ansible.builtin.systemd:
    name: squid
    enabled: true
    state: started
