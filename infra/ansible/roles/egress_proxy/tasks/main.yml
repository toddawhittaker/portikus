---
# Squid on loopback as the API's forward proxy (ADR 0027).  The API unit may
# reach only loopback and the workspace bridge, so this is its one way out,
# and it lets through only the hosts listed here.

- name: Install squid
  ansible.builtin.apt:
    name: squid
    state: present
    update_cache: true
    cache_valid_time: 3600

# Fetched from the VM, which is where the proxy will be asked to reach them.
- name: Read the providers' discovery documents
  ansible.builtin.uri:
    url: "{{ item.issuer | regex_replace('/+$', '') }}/.well-known/openid-configuration"
    return_content: true
  loop: "{{ egress_proxy_discovery }}"
  register: egress_proxy_discovery_documents

- name: Build the allow list
  ansible.builtin.import_tasks: allow_list.yml

- name: Show the egress allow list
  ansible.builtin.debug:
    msg: "The API may reach: {{ egress_proxy_allowed | join(', ') if egress_proxy_allowed else 'no outside host' }}"

- name: Deploy the squid configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
    validate: squid -k parse -f %s
  notify: Restart squid

# A stopped proxy stops every SSO sign-in and LMS launch (docs/archive/epics/EPIC-14.md risk 1).
- name: Create the squid drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/squid.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Restart squid when it fails
  ansible.builtin.copy:
    dest: /etc/systemd/system/squid.service.d/10-portikus.conf
    content: |
      # Managed by Ansible (egress_proxy role).
      [Service]
      Restart=on-failure
      RestartSec=2
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for squid
    - Restart squid

- name: Enable and start squid
  ansible.builtin.systemd:
    name: squid
    enabled: true
    state: started
