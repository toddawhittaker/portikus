---
# The log level every control-plane service starts at; an administrator can
# change it at runtime from the admin page (ADR 0012).
portikus_log_level: info

# The API's own platforms-file parser, which validates the file at install (EPIC-13 ruling 14).
portikus_lti_platforms_check_script: /usr/lib/portikus/api/node_modules/@portikus/auth/dist/lti/platforms-check-main.js

# LTI launch (docs/EPIC-13.md, rulings 14 and 15): where the API reads the
# platforms file and the tool key on the VM.
portikus_lti_platforms_path: /etc/portikus/lti-platforms.json
portikus_lti_tool_key_path: /etc/portikus/lti-tool-key.pem

# The first administrator's one-time setup code (docs/EPIC-14.md, ruling 16).
portikus_setup_code_script: /usr/lib/portikus/api/node_modules/@portikus/auth/dist/setup-code-main.js
