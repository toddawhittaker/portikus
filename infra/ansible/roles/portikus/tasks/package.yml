---
# The Debian package, for a run from a workstation (main.yml).

# ── Remove the interim deployment from before the package ────────
# A VM configured before ADR 0007 has hand-written units, an rsynced app
# directory, and a global pnpm.  The package owns those names now, so an
# existing VM has to be cleaned before the package is installed.

- name: Remove Epic 3 systemd units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - portikus-api.service
    - portikus-worker.service
    - portikus-controller.service
  register: portikus_legacy_units

# Not a handler: this has to run before the package install, not at the end of the play.
- name: Reload systemd after removing the Epic 3 units  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: portikus_legacy_units is changed

- name: Remove the Epic 3 application directory
  ansible.builtin.file:
    path: /var/lib/portikus/app
    state: absent

# A fresh VM has no system npm, since the package bundles its own Node.
- name: Look for the system npm
  ansible.builtin.stat:
    path: /usr/bin/npm
  register: portikus_system_npm

- name: Remove the globally installed pnpm
  community.general.npm:
    name: pnpm
    global: true
    state: absent
  when: portikus_system_npm.stat.exists

# ── Debian package ────────────────────────────────────────────────

# Two ways to choose the package: a locally built .deb named by PORTIKUS_DEB
# (for testing a branch), or the signed apt repository, at the version named
# by PORTIKUS_VERSION (for a rollback) or its newest.
- name: Create package cache directory
  ansible.builtin.file:
    path: /var/cache/portikus
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install a locally built package
  when: portikus_deb | default('', true) | length > 0
  block:
    - name: Copy the local package
      ansible.builtin.copy:
        src: "{{ portikus_deb }}"
        dest: "/var/cache/portikus/{{ portikus_deb | basename }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install the local package
      ansible.builtin.apt:
        deb: "/var/cache/portikus/{{ portikus_deb | basename }}"
        # So that an older local build replaces a newer installed one.
        allow_downgrade: true

# The same key file and source line docs/INSTALL.md gives an administrator,
# so a later `apt upgrade` on this server behaves as on an apt install.
- name: Install from the Portikus apt repository
  when: portikus_deb | default('', true) | length == 0
  block:
    - name: Copy the archive signing key
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../packaging/portikus-archive-keyring.asc"
        dest: /var/cache/portikus/portikus-archive-keyring.asc
        owner: root
        group: root
        mode: "0644"
      register: portikus_archive_key

    - name: Check the archive keyring
      ansible.builtin.stat:
        path: /usr/share/keyrings/portikus-archive-keyring.gpg
      register: portikus_archive_keyring

    # apt reads a binary keyring at a .gpg path; gnupg comes from the base role.
    - name: Dearmor the archive signing key
      ansible.builtin.command:
        cmd: >-
          gpg --batch --yes --dearmor
          --output /usr/share/keyrings/portikus-archive-keyring.gpg
          /var/cache/portikus/portikus-archive-keyring.asc
      changed_when: true
      when: portikus_archive_key is changed or not portikus_archive_keyring.stat.exists

    - name: Add the Portikus apt repository
      ansible.builtin.copy:
        content: >
          deb [signed-by=/usr/share/keyrings/portikus-archive-keyring.gpg]
          {{ portikus_apt_url }} trixie main
        dest: /etc/apt/sources.list.d/portikus.list
        owner: root
        group: root
        mode: "0644"

    - name: Update the package index
      ansible.builtin.apt:
        update_cache: true

    - name: List the versions the repository offers
      ansible.builtin.command:
        cmd: apt-cache madison portikus
      register: portikus_madison
      changed_when: false

    # madison lists newest first.  A newer local build is not listed, and
    # replacing it with the newest release is a downgrade, which needs
    # PORTIKUS_VERSION like any other.
    - name: Resolve the package version
      ansible.builtin.set_fact:
        portikus_resolved_version: >-
          {{ portikus_version if (portikus_version | default('', true) | length > 0)
             else (portikus_madison.stdout_lines | select('search', portikus_apt_url)
                   | map('split', '|') | map(attribute=1) | map('trim') | first) }}

    - name: Install the portikus package
      ansible.builtin.apt:
        name: "portikus={{ portikus_resolved_version }}"
        # Only a named PORTIKUS_VERSION may roll back, so a stale mirror
        # cannot move the server to an older release.
        allow_downgrade: "{{ portikus_version | default('', true) | length > 0 }}"
