---
# Read the LTI platforms file on the machine that runs Ansible and derive
# the egress proxy entries its keysets and token endpoints need (ADR 0025,
# ADR 0027, ADR 0058).  A course's memberships URL arrives in its launches,
# so allowing its host, when it is not one of these, is the operator's job
# (portikus_egress_extra_hosts).  The file is validated by the API's own
# parser when lti.yml installs it, so there is one rule set.  Runs in the
# play's pre_tasks.

- name: Look at the LTI platforms file
  ansible.builtin.stat:
    path: "{{ portikus_lti_platforms_file }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: portikus_lti_platforms_stat

- name: Start with LTI off
  ansible.builtin.set_fact:
    portikus_lti_platforms: null
    portikus_lti_platforms_kept: false
    portikus_lti_keyset_egress: []

# A source the operator named but that is missing is far more likely a
# mistake than a request to turn LTI off, so the installed list stays.
# Only the default source being absent turns LTI off.
- name: Keep the installed LTI platforms file when the named source is missing
  when:
    - not portikus_lti_platforms_stat.stat.exists
    - portikus_lti_platforms_file != portikus_lti_platforms_default_file
  block:
    - name: Look at the installed LTI platforms file
      ansible.builtin.stat:
        path: "{{ portikus_lti_platforms_path }}"
      register: portikus_lti_installed_stat

    - name: Read the installed LTI platforms file
      ansible.builtin.slurp:
        src: "{{ portikus_lti_platforms_path }}"
      register: portikus_lti_installed
      when: portikus_lti_installed_stat.stat.exists

    - name: Use the installed LTI platforms file
      ansible.builtin.set_fact:
        portikus_lti_platforms: "{{ portikus_lti_installed.content | b64decode | from_json }}"
        portikus_lti_platforms_kept: true
      when: portikus_lti_installed_stat.stat.exists

    - name: Warn that the LTI platforms source is missing
      ansible.builtin.debug:
        msg: >-
          WARNING: the LTI platforms file {{ portikus_lti_platforms_file }} does not exist.
          {{ ('The installed list ' ~ portikus_lti_platforms_path ~ ' is kept unchanged.')
             if portikus_lti_platforms_kept else 'LTI stays off.' }}
          Copy the platforms list to {{ portikus_lti_platforms_file }}, or remove
          portikus_lti_platforms_file from your settings to turn LTI off, then run setup again.

- name: Read the LTI platforms file
  when: portikus_lti_platforms_stat.stat.exists
  run_once: true
  block:
    - name: Parse the LTI platforms file
      ansible.builtin.set_fact:
        portikus_lti_platforms: "{{ lookup('ansible.builtin.file', portikus_lti_platforms_file) | from_json }}"
  rescue:
    - name: Explain an unreadable LTI platforms file
      ansible.builtin.fail:
        msg: "The LTI platforms file {{ portikus_lti_platforms_file }} is not valid JSON."

# The API fetches each keyset and asks each token endpoint through the
# egress proxy, which needs its host and port.  One named by an IPv4
# address, like the mock's, is allowed exactly; a host name is allowed by
# name.
- name: Derive the egress proxy entries for the keysets and token endpoints
  when: portikus_lti_platforms is not none
  run_once: true
  vars:
    # Tolerant of a malformed file: the install step refuses it with the API's message.
    portikus_lti_platform_list: >-
      {{ (portikus_lti_platforms.platforms | default([]) if portikus_lti_platforms is mapping else [])
         | select('mapping') | list }}
    portikus_lti_egress_urls: >-
      {{ ((portikus_lti_platform_list | selectattr('keysetUrl', 'defined') | map(attribute='keysetUrl') | list)
          + (portikus_lti_platform_list | selectattr('authTokenUrl', 'defined') | map(attribute='authTokenUrl') | list))
         | select('string') | select('match', '^https?://[^/]') | list }}
  block:
    - name: Refuse an LMS URL at an IPv6 address, which the proxy's list cannot name
      ansible.builtin.fail:
        msg: "The LMS URL {{ item }} names an IPv6 address; use its host name instead."
      loop: "{{ portikus_lti_egress_urls | select('match', '^https?://\\[') | list }}"

    # The fact keeps its keyset name because site.yml reads it.
    - name: Allow each keyset and token endpoint host and port through the egress proxy
      ansible.builtin.set_fact:
        portikus_lti_keyset_egress: >-
          {{ (portikus_lti_keyset_egress
              + [(item | urlsplit('hostname')) ~ ':'
                 ~ ((item | urlsplit('port')) or (80 if (item | urlsplit('scheme')) == 'http' else 443))])
             | unique }}
      loop: "{{ portikus_lti_egress_urls }}"
