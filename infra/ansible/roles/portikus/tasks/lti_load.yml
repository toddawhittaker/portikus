---
# Read the LTI platforms file on the machine that runs Ansible and derive
# the egress proxy entries its keysets need (docs/archive/epics/EPIC-13.md, ruling 14;
# docs/archive/epics/EPIC-14.md, ruling 28).  The file is validated by the API's own
# parser when lti.yml installs it, so there is one rule set.  Runs in the
# play's pre_tasks.

- name: Look at the LTI platforms file
  ansible.builtin.stat:
    path: "{{ portikus_lti_platforms_file }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: portikus_lti_platforms_stat

- name: Start with LTI off
  ansible.builtin.set_fact:
    portikus_lti_platforms: null
    portikus_lti_keyset_egress: []

- name: Read the LTI platforms file
  when: portikus_lti_platforms_stat.stat.exists
  run_once: true
  block:
    - name: Parse the LTI platforms file
      ansible.builtin.set_fact:
        portikus_lti_platforms: "{{ lookup('ansible.builtin.file', portikus_lti_platforms_file) | from_json }}"
  rescue:
    - name: Explain an unreadable LTI platforms file
      ansible.builtin.fail:
        msg: "The LTI platforms file {{ portikus_lti_platforms_file }} is not valid JSON."

# The API fetches each keyset through the egress proxy, which needs its host
# and port.  A keyset named by an IPv4 address, like the mock's, is allowed
# exactly; a host name is allowed by name.
- name: Derive the egress proxy entries for the keysets
  when: portikus_lti_platforms is not none
  run_once: true
  vars:
    # Tolerant of a malformed file: the install step refuses it with the API's message.
    portikus_lti_keyset_urls: >-
      {{ (portikus_lti_platforms.platforms | default([]) if portikus_lti_platforms is mapping else [])
         | select('mapping') | selectattr('keysetUrl', 'defined') | map(attribute='keysetUrl')
         | select('string') | select('match', '^https?://[^/]') | list }}
  block:
    - name: Refuse a keyset at an IPv6 address, which the proxy's list cannot name
      ansible.builtin.fail:
        msg: "The LMS keyset URL {{ item }} names an IPv6 address; use its host name instead."
      loop: "{{ portikus_lti_keyset_urls | select('match', '^https?://\\[') | list }}"

    - name: Allow each keyset host and port through the egress proxy
      ansible.builtin.set_fact:
        portikus_lti_keyset_egress: >-
          {{ (portikus_lti_keyset_egress
              + [(item | urlsplit('hostname')) ~ ':'
                 ~ ((item | urlsplit('port')) or (80 if (item | urlsplit('scheme')) == 'http' else 443))])
             | unique }}
      loop: "{{ portikus_lti_keyset_urls }}"
