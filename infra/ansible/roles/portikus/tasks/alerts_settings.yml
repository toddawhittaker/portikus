---
# Check the administrator alert settings in secrets.yaml (STACK.md section
# 15).  Runs in the play's pre_tasks, so a bad value changes nothing on the
# host.  They seed /etc/portikus/notify.json only while it is missing, and
# the alerts job checks them again then (ADR 0052).  alerts-render-test.yml
# tries each refusal.  The values are secrets, so no task here prints them.

# One key without the other cannot send, so it is a mistake, not "off".
# systemd reads alerts.env unquoted, so only characters it keeps as written.
- name: Require both Pushover keys or neither, each letters and digits
  ansible.builtin.assert:
    that:
      - (portikus_alert_pushover_user_key | length > 0) == (portikus_alert_pushover_app_token | length > 0)
      - portikus_alert_pushover_user_key is match('^[A-Za-z0-9]{0,100}$')
      - portikus_alert_pushover_app_token is match('^[A-Za-z0-9]{0,100}$')
    fail_msg: >-
      portikus_alert_pushover_user_key and portikus_alert_pushover_app_token
      go together: set both, from your Pushover account and application, or
      neither.  Each is letters and digits only.
    quiet: true
  no_log: true

# The alert crosses the internet, and a webhook URL is often a secret
# itself.  The egress proxy opens only port 443 for it, and never a name
# that begins with a dot, which would stand for every subdomain.
- name: Require an https webhook URL with a host name, on port 443
  ansible.builtin.assert:
    that:
      - portikus_alert_webhook_url is match("^https://[!-~]+\\Z")
      - portikus_alert_webhook_url is not search("[\"'\\\\]")
      - portikus_alert_webhook_url | length <= 500
      - (portikus_alert_webhook_url | urlsplit('netloc') | regex_replace(':443$', ''))
        is match('^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$')
      - (portikus_alert_webhook_url | urlsplit('netloc')).split('.') | last is not match('^[0-9]+(:443)?$')
    fail_msg: >-
      portikus_alert_webhook_url must be an https:// URL with a host name on
      the standard port, such as https://hooks.slack.com/services/..., with
      no spaces, quotes or backslashes.  Plain http would send the alerts and
      the URL in the clear.
    quiet: true
  when: portikus_alert_webhook_url | length > 0
  no_log: true
