---
# Install the Portikus control-plane Debian package at a pinned version and
# render the deployment-specific secrets and environment files (ADR 0007).
# The package owns the service users, /etc/portikus, /var/lib/portikus, and
# the three systemd units, so nothing here creates them.

# ── Remove the Epic 3 interim deployment ──────────────────────────
# A VM configured before ADR 0007 has hand-written units, an rsynced app
# directory, and a global pnpm.  The package owns those names now, so an
# existing VM has to be cleaned before the package is installed.

- name: Remove Epic 3 systemd units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - portikus-api.service
    - portikus-worker.service
    - portikus-controller.service
  register: portikus_legacy_units

# Not a handler: this has to run before the package install, not at the end of the play.
- name: Reload systemd after removing the Epic 3 units  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: portikus_legacy_units is changed

- name: Remove the Epic 3 application directory
  ansible.builtin.file:
    path: /var/lib/portikus/app
    state: absent

- name: Remove the globally installed pnpm
  community.general.npm:
    name: pnpm
    global: true
    state: absent

# ── Debian package ────────────────────────────────────────────────

- name: Create package cache directory
  ansible.builtin.file:
    path: /var/cache/portikus
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the portikus package
  ansible.builtin.get_url:
    url: "https://github.com/toddawhittaker/portikus/releases/download/v{{ portikus_version }}/portikus_{{ portikus_version }}_amd64.deb"
    dest: "/var/cache/portikus/portikus_{{ portikus_version }}_amd64.deb"
    checksum: "sha256:{{ portikus_deb_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Install the portikus package
  ansible.builtin.apt:
    deb: "/var/cache/portikus/portikus_{{ portikus_version }}_amd64.deb"
    # So that pinning an older portikus_version actually rolls back.
    allow_downgrade: true

# ── Controller token (generated once) ────────────────────────────

- name: Generate controller token
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > /etc/portikus/controller.token
    creates: /etc/portikus/controller.token
  no_log: true

- name: Set controller token file permissions
  ansible.builtin.file:
    path: /etc/portikus/controller.token
    owner: root
    group: root
    mode: "0600"

- name: Read controller token
  ansible.builtin.slurp:
    src: /etc/portikus/controller.token
  register: portikus_token_file
  no_log: true

- name: Set controller token fact
  ansible.builtin.set_fact:
    portikus_controller_token: "{{ portikus_token_file.content | b64decode | trim }}"
  no_log: true

# ── Environment files ────────────────────────────────────────────

- name: Deploy api environment file
  ansible.builtin.template:
    src: api.env.j2
    dest: /etc/portikus/api.env
    owner: root
    group: portikus
    mode: "0640"
  notify: Restart portikus-api

- name: Deploy worker environment file
  ansible.builtin.template:
    src: worker.env.j2
    dest: /etc/portikus/worker.env
    owner: root
    group: portikus
    mode: "0640"
  notify: Restart portikus-worker

- name: Deploy controller environment file
  ansible.builtin.template:
    src: controller.env.j2
    dest: /etc/portikus/controller.env
    owner: root
    group: portikus-controller
    mode: "0640"
  notify: Restart portikus-controller

# ── Start the services ───────────────────────────────────────────
# The package enables the units, but ConditionPathExists keeps them from
# starting until the environment files above exist.

- name: Start portikus services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - portikus-api
    - portikus-worker
    - portikus-controller
