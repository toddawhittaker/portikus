---
# Set up system users, directories, secrets, env files, and systemd units
# for the three Portikus control-plane services (STACK.md section 22).

# ── System users ──────────────────────────────────────────────────

- name: Create portikus system user (api and worker)
  ansible.builtin.user:
    name: portikus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create portikus-controller system user
  ansible.builtin.user:
    name: portikus-controller
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: incus-admin
    append: true

# ── Application directory ────────────────────────────────────────

- name: Create application directory
  ansible.builtin.file:
    path: /var/lib/portikus/app
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"

# ── Configuration directory ───────────────────────────────────────

- name: Create configuration directory
  ansible.builtin.file:
    path: /etc/portikus
    state: directory
    owner: root
    group: root
    mode: "0755"

# ── Controller token (generated once) ────────────────────────────

- name: Generate controller token
  ansible.builtin.shell:
    cmd: openssl rand -hex 32 > /etc/portikus/controller.token
    creates: /etc/portikus/controller.token
  no_log: true

- name: Set controller token file permissions
  ansible.builtin.file:
    path: /etc/portikus/controller.token
    owner: root
    group: root
    mode: "0600"

- name: Read controller token
  ansible.builtin.slurp:
    src: /etc/portikus/controller.token
  register: portikus_token_file
  no_log: true

- name: Set controller token fact
  ansible.builtin.set_fact:
    portikus_controller_token: "{{ portikus_token_file.content | b64decode | trim }}"
  no_log: true

# ── Environment files ────────────────────────────────────────────

- name: Deploy api environment file
  ansible.builtin.template:
    src: api.env.j2
    dest: /etc/portikus/api.env
    owner: root
    group: portikus
    mode: "0640"
  notify: Restart portikus-api

- name: Deploy worker environment file
  ansible.builtin.template:
    src: worker.env.j2
    dest: /etc/portikus/worker.env
    owner: root
    group: portikus
    mode: "0640"
  notify: Restart portikus-worker

- name: Deploy controller environment file
  ansible.builtin.template:
    src: controller.env.j2
    dest: /etc/portikus/controller.env
    owner: root
    group: portikus-controller
    mode: "0640"
  notify: Restart portikus-controller

# ── Systemd units ─────────────────────────────────────────────────

- name: Deploy portikus-api systemd unit
  ansible.builtin.template:
    src: portikus-api.service.j2
    dest: /etc/systemd/system/portikus-api.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart portikus-api

- name: Deploy portikus-worker systemd unit
  ansible.builtin.template:
    src: portikus-worker.service.j2
    dest: /etc/systemd/system/portikus-worker.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart portikus-worker

- name: Deploy portikus-controller systemd unit
  ansible.builtin.template:
    src: portikus-controller.service.j2
    dest: /etc/systemd/system/portikus-controller.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart portikus-controller

- name: Enable portikus services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - portikus-api
    - portikus-worker
    - portikus-controller
