---
# Install the Portikus control-plane Debian package (newest release by default)
# and render the deployment-specific secrets and environment files (ADR 0007).
# The package owns the service users, /etc/portikus, /var/lib/portikus, and
# the three systemd units, so nothing here creates them.

# ── Remove the Epic 3 interim deployment ──────────────────────────
# A VM configured before ADR 0007 has hand-written units, an rsynced app
# directory, and a global pnpm.  The package owns those names now, so an
# existing VM has to be cleaned before the package is installed.

- name: Remove Epic 3 systemd units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - portikus-api.service
    - portikus-worker.service
    - portikus-controller.service
  register: portikus_legacy_units

# Not a handler: this has to run before the package install, not at the end of the play.
- name: Reload systemd after removing the Epic 3 units  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: portikus_legacy_units is changed

- name: Remove the Epic 3 application directory
  ansible.builtin.file:
    path: /var/lib/portikus/app
    state: absent

- name: Remove the globally installed pnpm
  community.general.npm:
    name: pnpm
    global: true
    state: absent

# ── Debian package ────────────────────────────────────────────────

- name: Create package cache directory
  ansible.builtin.file:
    path: /var/cache/portikus
    state: directory
    owner: root
    group: root
    mode: "0755"

# Three ways to choose the package, in order: a locally built .deb named by
# PORTIKUS_DEB (for testing a branch), the release named by PORTIKUS_VERSION
# (for a rollback), or the newest GitHub release.
- name: Use a locally built package
  ansible.builtin.copy:
    src: "{{ portikus_deb }}"
    dest: "/var/cache/portikus/{{ portikus_deb | basename }}"
    owner: root
    group: root
    mode: "0644"
  when: portikus_deb | default('', true) | length > 0

- name: Set the local package file name
  ansible.builtin.set_fact:
    portikus_deb_filename: "{{ portikus_deb | basename }}"
  when: portikus_deb | default('', true) | length > 0

- name: Look up the newest release
  ansible.builtin.uri:
    url: https://api.github.com/repos/toddawhittaker/portikus/releases/latest
    return_content: true
  register: portikus_latest_release
  when:
    - portikus_deb | default('', true) | length == 0
    - portikus_version | default('', true) | length == 0

- name: Resolve the release package
  when: portikus_deb | default('', true) | length == 0
  block:
    - name: Resolve the package version
      ansible.builtin.set_fact:
        portikus_resolved_version: >-
          {{ portikus_version if (portikus_version | default('', true) | length > 0)
             else (portikus_latest_release.json.tag_name | regex_replace('^v', '')) }}

    - name: Set the release package file name
      ansible.builtin.set_fact:
        portikus_deb_filename: "portikus_{{ portikus_resolved_version }}_amd64.deb"

    - name: Download the release checksums
      ansible.builtin.get_url:
        url: "https://github.com/toddawhittaker/portikus/releases/download/v{{ portikus_resolved_version }}/SHA256SUMS"
        dest: "/var/cache/portikus/{{ portikus_deb_filename }}.SHA256SUMS"
        owner: root
        group: root
        mode: "0644"

    - name: Read the release checksums
      ansible.builtin.slurp:
        src: "/var/cache/portikus/{{ portikus_deb_filename }}.SHA256SUMS"
      register: portikus_release_checksums

    - name: Take this package's checksum from the release checksums
      ansible.builtin.set_fact:
        portikus_deb_checksum: >-
          {{ (portikus_release_checksums.content | b64decode)
             | regex_search('([0-9a-f]{64})\s+\*?' ~ (portikus_deb_filename | regex_escape) ~ '\s*$',
                            '\1', multiline=True) | first }}

    - name: Download the portikus package
      ansible.builtin.get_url:
        url: "https://github.com/toddawhittaker/portikus/releases/download/v{{ portikus_resolved_version }}/{{ portikus_deb_filename }}"
        dest: "/var/cache/portikus/{{ portikus_deb_filename }}"
        checksum: "sha256:{{ portikus_deb_checksum }}"
        owner: root
        group: root
        mode: "0644"

- name: Install the portikus package
  ansible.builtin.apt:
    deb: "/var/cache/portikus/{{ portikus_deb_filename }}"
    # So that setting PORTIKUS_VERSION or PORTIKUS_DEB to an older build rolls back.
    allow_downgrade: true

# Release 0.1.40 shipped this directory owned by the portikus service user and
# dpkg keeps the ownership of a directory that already exists, so hosts that
# installed that release need it corrected here.
- name: Correct the state directory ownership
  ansible.builtin.file:
    path: /var/lib/portikus
    state: directory
    owner: root
    group: root
    mode: "0755"

# ── Controller token (generated once) ────────────────────────────

- name: Generate controller token
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > /etc/portikus/controller.token
    creates: /etc/portikus/controller.token
  no_log: true

- name: Set controller token file permissions
  ansible.builtin.file:
    path: /etc/portikus/controller.token
    owner: root
    group: root
    mode: "0600"

- name: Read controller token
  ansible.builtin.slurp:
    src: /etc/portikus/controller.token
  register: portikus_token_file
  no_log: true

- name: Set controller token fact
  ansible.builtin.set_fact:
    portikus_controller_token: "{{ portikus_token_file.content | b64decode | trim }}"
  no_log: true

# ── Session cookie secret (generated once) ───────────────────────
# Generated on the VM rather than checked in, and never regenerated, so
# existing sessions survive a re-run of this playbook.

- name: Generate session cookie secret
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > /etc/portikus/session.secret
    creates: /etc/portikus/session.secret
  no_log: true

- name: Set session secret file permissions
  ansible.builtin.file:
    path: /etc/portikus/session.secret
    owner: root
    group: root
    mode: "0600"

- name: Read session cookie secret
  ansible.builtin.slurp:
    src: /etc/portikus/session.secret
  register: portikus_session_secret_file
  no_log: true

- name: Set session cookie secret fact
  ansible.builtin.set_fact:
    portikus_session_cookie_secret: "{{ portikus_session_secret_file.content | b64decode | trim }}"
  no_log: true

# ── Identity provider ────────────────────────────────────────────

# Generated once on the VM like the controller token and the session secret,
# so no published secret is ever a working credential on a real host.
- name: Generate mock identity provider client secret
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > /etc/portikus/mock-client.secret
    creates: /etc/portikus/mock-client.secret
  when: portikus_mock_idp
  no_log: true

- name: Set mock client secret file permissions
  ansible.builtin.file:
    path: /etc/portikus/mock-client.secret
    owner: root
    group: root
    mode: "0600"
  when: portikus_mock_idp

- name: Read mock identity provider client secret
  ansible.builtin.slurp:
    src: /etc/portikus/mock-client.secret
  register: portikus_mock_client_secret_file
  when: portikus_mock_idp
  no_log: true

- name: Set mock identity provider client secret fact
  ansible.builtin.set_fact:
    portikus_mock_client_secret: "{{ portikus_mock_client_secret_file.content | b64decode | trim }}"
  when: portikus_mock_idp
  no_log: true

# The dex role generates this secret; it is read again here so a run limited
# to this role still has it.
- name: Read the Dex client secret
  ansible.builtin.slurp:
    src: /etc/portikus/dex-client.secret
  register: portikus_dex_client_secret_file
  when: portikus_idp == 'dex'
  no_log: true

# The API's one issuer is Dex, or the mock (SPEC.md section 5.1).
# Both are served by Caddy on the public host, so the API reaches either
# over loopback with a certificate it trusts.
- name: Set the effective identity provider settings
  ansible.builtin.set_fact:
    portikus_effective_oidc_issuer: >-
      {{ portikus_dex_issuer if portikus_idp == 'dex' else portikus_public_url ~ '/mock-idp' }}
    portikus_effective_oidc_client_id: "{{ 'portikus' if portikus_idp == 'dex' else 'portikus-dev' }}"
    portikus_effective_oidc_client_secret: >-
      {{ (portikus_dex_client_secret_file.content | b64decode | trim) if portikus_idp == 'dex'
         else portikus_mock_client_secret }}
  no_log: true

- name: Deploy mock identity provider environment file
  ansible.builtin.template:
    src: mock-idp.env.j2
    dest: /etc/portikus/mock-idp.env
    owner: root
    group: portikus
    mode: "0640"
  when: portikus_mock_idp
  notify: Restart portikus-mock-idp

- name: Enable and start the mock identity provider
  ansible.builtin.systemd:
    name: portikus-mock-idp
    enabled: true
    state: started
  when: portikus_mock_idp

- name: Disable and stop the mock identity provider
  ansible.builtin.systemd:
    name: portikus-mock-idp
    enabled: false
    state: stopped
  when: not portikus_mock_idp

# Without the environment file the unit cannot start even if something
# enables it by hand (ConditionPathExists).
- name: Remove the mock identity provider environment file
  ansible.builtin.file:
    path: /etc/portikus/mock-idp.env
    state: absent
  when: not portikus_mock_idp

- name: Remove the mock identity provider client secret
  ansible.builtin.file:
    path: /etc/portikus/mock-client.secret
    state: absent
  when: not portikus_mock_idp

# A fresh VM has no tables until the API first starts, and a handler may
# still owe the restart that migrates.  The users-file import and the
# local administrator below both need the current schema; the API runs the
# same migration on every start, so this changes nothing else.
- name: Bring the database schema up to date
  ansible.builtin.command:
    argv: [runuser, -u, portikus, --, /usr/bin/node, /usr/lib/portikus/api/node_modules/@portikus/db/dist/migrate.js]
  environment:
    DATABASE_URL: "{{ portikus_database_url }}"
  register: portikus_migrate
  changed_when: "'Applied migrations' in portikus_migrate.stdout"

# Anyone could sign in as anyone through the mock, so its sessions end when
# the site moves to a real provider (SPEC.md section 24).
- name: End the mock provider's sessions
  ansible.builtin.command:
    argv: [runuser, -u, portikus, --, psql, -X, -tA, -v, ON_ERROR_STOP=1, -v, "issuer={{ portikus_public_url }}/mock-idp", -d, "{{ portikus_database_url }}"]
    stdin: >-
      WITH gone AS (DELETE FROM sessions WHERE user_id IN
      (SELECT id FROM users WHERE oidc_issuer = :'issuer') RETURNING 1)
      SELECT count(*) FROM gone;
  register: portikus_mock_sessions
  changed_when: portikus_mock_sessions.stdout | trim != '0'
  when: portikus_idp != 'mock'

# The gRPC client key, and the one-time users-file import, before api.env
# names the key and the local administrator below is made through it.
- name: Give the API what it needs from Dex
  ansible.builtin.include_role:
    name: dex
    tasks_from: api
  when: portikus_idp == 'dex'

# ── Environment files ────────────────────────────────────────────

- name: Deploy api environment file
  ansible.builtin.template:
    src: api.env.j2
    dest: /etc/portikus/api.env
    owner: root
    group: portikus
    mode: "0640"
  notify: Restart portikus-api

# ── LTI launch (docs/archive/epics/EPIC-13.md) ─────────────────────────────────
# After api.env, which names the files these tasks write.
- name: Apply the LTI platforms file and tool key
  ansible.builtin.import_tasks: lti.yml
  tags: lti

# The API reaches the internet only through the egress proxy now (ADR 0027),
# so the packaged unit's loopback and bridge limit is all it gets.  This
# removes the address drop-in older plays wrote.
- name: Remove the old API address allow drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/portikus-api.service.d/10-idp-egress.conf
    state: absent
  tags: lti
  notify:
    - Reload systemd
    - Restart portikus-api

- name: Deploy worker environment file
  ansible.builtin.template:
    src: worker.env.j2
    dest: /etc/portikus/worker.env
    owner: root
    group: portikus
    mode: "0640"
  notify: Restart portikus-worker

- name: Deploy controller environment file
  ansible.builtin.template:
    src: controller.env.j2
    dest: /etc/portikus/controller.env
    owner: root
    group: portikus-controller
    mode: "0640"
  notify: Restart portikus-controller

# ── Start the services ───────────────────────────────────────────
# The package enables the units, but ConditionPathExists keeps them from
# starting until the environment files above exist.

- name: Start portikus services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - portikus-api
    - portikus-worker
    - portikus-controller

# ── The local administrator (ADR 0031, SPEC.md section 5.1) ──
# Made on the first run.  After that --if-missing leaves the account alone,
# even one an administrator removed, and its exit status says whether the
# one-time password is still unchanged (10) or spent (11).  The command
# writes the password only to a root-only file and prints where it is.  A
# package from before the command existed skips this.
- name: Look for the portikus command
  ansible.builtin.stat:
    path: /usr/bin/portikus
  register: portikus_command
  when: portikus_idp == 'dex'

- name: Make the local administrator
  when: portikus_idp == 'dex' and portikus_command.stat.exists
  block:
    - name: Make the local administrator if there is none
      ansible.builtin.command:
        argv: [/usr/bin/portikus, reset-admin, --if-missing, --email, "{{ portikus_admin_email }}"]
      register: portikus_local_admin
      changed_when: portikus_local_admin.rc == 0
      failed_when: portikus_local_admin.rc not in [0, 10, 11]

    - name: Say where the one-time password is
      ansible.builtin.debug:
        msg: >-
          {{ ('Made the local administrator, ' ~ portikus_admin_email ~ '.  ') if portikus_local_admin.rc == 0 else '' }}{{
             portikus_local_admin.stdout_lines | join('  ') }}
      when: portikus_local_admin.rc in [0, 10]

    # It holds a password that no longer works (ruling 15).
    - name: Remove the spent one-time password
      ansible.builtin.file:
        path: /etc/portikus/admin-password
        state: absent
      when: portikus_local_admin.rc == 11
