---
# Listed first so a changed drop-in is loaded before the restart below.
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart portikus-api
  ansible.builtin.systemd:
    name: portikus-api
    state: restarted

- name: Restart portikus-worker
  ansible.builtin.systemd:
    name: portikus-worker
    state: restarted

- name: Restart portikus-controller
  ansible.builtin.systemd:
    name: portikus-controller
    state: restarted

- name: Restart portikus-mock-idp
  ansible.builtin.systemd:
    name: portikus-mock-idp
    state: restarted
