---
# Incus managed network for student workspaces (STACK.md sections 24, 29).
# This network is separate from the management network.  An Incus network
# ACL enforces peer-workspace isolation at layer 2, which the host forward
# chain cannot do because bridged traffic between containers on the same
# bridge never leaves the bridge.

- name: Check if Incus network exists
  ansible.builtin.command:
    cmd: incus network show {{ incus_network_name }}
  register: incus_network_net_check
  changed_when: false
  failed_when: false

- name: Create Incus managed network
  ansible.builtin.command:
    cmd: >-
      incus network create {{ incus_network_name }}
      ipv4.address={{ incus_network_cidr }}
      ipv4.nat=true
      ipv6.address=none
  when: incus_network_net_check.rc != 0
  changed_when: true

# --- Peer-workspace isolation via Incus network ACL (section 29) ---
# Containers share one bridge, so we use an ACL to deny traffic between
# workspaces.  The ACL allows egress to the internet and the bridge
# gateway (for DNS/DHCP), but denies the bridge subnet, the management
# CIDR and workspace_egress_denied_ranges.  Default ingress is set to deny
# so containers cannot receive unsolicited traffic from peers.

- name: Check if workspace network ACL exists
  ansible.builtin.command:
    cmd: incus network acl show {{ incus_network_name }}-acl
  register: incus_network_acl_check
  changed_when: false
  failed_when: false
  # Read-only, so a --check run can still show whether the rules would change.
  check_mode: false

- name: Create workspace network ACL
  ansible.builtin.command:
    cmd: incus network acl create {{ incus_network_name }}-acl
  when: incus_network_acl_check.rc != 0
  changed_when: true

# The rules come from templates/workspace-acl.yaml.j2 and replace the ACL's
# rules as a whole, so a range dropped from workspace_egress_denied_ranges
# also leaves the ACL.
- name: Render the workspace network ACL rules
  ansible.builtin.set_fact:
    incus_network_acl_wanted: "{{ lookup('ansible.builtin.template', 'workspace-acl.yaml.j2') | from_yaml }}"

- name: Parse the current workspace network ACL rules
  ansible.builtin.set_fact:
    incus_network_acl_current: >-
      {{ incus_network_acl_check.stdout | default('', true) | from_yaml | default({}, true) }}

# Default actions are not ACL config keys in Incus. They are set on the
# network below, in "Attach ACL to workspace network", as
# security.acls.default.{ingress,egress}.action=drop.
- name: Replace the workspace network ACL rules
  ansible.builtin.command:
    cmd: incus network acl edit {{ incus_network_name }}-acl
    stdin: "{{ incus_network_acl_wanted | to_nice_yaml }}"
  when: >-
    incus_network_acl_current.egress | default([]) != incus_network_acl_wanted.egress
    or incus_network_acl_current.ingress | default([]) != incus_network_acl_wanted.ingress
  changed_when: true

# Attach ACL to the workspace network (only when config differs)
- name: Get current network ACL setting
  ansible.builtin.command:
    cmd: incus network get {{ incus_network_name }} security.acls
  register: incus_network_current_acl
  changed_when: false
  failed_when: false

- name: Get current default ingress action
  ansible.builtin.command:
    cmd: incus network get {{ incus_network_name }} security.acls.default.ingress.action
  register: incus_network_current_ingress
  changed_when: false
  failed_when: false

- name: Get current default egress action
  ansible.builtin.command:
    cmd: incus network get {{ incus_network_name }} security.acls.default.egress.action
  register: incus_network_current_egress
  changed_when: false
  failed_when: false

- name: Attach ACL to workspace network
  ansible.builtin.command:
    cmd: >-
      incus network set {{ incus_network_name }}
      security.acls={{ incus_network_name }}-acl
      security.acls.default.ingress.action=drop
      security.acls.default.egress.action=drop
  when: >-
    incus_network_current_acl.stdout | trim != incus_network_name ~ '-acl'
    or incus_network_current_ingress.stdout | trim != 'drop'
    or incus_network_current_egress.stdout | trim != 'drop'
  changed_when: true

# Incus writes its ACL rules into the host firewall, and the firewall only
# sees traffic between two containers on the same bridge when br_netfilter
# is loaded.  Without it the peer-isolation rule above never matches
# (SPEC.md 23.3).
- name: Load the bridge netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present
    persistent: present

- name: Filter bridged traffic with the firewall
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: "1"
    sysctl_set: true
    reload: true

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    reload: true
