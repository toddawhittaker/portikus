---
# Dex, the site's own sign-in provider (ADR 0023, ADR 0028).
# dex_version, dex_commit, dex_port, the dex_grpc_* paths and
# portikus_users_file are set in site.yml.
dex_config_dir: /etc/portikus-dex
dex_client_secret_file: /etc/portikus/dex-client.secret
dex_src_dir: /root/go/src/dex
dex_marker: /usr/local/share/portikus/dex-commit
# The pinned build's pages, with accessibility fixes; Dex reads them from frontend.dir.
dex_web_dir: /usr/local/share/portikus/dex-web
# A separate build cache, so clearing it after a build leaves distrobuilder's alone.
dex_gocache: /root/go/dex-cache
# The bcrypt shape allowed: cost 10 to 12, as higher costs let counted
# password attempts burn the VM's CPU (docs/EPIC-12B.md, the users file).
dex_bcrypt_pattern: '^\$2[aby]\$1[0-2]\$[./A-Za-z0-9]{53}$'

# The gRPC API (dex_grpc_addr and dex_grpc_dir, set in site.yml).
# Certificates are reissued when they have less than this many days left.
dex_grpc_renew_days: 30

# The one-time import of the users file (ruling 23), run by the portikus
# role once the package is installed.
dex_import_script: /usr/lib/portikus/api/node_modules/@portikus/auth/dist/dex-import-main.js
dex_import_input: /run/portikus-dex-import.json

# The upstream connector's settings (portikus_ldap_* and
# portikus_dex_upstream_client_*) are set in site.yml.
dex_ldap_root_ca_path: "{{ dex_config_dir }}/ldap-ca.crt"
# The id becomes the Portikus account's subject, so it must never be reused.
# OpenLDAP's entryUUID is not.  AD's objectGUID is binary, which Dex
# v2.45.1 cannot put in a subject, so AD keeps sAMAccountName: disable a
# departed account, never delete it (docs/OPERATIONS.md).
dex_ldap_attributes:
  ad:
    username: sAMAccountName
    id: sAMAccountName
    name: displayName
    group_filter: (objectClass=group)
  openldap:
    username: uid
    id: entryUUID
    name: cn
    group_filter: (objectClass=groupOfNames)
