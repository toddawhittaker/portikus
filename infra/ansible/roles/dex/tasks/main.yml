---
# Dex, the site's own sign-in provider (ADR 0023, ADR 0028).
# Built from source at a pinned commit, the way distrobuilder is (ADR 0004),
# because Dex publishes no binaries and Debian has no package for it.

- name: Install and run Dex
  when: portikus_idp == 'dex'
  block:
    # The role installs its own toolchain so it does not depend on image_builder
    # running first.  Dex links SQLite through cgo, hence build-essential.
    - name: Install the Dex build prerequisites
      ansible.builtin.apt:
        name:
          - golang-go
          - git
          - build-essential
        state: present

    - name: Create the portikus-dex group
      ansible.builtin.group:
        name: portikus-dex
        system: true

    - name: Create the portikus-dex user
      ansible.builtin.user:
        name: portikus-dex
        group: portikus-dex
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false

    # ── Build at the pinned commit ───────────────────────────────

    - name: Read the installed Dex commit marker
      ansible.builtin.slurp:
        src: "{{ dex_marker }}"
      register: dex_marker_file
      failed_when: false

    - name: Look for the Dex binary
      ansible.builtin.stat:
        path: /usr/local/bin/dex
      register: dex_binary

    - name: Look for the Dex web templates
      ansible.builtin.stat:
        path: "{{ dex_web_dir }}/templates/password.html"
      register: dex_web_templates

    - name: Decide whether Dex needs building
      ansible.builtin.set_fact:
        dex_needs_build: >-
          {{ not dex_binary.stat.exists
             or not dex_web_templates.stat.exists
             or (dex_marker_file.content | default('') | b64decode | trim) != dex_commit }}

    - name: Build Dex
      when: dex_needs_build | bool
      block:
        - name: Check out Dex at the pinned commit
          ansible.builtin.git:
            repo: https://github.com/dexidp/dex.git
            dest: "{{ dex_src_dir }}"
            version: "{{ dex_commit }}"
            depth: 1
            force: true

        # Git names a commit by the hash of its contents, so this proves the
        # tree is exactly the pinned source.
        - name: Read the checked-out commit
          ansible.builtin.command:
            cmd: git rev-parse HEAD
            chdir: "{{ dex_src_dir }}"
          register: dex_checked_out
          changed_when: false

        - name: Require the pinned commit
          ansible.builtin.assert:
            that:
              - dex_checked_out.stdout | trim == dex_commit
            fail_msg: "Checked out {{ dex_checked_out.stdout }}, expected {{ dex_commit }}."

        - name: Remove a half-built binary from an earlier failed run
          ansible.builtin.file:
            path: /usr/local/bin/dex.new
            state: absent

        # The same environment as distrobuilder (ADR 0004).  GOTOOLCHAIN=auto
        # fetches the Go version go.mod names, verified against Go's checksum
        # database; go.sum verifies every module.  A failure here stops the
        # play with the old binary and marker still in place.
        - name: Compile Dex
          ansible.builtin.command:
            cmd: >-
              go build -trimpath
              -ldflags "-w -X main.version={{ dex_version }}"
              -o /usr/local/bin/dex.new ./cmd/dex
            chdir: "{{ dex_src_dir }}"
          environment:
            GOPATH: /root/go
            GOCACHE: "{{ dex_gocache }}"
            GOMODCACHE: /root/go/pkg/mod
            GOFLAGS: -buildvcs=false
            GOTOOLCHAIN: auto
          changed_when: true

        - name: Check that the new binary reports the pinned version
          ansible.builtin.command:
            cmd: /usr/local/bin/dex.new version
          register: dex_new_version
          changed_when: false
          failed_when: "('Dex Version: ' ~ dex_version) not in dex_new_version.stdout"

        - name: Put the new Dex binary in place
          ansible.builtin.copy:
            src: /usr/local/bin/dex.new
            dest: /usr/local/bin/dex
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          notify: Restart portikus-dex

        - name: Remove the staging binary
          ansible.builtin.file:
            path: /usr/local/bin/dex.new
            state: absent

        # frontend.dir replaces Dex's built-in pages as a whole, so the tree is
        # taken from the same pinned source and patched below.
        - name: Remove the web templates of the previous build
          ansible.builtin.file:
            path: "{{ dex_web_dir }}"
            state: absent

        - name: Install the web templates of this build
          ansible.builtin.copy:
            src: "{{ dex_src_dir }}/web/"
            dest: "{{ dex_web_dir }}/"
            remote_src: true
            owner: root
            group: root
            mode: u=rwX,go=rX
          notify: Restart portikus-dex

        - name: Create the marker directory
          ansible.builtin.file:
            path: "{{ dex_marker | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Record the installed Dex commit
          ansible.builtin.copy:
            dest: "{{ dex_marker }}"
            content: "{{ dex_commit }}\n"
            owner: root
            group: root
            mode: "0644"

        # About a gigabyte on a 20 GiB disk; the module cache stays for the next build.
        - name: Clear the Dex build cache
          ansible.builtin.file:
            path: "{{ dex_gocache }}"
            state: absent

    # The Portikus theme (ADR 0023, "Pages"), which frontend.theme selects.
    # Dex serves these files as they are, so changing them needs no restart.
    - name: Install the Portikus theme for the Dex pages
      ansible.builtin.copy:
        src: theme/
        dest: "{{ dex_web_dir }}/themes/portikus/"
        owner: root
        group: root
        mode: u=rwX,go=rX

    - name: Install the theme's font
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../packages/ui/src/fonts/PublicSans-Variable.woff2"
        dest: "{{ dex_web_dir }}/themes/portikus/PublicSans-Variable.woff2"
        owner: root
        group: root
        mode: "0644"

    # Template patches, re-applied after every build: the logo moves into the
    # sign-in card with a text alternative, and the card becomes the main
    # landmark; each page has a first-level heading, names its language and
    # keeps the natural tab order; each connector is one link, not a button
    # inside a link; the sign-in fields name what browsers should fill; the
    # words match the Portikus sign-in page; a failed sign-in is announced to
    # screen readers and marks the password field invalid.  Dex's own
    # template braces are escaped or carried by a backreference, so Ansible
    # never evaluates them.
    - name: Put the logo in the Dex sign-in card
      ansible.builtin.replace:
        path: "{{ dex_web_dir }}/templates/header.html"
        regexp: '<div class="theme-navbar">[\s\S]*?src="([^"]*)">[\s\S]*?<div class="dex-container">'
        replace: '<div class="dex-container" role="main">\n      <img class="theme-logo" src="\1" alt="Portikus">'
      notify: Restart portikus-dex

    - name: Make each Dex page heading a first-level heading
      ansible.builtin.replace:
        path: "{{ dex_web_dir }}/templates/{{ item }}"
        regexp: '<h2 class="theme-heading">(.*)</h2>'
        replace: '<h1 class="theme-heading">\1</h1>'
      loop: [approval.html, device.html, device_success.html, error.html, login.html, oob.html, password.html]
      notify: Restart portikus-dex

    - name: Drop the positive tab order from the Dex forms
      ansible.builtin.replace:
        path: "{{ dex_web_dir }}/templates/{{ item }}"
        regexp: ' tabindex="[0-9]+"'
        replace: ''
      loop: [device.html, password.html]
      notify: Restart portikus-dex

    - name: Patch the Dex sign-in forms and words
      ansible.builtin.replace:
        path: "{{ dex_web_dir }}/templates/{{ item.file }}"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - {file: header.html, regexp: '<title>\{\{ issuer \}\}</title>', replace: '<title>Sign in, Portikus</title>'}
        - {file: password.html, regexp: '>Log in to Your Account<', replace: '>Sign in to Portikus<'}
        - {file: password.html, regexp: '>Login</button>', replace: '>Sign in</button>'}
        - file: password.html
          regexp: 'Invalid (\{\{ \.UsernamePrompt) \}\} and password\.'
          replace: 'That \1 | lower }} or password is wrong.'
        - file: password.html
          regexp: '(id="login" name="login" type="text") class='
          replace: '\1 autocomplete="username" class='
        - file: password.html
          regexp: '(id="password" name="password" type="password") (class="theme-form-input" placeholder="password" \{\{ if \.Invalid \}\}) autofocus'
          replace: '\1 autocomplete="current-password" \2 autofocus aria-invalid="true" aria-describedby="login-error"'
        - {file: login.html, regexp: '>Log in to \{\{ issuer \}\} <', replace: '>Sign in to Portikus<'}
        - {file: login.html, regexp: '>Log in with ', replace: '>Sign in with '}
        - file: login.html
          regexp: '<a href="([^"]*)" target="_self">\s*<button class="dex-btn theme-btn-provider">'
          replace: '<a class="dex-btn theme-btn-provider" href="\1" target="_self">'
        - {file: login.html, regexp: '</span>\s*</button>\s*</a>', replace: '</span>\n        </a>'}
      loop_control:
        label: "{{ item.file }}: {{ item.regexp }}"
      notify: Restart portikus-dex

    - name: Give the Dex pages a language
      ansible.builtin.replace:
        path: "{{ dex_web_dir }}/templates/header.html"
        regexp: '^<html>$'
        replace: '<html lang="en">'
      notify: Restart portikus-dex

    - name: Announce a failed Dex sign-in
      ansible.builtin.replace:
        path: "{{ dex_web_dir }}/templates/password.html"
        regexp: '<div id="login-error" class="dex-error-box">'
        replace: '<div id="login-error" class="dex-error-box" role="alert">'
      notify: Restart portikus-dex

    # A Dex upgrade can change a template so a patch silently stops matching.
    - name: Check every Dex template patch landed
      ansible.builtin.shell:
        cmd: >-
          grep -q 'role="main"' header.html && grep -q 'lang="en"' header.html
          && grep -q 'role="alert"' password.html
          && grep -q 'autocomplete="current-password"' password.html
          && grep -q 'aria-describedby="login-error"' password.html
          && ! grep -q 'tabindex=' password.html device.html
          && ! grep -q '<h2 class="theme-heading">' ./*.html
          && ! grep -q '<button' login.html
        chdir: "{{ dex_web_dir }}/templates"
      changed_when: false

    # ── Client secret (generated once) ───────────────────────────

    - name: Create the portikus configuration directory
      ansible.builtin.file:
        path: /etc/portikus
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generate the Dex client secret
      ansible.builtin.shell:
        cmd: umask 077 && openssl rand -hex 32 > {{ dex_client_secret_file }}
        creates: "{{ dex_client_secret_file }}"
      no_log: true

    - name: Set the Dex client secret file permissions
      ansible.builtin.file:
        path: "{{ dex_client_secret_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Read the Dex client secret
      ansible.builtin.slurp:
        src: "{{ dex_client_secret_file }}"
      register: dex_client_secret_file_content
      no_log: true

    - name: Set the Dex client secret fact
      ansible.builtin.set_fact:
        dex_client_secret: "{{ dex_client_secret_file_content.content | b64decode | trim }}"
      no_log: true

    # ── gRPC API certificates (docs/EPIC-14.md ruling 20) ────────

    - name: Issue the gRPC API certificates
      ansible.builtin.script:
        cmd: >-
          dex-grpc-certs.sh {{ dex_grpc_dir }} {{ dex_grpc_renew_days }}
          portikus-dex portikus
      register: dex_grpc_certs
      changed_when: "'changed' in dex_grpc_certs.stdout"
      notify: Restart portikus-dex

    # ── Configuration and service ────────────────────────────────

    - name: Create the Dex configuration directory
      ansible.builtin.file:
        path: "{{ dex_config_dir }}"
        state: directory
        owner: root
        group: portikus-dex
        mode: "0750"

    - name: Install the LDAP directory's root certificate
      ansible.builtin.copy:
        src: "{{ portikus_ldap_root_ca }}"
        dest: "{{ dex_ldap_root_ca_path }}"
        owner: root
        group: portikus-dex
        mode: "0644"
      when: portikus_dex_upstream == 'ldap' and portikus_ldap_root_ca | length > 0
      notify: Restart portikus-dex

    - name: Remove an LDAP root certificate no longer configured
      ansible.builtin.file:
        path: "{{ dex_ldap_root_ca_path }}"
        state: absent
      when: portikus_dex_upstream != 'ldap' or portikus_ldap_root_ca | length == 0
      notify: Restart portikus-dex

    # Holds the client secrets and the LDAP bind password, so nothing about
    # it may reach the output.
    - name: Deploy the Dex configuration
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ dex_config_dir }}/config.yaml"
        owner: root
        group: portikus-dex
        mode: "0640"
      no_log: true
      notify: Restart portikus-dex

    # Left by the users-file deploys this storage replaces.
    - name: Remove the list of users the old deploys recorded
      ansible.builtin.file:
        path: "{{ dex_config_dir }}/deployed-users.json"
        state: absent

    - name: Deploy the Dex unit
      ansible.builtin.template:
        src: portikus-dex.service.j2
        dest: /etc/systemd/system/portikus-dex.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd for Dex
        - Restart portikus-dex

    - name: Apply Dex changes now
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Dex
      ansible.builtin.systemd:
        name: portikus-dex
        enabled: true
        state: started

    - name: Wait for Dex to publish its discovery document
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ dex_port }}{{ portikus_dex_issuer | urlsplit('path') }}/.well-known/openid-configuration"
        return_content: true
      register: dex_discovery
      until: dex_discovery.status == 200
      retries: 15
      delay: 2

    - name: Require Dex to name the public issuer
      ansible.builtin.assert:
        that:
          - dex_discovery.json.issuer == portikus_dex_issuer
        fail_msg: "Dex reports issuer {{ dex_discovery.json.issuer }}, expected {{ portikus_dex_issuer }}."

    - name: Wait for Dex's gRPC API
      ansible.builtin.wait_for:
        host: "{{ dex_grpc_addr.split(':') | first }}"
        port: "{{ dex_grpc_addr.split(':') | last | int }}"
        timeout: 30

- name: Turn Dex off
  when: portikus_idp != 'dex'
  block:
    - name: Look for the Dex unit
      ansible.builtin.stat:
        path: /etc/systemd/system/portikus-dex.service
      register: dex_unit

    - name: Stop and disable Dex
      ansible.builtin.systemd:
        name: portikus-dex
        enabled: false
        state: stopped
      when: dex_unit.stat.exists

    # The dex database stays: it holds the accounts if Dex comes back.
    - name: Remove the Dex configuration and gRPC certificates
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dex_config_dir }}"
        - "{{ dex_grpc_dir }}"
