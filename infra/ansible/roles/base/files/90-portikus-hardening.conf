# Managed by Ansible (base role).  Kernel hardening for a host that runs
# untrusted student code in unprivileged containers (docs/SPEC.md 24.4).
# Each setting is one that nested Docker and Incus containers work with.
# Unprivileged user namespaces stay on: every workspace needs them.

# Hide kernel addresses from everyone, so an exploit cannot read them from
# /proc/kallsyms or other files.
kernel.kptr_restrict = 2

# The kernel log leaks addresses and hardware details; only the host's own
# administrators need it.
kernel.dmesg_restrict = 1

# eBPF has been a frequent kernel exploit path.  Debian already defaults to
# 2 (off, but root may turn it back on); 1 also stops it being turned back
# on until a reboot.  Container root is unprivileged here, and runc skips
# its device filter inside a user namespace, so nested Docker still works.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# A process may trace only its own descendants unless it holds
# CAP_SYS_PTRACE in the target's namespace.  gdb and strace on a program
# they start still work, and so does attaching as root inside a workspace.
kernel.yama.ptrace_scope = 1

# Nothing on the host boots another kernel in place; kdump is not used.
# Once set, this stays until the next reboot.
kernel.kexec_load_disabled = 1

# Refuse link, FIFO and file tricks in shared sticky directories such as
# /tmp.  The same values Ubuntu ships.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2

# io_uring has been another frequent exploit path.  1 lets only processes
# with CAP_SYS_ADMIN on the host create rings, so no workspace can (its root
# is unprivileged) while host services keep the choice.  Software in
# workspaces falls back to ordinary system calls: libuv (Node.js) and
# PostgreSQL do, and Docker's own seccomp profile already blocks io_uring
# in inner containers.  2 would also refuse host root, for no gain here.
kernel.io_uring_disabled = 1
