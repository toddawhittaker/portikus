---
# Base OS configuration for the Debian platform VM.
# Caddy's Cloudsmith repository, which older setups added, signs with an
# expired subkey that fails every refresh; Caddy now comes from its .deb.
- name: Remove the retired Caddy apt repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/caddy-stable.sources
    - /etc/apt/keyrings/caddy-stable.asc

# The one refresh every run makes; a role that adds a repository refreshes again.
# Setup installs nothing from the Portikus repository, so only its failure is a warning.
- name: Update apt cache
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      register: base_apt_refresh
      retries: 3
      delay: 10
      until: base_apt_refresh is succeeded
  rescue:
    # The apt module stops at the first failed source; apt-get names each one.
    - name: Refresh again to learn which repositories failed  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: apt-get update
      register: base_apt_update
      changed_when: false
      failed_when: false

    - name: Fail unless only the Portikus repository failed
      ansible.builtin.include_tasks: apt_failures.yml

- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - sudo
      - openssh-server
      - python3
      - python3-apt
      - thin-provisioning-tools
      - lvm2
      - jq
      - apparmor
      - apparmor-utils
      # For administrators' long jobs, which a closed root shell or SSH session would end (docs/adr/0051-root-shell.md).
      - tmux
    state: present

- name: Enable and start AppArmor
  ansible.builtin.systemd:
    name: apparmor
    enabled: true
    state: started

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Enable and start sshd
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

- name: Harden SSH
  ansible.builtin.import_tasks: ssh.yml

- name: Harden the kernel
  ansible.builtin.import_tasks: kernel.yml

# ── Unattended security upgrades ─────────────────────────────────
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Configure unattended-upgrades (security only, no auto-reboot)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    owner: root
    group: root
    mode: "0644"

- name: Enable periodic unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

# ── Journal size ─────────────────────────────────────────────────
# A flood of refused sign-ins must not fill the disk with log lines.
- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap the journal size and rate
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/portikus.conf
    content: |
      [Journal]
      SystemMaxUse=2G
      RateLimitIntervalSec=30s
      RateLimitBurst=2000
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

# ── Platform priority over workspaces ───────────────────────────
# Every platform service runs in system.slice, a sibling of each workspace's
# lxc.payload cgroup, so by default the whole platform counts as one busy
# workspace.  A weight of 1000 lets it win about ten to one over each
# workspace (weight 100), and MemoryLow here lets the units' own MemoryLow
# take effect (docs/CAPACITY.md).
- name: Create the system.slice drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/system.slice.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Give the platform's slice priority over workspaces
  ansible.builtin.copy:
    dest: /etc/systemd/system/system.slice.d/10-portikus-priority.conf
    content: |
      [Slice]
      CPUWeight=1000
      MemoryLow=512M
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for the platform slice

# ── systemd-ssh-generator ───────────────────────────────────────
# It warns about AF_VSOCK on every daemon reload when the host has no vsock
# device.  Portikus reaches the host through openssh-server, so SSH over
# vsock or a local AF_UNIX socket is not needed.
- name: Create the system generator mask directory
  ansible.builtin.file:
    path: /etc/systemd/system-generators
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mask systemd-ssh-generator
  ansible.builtin.file:
    src: /dev/null
    dest: /etc/systemd/system-generators/systemd-ssh-generator
    state: link
    force: true
  notify: Stop the sockets systemd-ssh-generator made at boot
