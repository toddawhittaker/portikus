---
# Workspace egress in allow-list mode (issue #284, ADR 0038).  This role
# installs what the egress helper drives: the workspace proxy (Squid built
# with OpenSSL, which can read a TLS name), our dnsmasq for allow-list DNS,
# the helper's configuration and its request and state directories.  The
# helper itself, and its units, come with the portikus package.  The policy
# lives in the database and is applied by the helper, never by this play.

- name: Install the workspace proxy and dnsmasq
  ansible.builtin.apt:
    name:
      - squid-openssl
      - dnsmasq-base
      - openssl
    state: present
    update_cache: true
    cache_valid_time: 3600

# Installing squid-openssl points the squid link at itself, so the API's
# proxy (ADR 0027) would change build at its next restart.  Pin it.
- name: Keep the API's proxy on the GnuTLS build
  community.general.alternatives:
    name: squid
    path: /usr/sbin/squid-gnutls
  notify: Restart squid

- name: Read the build the API's proxy runs
  ansible.builtin.shell:
    cmd: set -o pipefail; readlink "/proc/$(systemctl show -p MainPID --value squid)/exe" || true
    executable: /bin/bash
  register: workspace_egress_api_squid_exe
  changed_when: false
  check_mode: false

- name: Restart the API's proxy if it runs the OpenSSL build
  ansible.builtin.debug:
    msg: "The API's proxy runs {{ workspace_egress_api_squid_exe.stdout }}; restarting it on the GnuTLS build."
  when: workspace_egress_api_squid_exe.stdout == '/usr/sbin/squid-openssl'
  changed_when: true
  notify: Restart squid

# ── The helper's files (ADR 0038) ─────────────────────────────────

- name: Create the egress request directory
  ansible.builtin.file:
    path: "{{ workspace_egress_request_dir }}"
    state: directory
    owner: root
    group: portikus-controller
    mode: "0770"
  notify: Restart the controller for the request directory

- name: Create the egress state directory
  ansible.builtin.file:
    path: "{{ workspace_egress_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Squid will not start without its list files; empty lists nothing.  The
# helper owns their content.
- name: Create empty proxy lists if the helper has not written them
  ansible.builtin.copy:
    dest: "{{ workspace_egress_state_dir }}/{{ item }}"
    content: ""
    force: false
    owner: root
    group: root
    mode: "0644"
  loop:
    - names.txt
    - blocked.txt
    - open.txt

- name: Write the egress helper's settings
  ansible.builtin.template:
    src: egress.env.j2
    dest: /etc/portikus/egress.env
    owner: root
    group: root
    mode: "0644"

# ── The workspace proxy ───────────────────────────────────────────

- name: Create the workspace proxy's directory
  ansible.builtin.file:
    path: "{{ workspace_egress_proxy_dir }}"
    state: directory
    owner: root
    group: proxy
    mode: "0750"

# https_port with ssl-bump insists on a certificate.  With
# generate-host-certificates=off and nothing bumped, no client ever sees it,
# so it is self-signed and not a certificate authority.
- name: Create the workspace proxy's certificate
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes
      -days 3650 -subj /CN=portikus-workspace-proxy
      -addext basicConstraints=critical,CA:FALSE
      -keyout {{ workspace_egress_proxy_dir }}/bump.key
      -out {{ workspace_egress_proxy_dir }}/bump.crt
    creates: "{{ workspace_egress_proxy_dir }}/bump.key"
  notify: Restart the workspace proxy

- name: Let only Squid's group read the key
  ansible.builtin.file:
    path: "{{ workspace_egress_proxy_dir }}/bump.key"
    owner: root
    group: proxy
    mode: "0640"

- name: Make the certificate readable
  ansible.builtin.file:
    path: "{{ workspace_egress_proxy_dir }}/bump.crt"
    owner: root
    group: root
    mode: "0644"

- name: Deploy the workspace proxy configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ workspace_egress_proxy_dir }}/squid.conf"
    owner: root
    group: root
    mode: "0644"
    validate: squid-openssl -k parse -f %s
  notify: Restart the workspace proxy

- name: Install the workspace proxy and egress DNS units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - portikus-workspace-proxy.service
    - portikus-egress-dns.service
  notify:
    - Reload systemd for workspace egress
    - Restart the workspace proxy
    - Restart the egress DNS if it runs

- name: Enable and start the workspace proxy
  ansible.builtin.systemd:
    name: portikus-workspace-proxy
    enabled: true
    state: started
    daemon_reload: true

# The helper runs on each request and once at boot, before Incus starts
# workspaces.  Running it here would reload the table and empty the name set,
# so the play only enables it.
- name: Enable the egress helper
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - portikus-egress-apply.service
    - portikus-egress-apply.path

- name: Watch for egress requests
  ansible.builtin.systemd:
    name: portikus-egress-apply.path
    state: started
