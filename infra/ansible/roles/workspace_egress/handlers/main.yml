---
- name: Reload systemd for workspace egress
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart the workspace proxy
  ansible.builtin.systemd:
    name: portikus-workspace-proxy
    state: restarted

# Only while it runs: the egress helper decides whether it should.  The
# systemd module has no try-restart.
- name: Restart the egress DNS if it runs  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl try-restart portikus-egress-dns.service
  changed_when: true

# New settings reach the loaded table only when the helper applies a policy,
# so ask it, through its usual request file, to apply the last one again.
# A site that never applied a policy has nothing to redo.
- name: Re-apply the last egress policy
  ansible.builtin.shell:
    cmd: |
      python3 - <<'PY'
      import json, os
      src = "/var/lib/portikus/egress-state/applied.json"
      if os.path.exists(src):
          with open(src) as f:
              policy = json.load(f)["policy"]
          tmp = "/var/lib/portikus/egress-request/.ansible-request.json"
          with open(tmp, "w") as f:
              json.dump({"requestId": "ansible-settings", **policy}, f)
          os.rename(tmp, "/var/lib/portikus/egress-request/request.json")
      PY
  changed_when: true
