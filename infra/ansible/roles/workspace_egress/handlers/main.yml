---
- name: Reload systemd for workspace egress
  ansible.builtin.systemd:
    daemon_reload: true

# The file replaces the whole table in one transaction, so running
# workspaces never see a gap; only the meters start again from zero.
- name: Reload the workspace outbound limits
  ansible.builtin.systemd:
    name: portikus-workspace-limits
    state: restarted

- name: Restart the workspace proxy
  ansible.builtin.systemd:
    name: portikus-workspace-proxy
    state: restarted

# Only while it runs: the egress helper decides whether it should.  The
# systemd module has no try-restart.
- name: Restart the egress DNS if it runs  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl try-restart portikus-egress-dns.service
  changed_when: true

# With no request the helper reloads the applied policy with the new
# settings, the same run the registry helper starts.  A run already going
# may have read the settings before this change, and the systemd module
# skips a start while the oneshot is activating.  systemctl start instead
# waits for that run; the second start is a fresh one that reads the change.
# Not a restart, which would kill a run holding a controller request.
- name: Let a running egress apply finish  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: [systemctl, start, portikus-egress-apply.service]
  changed_when: true
  listen: Re-apply the last egress policy

- name: Re-apply the last egress policy in a fresh run  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: [systemctl, start, portikus-egress-apply.service]
  changed_when: true
  listen: Re-apply the last egress policy
