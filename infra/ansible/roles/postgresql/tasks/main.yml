---
# Install and configure PostgreSQL for the Portikus control plane.
# Debian 13 (trixie) ships PostgreSQL 17 in main.
# Peer auth over the unix socket — no password in DATABASE_URL.

- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-client
      - python3-psycopg2
      - acl
    state: present

# Debian's postgresql@ unit already sets -900; the drop-in keeps it if the
# packaging ever drops it, so the kernel kills workspace processes first
# when memory runs out (docs/CAPACITY.md).  The running server already has
# that value, so only systemd reloads.  No memory cap: PostgreSQL's own
# settings bound it, and only the API and worker reach it.
- name: Create the PostgreSQL drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/postgresql@.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Protect PostgreSQL from the out-of-memory killer
  ansible.builtin.copy:
    dest: /etc/systemd/system/postgresql@.service.d/10-portikus-oom.conf
    content: |
      [Service]
      OOMScoreAdjust=-900
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for PostgreSQL

- name: Enable and start PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Ensure PostgreSQL listens on localhost only
  community.postgresql.postgresql_set:
    name: listen_addresses
    value: localhost
  become: true
  become_user: postgres
  notify: Restart PostgreSQL

- name: Create the portikus database role
  community.postgresql.postgresql_user:
    name: portikus
    role_attr_flags: NOSUPERUSER,NOCREATEROLE,NOCREATEDB
  become: true
  become_user: postgres

- name: Create the portikus database
  community.postgresql.postgresql_db:
    name: portikus
    owner: portikus
  become: true
  become_user: postgres
