---
# Firewall policy (STACK.md section 29, SPEC.md section 24.1).
#
# Uses nftables, the default on Debian 13.  The ruleset is templated
# so that all rules are source-controlled and no manual iptables
# invocations are required.

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Deploy nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

# Debian's unit runs "nft flush ruleset" on stop, so a restart would drop
# Incus's table and the egress helper's, which would open allow-list mode
# (ADR 0038).  Stopping removes only the tables this role owns.
- name: Create the nftables drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove only our own tables when nftables stops
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/10-portikus.conf
    content: |
      # Managed by Ansible (firewall role).
      [Service]
      ExecStop=
      ExecStop=/usr/sbin/nft 'destroy table inet filter; destroy table inet nat'
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
