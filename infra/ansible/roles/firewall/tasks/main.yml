---
# Firewall policy (STACK.md section 29, SPEC.md section 24.1).
#
# Uses nftables, the default on Debian 13.  The ruleset is templated
# so that all rules are source-controlled and no manual iptables
# invocations are required.

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# SSH stays open on the ports sshd really listens on, so a host whose sshd
# is not on port 22 does not lock its administrator out.
- name: Check for sshd
  ansible.builtin.stat:
    path: /usr/sbin/sshd
  register: firewall_sshd

- name: Read the ports sshd listens on
  ansible.builtin.command: /usr/sbin/sshd -T
  register: firewall_sshd_config
  changed_when: false
  check_mode: false
  when: firewall_sshd.stat.exists

- name: Keep those ports open
  ansible.builtin.set_fact:
    firewall_ssh_ports: >-
      {{ ((firewall_sshd_config.stdout_lines | default([]) | select('match', '^port [0-9]+$') | map('regex_replace', '^port ', '') | list)
          + (firewall_sshd_config.stdout_lines | default([]) | select('match', '^listenaddress .*:[0-9]+$') | map('regex_replace', '^.*:', '') | list))
         | map('int') | unique | sort }}

- name: Deploy nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

# Debian's unit runs "nft flush ruleset" on stop, so a restart would drop
# Incus's table and the egress helper's, which would open allow-list mode
# (ADR 0038).  Stopping removes only the tables this role owns.
- name: Create the nftables drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove only our own tables when nftables stops
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/10-portikus.conf
    content: |
      # Managed by Ansible (firewall role).
      [Service]
      ExecStop=
      ExecStop=/usr/sbin/nft 'destroy table inet filter; destroy table inet nat'
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
