---
# The certificate's state, owned by the admin page's root job after setup
# seeds it once (docs/SPEC.md section 21.12; packages/contracts/src/certificate.ts).
caddy_certificate_dir: /etc/portikus/certificate
# The install answers' secrets, which may still hold an old Cloudflare token.
caddy_install_secrets_path: /etc/portikus/secrets.yaml
# Caddy's admin interface; the caddy user's home, so it needs no runtime directory.
caddy_admin_socket: /var/lib/caddy/admin.sock
# The root job that owns the certificate state, shipped by the portikus package.
caddy_certificate_job: /usr/lib/portikus/certificate-job
