---
# First install only: write the certificate state from the install answer
# (docs/SPEC.md section 21.12; the layout is packages/contracts/src/certificate.ts).
# After this the admin page's root job owns the directory, so main.yml runs
# this file only while settings.json is missing.  settings.json is written
# last, so a run cut short seeds again.  An old letsencrypt answer becomes
# ACME by DNS-01 through Cloudflare, so an upgraded site keeps its certificate.

- name: Create the certificate state directory
  ansible.builtin.file:
    path: "{{ caddy_certificate_dir }}"
    state: directory
    owner: root
    group: caddy
    mode: "0750"

# Caddy reads the token itself through a {file.<path>} placeholder in the
# snippet, so it is in no configuration, environment, log or saved
# configuration (SPEC.md section 24.8).
- name: Seed the Cloudflare token
  when: portikus_tls == 'letsencrypt'
  block:
    - name: Create the secrets directory
      ansible.builtin.file:
        path: "{{ caddy_certificate_dir }}/secrets"
        state: directory
        owner: root
        group: caddy
        mode: "0750"

    - name: Write the Cloudflare token for Caddy
      ansible.builtin.copy:
        dest: "{{ caddy_certificate_dir }}/secrets/cloudflare_api_token"
        content: "{{ portikus_cloudflare_api_token }}\n"
        owner: root
        group: caddy
        mode: "0640"
      no_log: true

- name: Seed the uploaded certificate
  when: portikus_tls == 'files'
  block:
    - name: Create the uploads directory
      ansible.builtin.file:
        path: "{{ caddy_certificate_dir }}/files"
        state: directory
        owner: root
        group: caddy
        mode: "0750"

    # Copied where the caddy user can read them, so the operator's own files
    # keep whatever owner and mode they have.
    - name: Copy the site certificate and key
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ caddy_certificate_dir }}/files/{{ item.dest }}"
        remote_src: true
        owner: root
        group: caddy
        mode: "0640"
      loop:
        - { src: "{{ portikus_tls_cert }}", dest: site.crt }
        - { src: "{{ portikus_tls_key }}", dest: site.key }
      loop_control:
        label: "{{ item.dest }}"
      no_log: true

    - name: Read what the site certificate says about itself
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ caddy_certificate_dir }}/files/site.crt", -noout,
               -issuer, -startdate, -enddate, -ext, subjectAltName, -nameopt, RFC2253, -dateopt, iso_8601]
      register: caddy_seed_cert
      changed_when: false

- name: Seed the TLS snippet both sites import
  ansible.builtin.template:
    src: tls.caddy.j2
    dest: "{{ caddy_certificate_dir }}/tls.caddy"
    owner: root
    group: caddy
    mode: "0640"
  notify: Reload caddy

# settings.json has the shape of CertificateSettingsView: no secret, only
# whether one is set.
- name: Seed the settings in force for Caddy's own authority
  ansible.builtin.copy:
    content: "{{ {'source': 'internal'} | to_nice_json }}\n"
    dest: "{{ caddy_certificate_dir }}/settings.json"
    owner: root
    group: caddy
    mode: "0640"
  when: portikus_tls == 'internal'

- name: Seed the settings in force for ACME through Cloudflare
  ansible.builtin.copy:
    content: >-
      {{ {'source': 'acme', 'directory': portikus_acme_ca, 'email': portikus_acme_email, 'eab': none,
          'challenge': {'mode': 'dns01', 'provider': 'cloudflare', 'fields': {},
                        'secretsSet': {'api_token': true}}} | to_nice_json }}
    dest: "{{ caddy_certificate_dir }}/settings.json"
    owner: root
    group: caddy
    mode: "0640"
  when: portikus_tls == 'letsencrypt'

- name: Seed the settings in force for the uploaded certificate
  ansible.builtin.copy:
    content: >-
      {{ {'source': 'files', 'preview': none, 'site': {'privateKeySet': true, 'certificate': {
          'issuer': lines | select('match', '^issuer=') | first | regex_replace('^issuer=', ''),
          'names': caddy_seed_cert.stdout | regex_findall('DNS:([^,\s]+)'),
          'notBefore': lines | select('match', '^notBefore=') | first | regex_replace('^notBefore=(\S+) (\S+)$', '\1T\2'),
          'notAfter': lines | select('match', '^notAfter=') | first | regex_replace('^notAfter=(\S+) (\S+)$', '\1T\2')}}}
        | to_nice_json }}
    dest: "{{ caddy_certificate_dir }}/settings.json"
    owner: root
    group: caddy
    mode: "0640"
  vars:
    lines: "{{ caddy_seed_cert.stdout_lines }}"
  when: portikus_tls == 'files'

# Setup waits for the ACME certificates on this run only (main.yml).
- name: Note that this run seeded the certificate
  ansible.builtin.set_fact:
    caddy_seeded: true
