---
# Caddy is always built with xcaddy and the caddy-dns plugins the admin page
# offers for the DNS-01 challenge (docs/SPEC.md section 21.12), from pinned
# versions, the Go module checksum database checking every module.  It is
# put in place of the packaged binary with dpkg-divert, so the package's
# unit, user and directories stay as they are.

- name: Read the installed Caddy version and plugins
  ansible.builtin.shell:
    cmd: /usr/bin/caddy version && /usr/bin/caddy list-modules --versions --skip-standard
  register: caddy_modules
  changed_when: false
  failed_when: false
  check_mode: false

# "dns.providers.<name> <version>" for each plugin, as list-modules prints them.
- name: Name the plugins the build must have
  ansible.builtin.set_fact:
    caddy_wanted_modules: >-
      {{ caddy_dns_plugins | map(attribute='name') | map('regex_replace', '^', 'dns.providers.')
         | zip(caddy_dns_plugins | map(attribute='version')) | map('join', ' ') | list }}

- name: Build and install Caddy with the DNS plugins
  when: >-
    not caddy_modules.stdout.startswith(caddy_version ~ ' ')
    or caddy_wanted_modules | reject('in', caddy_modules.stdout_lines) | list | length > 0
  block:
    # Trixie's Go is only the bootstrap: GOTOOLCHAIN=auto fetches the
    # version Caddy's go.mod names, as for distrobuilder (docs/adr/0004).
    - name: Install Go
      ansible.builtin.apt:
        name: golang-go
        state: present

    - name: Create the Go build directory
      ansible.builtin.file:
        path: /root/go
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Several GiB of module and build cache, removed after the build.
    - name: Make a scratch directory for the Go caches
      ansible.builtin.tempfile:
        state: directory
        path: /root/go
        prefix: caddy-build-
      register: caddy_go_tmp

    - name: Build xcaddy
      ansible.builtin.command:
        argv: [go, install, "github.com/caddyserver/xcaddy/cmd/xcaddy@{{ caddy_xcaddy_version }}"]
        chdir: "{{ caddy_go_tmp.path }}"
      environment: &caddy_go_env
        GOBIN: "{{ caddy_go_tmp.path }}/bin"
        GOPATH: "{{ caddy_go_tmp.path }}"
        GOCACHE: "{{ caddy_go_tmp.path }}/cache"
        GOMODCACHE: "{{ caddy_go_tmp.path }}/pkg/mod"
        GOFLAGS: -buildvcs=false
        GOTOOLCHAIN: auto
      changed_when: true

    - name: Build Caddy
      ansible.builtin.command:
        argv: >-
          {{ [caddy_go_tmp.path ~ '/bin/xcaddy', 'build', caddy_version]
             + (['--with'] | product(caddy_dns_plugins | map(attribute='module')
                | zip(caddy_dns_plugins | map(attribute='version')) | map('join', '@')) | flatten)
             + ['--output', caddy_go_tmp.path ~ '/caddy-portikus'] }}
        chdir: "{{ caddy_go_tmp.path }}"
      environment: *caddy_go_env
      changed_when: true

    - name: Check the build has every plugin
      ansible.builtin.command:
        argv: ["{{ caddy_go_tmp.path }}/caddy-portikus", list-modules, --versions, --skip-standard]
      register: caddy_built_modules
      changed_when: false
      failed_when: caddy_wanted_modules | reject('in', caddy_built_modules.stdout_lines) | list | length > 0

    - name: Move the packaged binary aside
      ansible.builtin.command:
        argv: [dpkg-divert, --local, --rename, --divert, /usr/bin/caddy.distrib, --add, /usr/bin/caddy]
        creates: /usr/bin/caddy.distrib

    - name: Install the Caddy build
      ansible.builtin.copy:
        src: "{{ caddy_go_tmp.path }}/caddy-portikus"
        dest: /usr/bin/caddy
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart caddy

  always:
    - name: Remove the Go caches of the Caddy build
      ansible.builtin.file:
        path: "{{ caddy_go_tmp.path }}"
        state: absent
      when: caddy_go_tmp.path is defined
