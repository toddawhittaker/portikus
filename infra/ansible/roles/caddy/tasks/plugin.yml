---
# Caddy is always built with xcaddy and the caddy-dns plugins the admin page
# offers for the DNS-01 challenge (docs/SPEC.md section 21.12), from pinned
# versions, the Go module checksum database checking every module.  It is
# put in place of the packaged binary with dpkg-divert, so the package's
# unit, user and directories stay as they are.

- name: Read the installed Caddy version and plugins
  ansible.builtin.shell:
    cmd: /usr/bin/caddy version && /usr/bin/caddy list-modules --versions --skip-standard
  register: caddy_modules
  changed_when: false
  failed_when: false
  check_mode: false

# "dns.providers.<name> <version>" for each plugin, as list-modules prints them.
- name: Name the plugins the build must have
  ansible.builtin.set_fact:
    caddy_wanted_modules: >-
      {{ caddy_dns_plugins | map(attribute='name') | map('regex_replace', '^', 'dns.providers.')
         | zip(caddy_dns_plugins | map(attribute='version')) | map('join', ' ') | list }}

- name: Build and install Caddy with the DNS plugins
  when: >-
    not caddy_modules.stdout.startswith(caddy_version ~ ' ')
    or caddy_wanted_modules | reject('in', caddy_modules.stdout_lines) | list | length > 0
  block:
    # Built outside the scratch directory, which go_build removes.
    - name: Build Caddy with xcaddy
      ansible.builtin.import_tasks: ../../go_build/tasks/main.yml
      vars:
        go_build_name: caddy
        go_build_commands:
          - [go, install, "github.com/caddyserver/xcaddy/cmd/xcaddy@{{ caddy_xcaddy_version }}"]
          - >-
            {{ [go_build_dir ~ '/bin/xcaddy', 'build', caddy_version]
               + (['--with'] | product(caddy_dns_plugins | map(attribute='module')
                  | zip(caddy_dns_plugins | map(attribute='version')) | map('join', '@')) | flatten)
               + ['--output', caddy_build_output] }}

    # xcaddy could fall back to another core version; only the pinned one is tested.
    - name: Check the build is the pinned Caddy version
      ansible.builtin.command:
        argv: ["{{ caddy_build_output }}", version]
      register: caddy_built_version
      changed_when: false
      failed_when: not caddy_built_version.stdout.startswith(caddy_version ~ ' ')

    - name: Check the build has every plugin
      ansible.builtin.command:
        argv: ["{{ caddy_build_output }}", list-modules, --versions, --skip-standard]
      register: caddy_built_modules
      changed_when: false
      failed_when: caddy_wanted_modules | reject('in', caddy_built_modules.stdout_lines) | list | length > 0

    - name: Move the packaged binary aside
      ansible.builtin.command:
        argv: [dpkg-divert, --local, --rename, --divert, /usr/bin/caddy.distrib, --add, /usr/bin/caddy]
        creates: /usr/bin/caddy.distrib

    - name: Install the Caddy build
      ansible.builtin.copy:
        src: "{{ caddy_build_output }}"
        dest: /usr/bin/caddy
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart caddy

  # A failed check must not leave the staging binary behind.
  always:
    - name: Remove the staging binary
      ansible.builtin.file:
        path: "{{ caddy_build_output }}"
        state: absent
