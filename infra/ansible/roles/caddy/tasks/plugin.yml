---
# A letsencrypt site needs Caddy with the caddy-dns/cloudflare plugin for
# the DNS-01 challenge (docs/SPEC.md section 21.12).  It is built with xcaddy
# from pinned versions, the Go module checksum database checking every
# module, and put in place of the packaged binary with dpkg-divert, so the
# package's unit, user and directories stay as they are.  Any other site
# gets the packaged binary back.

- name: Read the installed Caddy version and plugins
  ansible.builtin.shell:
    cmd: /usr/bin/caddy version && /usr/bin/caddy list-modules --versions --skip-standard
  register: caddy_modules
  changed_when: false
  failed_when: false
  check_mode: false
  when: portikus_tls == 'letsencrypt'

- name: Build and install Caddy with the Cloudflare plugin
  when:
    - portikus_tls == 'letsencrypt'
    - not (caddy_modules.stdout.startswith(caddy_version ~ ' ')
           and ('dns.providers.cloudflare ' ~ caddy_dns_cloudflare_version) in caddy_modules.stdout)
  block:
    # Trixie's Go is only the bootstrap: GOTOOLCHAIN=auto fetches the
    # version Caddy's go.mod names, as for distrobuilder (docs/adr/0004).
    - name: Install Go
      ansible.builtin.apt:
        name: golang-go
        state: present

    - name: Create the Go build directory
      ansible.builtin.file:
        path: /root/go
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Several GiB of module and build cache, removed after the build.
    - name: Make a scratch directory for the Go caches
      ansible.builtin.tempfile:
        state: directory
        path: /root/go
        prefix: caddy-build-
      register: caddy_go_tmp

    - name: Build Caddy
      ansible.builtin.shell:
        cmd: >-
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@{{ caddy_xcaddy_version }}
          && {{ caddy_go_tmp.path }}/bin/xcaddy build {{ caddy_version }}
          --with github.com/caddy-dns/cloudflare@{{ caddy_dns_cloudflare_version }}
          --output {{ caddy_go_tmp.path }}/caddy-portikus
        chdir: "{{ caddy_go_tmp.path }}"
      environment:
        GOBIN: "{{ caddy_go_tmp.path }}/bin"
        GOPATH: "{{ caddy_go_tmp.path }}"
        GOCACHE: "{{ caddy_go_tmp.path }}/cache"
        GOMODCACHE: "{{ caddy_go_tmp.path }}/pkg/mod"
        GOFLAGS: -buildvcs=false
        GOTOOLCHAIN: auto
      changed_when: true

    - name: Check the build has the Cloudflare plugin
      ansible.builtin.command:
        argv: ["{{ caddy_go_tmp.path }}/caddy-portikus", list-modules, --versions, --skip-standard]
      register: caddy_built_modules
      changed_when: false
      failed_when: ('dns.providers.cloudflare ' ~ caddy_dns_cloudflare_version) not in caddy_built_modules.stdout

    - name: Move the packaged binary aside
      ansible.builtin.command:
        argv: [dpkg-divert, --local, --rename, --divert, /usr/bin/caddy.distrib, --add, /usr/bin/caddy]
        creates: /usr/bin/caddy.distrib

    - name: Install the Caddy build
      ansible.builtin.copy:
        src: "{{ caddy_go_tmp.path }}/caddy-portikus"
        dest: /usr/bin/caddy
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart caddy

  always:
    - name: Remove the Go caches of the Caddy build
      ansible.builtin.file:
        path: "{{ caddy_go_tmp.path }}"
        state: absent
      when: caddy_go_tmp.path is defined

# rm first: dpkg-divert will not rename the packaged binary over a file.
- name: Put the packaged Caddy back
  ansible.builtin.shell:
    cmd: rm -f /usr/bin/caddy && dpkg-divert --local --rename --remove /usr/bin/caddy
    removes: /usr/bin/caddy.distrib
  when: portikus_tls != 'letsencrypt'
  notify: Restart caddy
