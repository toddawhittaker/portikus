---
# The Caddyfile, put in force at once rather than by a handler: the
# certificate tasks that follow need it running, and a flush inside the
# portikus role would also run that role's handlers early.
- name: Deploy the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  register: caddy_caddyfile

# Only this Caddyfile opens the admin socket, so a socket that answers means
# Caddy runs this file's configuration and a reload finds it.  Anything else
# is restarted: a Caddy not running, one still on port 2019 from before the
# socket, or the placeholder a purged install starts beside a stale socket.
- name: Ask Caddy's admin socket whether it answers
  ansible.builtin.command:
    argv: [curl, -fsS, -o, /dev/null, --unix-socket, "{{ caddy_admin_socket }}", "http://localhost/config/"]
  register: caddy_admin_answers
  changed_when: false
  failed_when: false

- name: Put the Caddyfile in force
  ansible.builtin.command:
    argv: [systemctl, "{{ 'reload' if caddy_admin_answers.rc == 0 else 'restart' }}", caddy]
  changed_when: true
  when: caddy_caddyfile is changed or caddy_admin_answers.rc != 0
