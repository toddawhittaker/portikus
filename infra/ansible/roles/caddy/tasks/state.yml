---
# Whether the admin page owns the certificate state: any of the files the
# root job writes, as `certificate-job first-install` itself checks, so
# setup never seeds over it (docs/SPEC.md section 21.12).
- name: Look for the certificate state
  ansible.builtin.stat:
    path: "{{ caddy_certificate_dir }}/{{ item }}"
  loop: [settings.json, tls.caddy, secrets]
  register: caddy_certificate_state

# Until the local administrator is made, nobody can have used the
# Certificate tab, so the install answers still own the certificate
# (docs/SPEC.md section 24.10).
- name: Look for an administrator waiting for the public certificate
  ansible.builtin.stat:
    path: "{{ portikus_admin_pending }}"
  register: caddy_admin_pending_file

- name: Note whether the admin page owns the certificate state
  ansible.builtin.set_fact:
    caddy_certificate_state_exists: "{{ (caddy_certificate_state.results | selectattr('stat.exists') | list | length > 0)
      and not caddy_admin_pending_file.stat.exists }}"
