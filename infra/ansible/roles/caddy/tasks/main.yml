---
# Caddy is the only thing listening on the VM's public interface: it
# terminates TLS and proxies to the control-plane services, which stay
# bound to loopback (SPEC 24.3).  The certificate is the admin page's: setup
# only seeds it on first install (docs/SPEC.md section 21.12).
# Installed from the release's .deb, pinned by checksum: Caddy's Cloudsmith
# repository signs with a subkey that expired in 2024, which Debian 13's
# apt refuses (base removes that repository first).

- name: Create the package cache directory
  ansible.builtin.file:
    path: /var/cache/portikus
    state: directory
    owner: root
    group: root
    mode: "0755"

# Kept in the cache, so a rerun downloads nothing.
- name: Download the Caddy package
  ansible.builtin.get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/{{ caddy_version }}/{{ caddy_deb }}"
    dest: "/var/cache/portikus/{{ caddy_deb }}"
    checksum: "sha512:{{ caddy_deb_sha512 }}"
    owner: root
    group: root
    mode: "0644"
  register: caddy_deb_download
  retries: 3
  delay: 10
  until: caddy_deb_download is succeeded

# Skipped when this version is installed.  The DNS plugin build below sits
# behind a dpkg diversion, so the package's own binary goes to caddy.distrib.
- name: Install Caddy
  ansible.builtin.apt:
    deb: "/var/cache/portikus/{{ caddy_deb }}"

# The API fetches the identity provider's discovery document over the public
# host name.  This entry keeps that fetch on loopback, where the units'
# IPAddressAllow permits it.  The marker, not the name, finds the line, so
# an address move replaces it.
- name: Resolve the public host name to loopback on the VM
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s# portikus site address$'
    line: "127.0.0.1 {{ portikus_public_host }} # portikus site address"
    owner: root
    group: root
    mode: "0644"

# Earlier setups wrote the line with no marker.  The site view the last run
# wrote names the host it pinned, so only lines Portikus wrote are removed.
- name: Read the site address the last setup pinned
  ansible.builtin.slurp:
    path: /etc/portikus/site-view.json
  register: caddy_previous_site_view
  failed_when: false

- name: Remove unmarked loopback lines for the site address
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+{{ item | regex_escape }}$'
    state: absent
  loop: >-
    {{ ([portikus_public_host]
        + ([(caddy_previous_site_view.content | b64decode | from_json).host | default('')]
           if caddy_previous_site_view.content is defined else []))
       | select | unique | list }}

- name: Create the portikus configuration directory
  ansible.builtin.file:
    path: /etc/portikus
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the Caddy drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# ── Caddy with the DNS plugins (docs/SPEC.md section 21.12) ───────
- name: Put the Caddy build with the DNS plugins in place
  ansible.builtin.include_tasks: plugin.yml

# ── The site ─────────────────────────────────────────────────────
# The Caddyfile imports the certificate snippet, which the root job writes.
# On first install there is none yet: Caddy keeps the configuration it has
# until the portikus role, after the package and api.env, has the job seed
# it (certificate.yml) and deploys the Caddyfile then.
- name: Look for the certificate snippet
  ansible.builtin.stat:
    path: "{{ caddy_certificate_dir }}/tls.caddy"
  register: caddy_tls_snippet

# A purge leaves setup's Caddyfile importing the snippet it deleted, and
# Caddy cannot start on it; a placeholder stands in until the portikus
# role seeds the snippet, as Debian's own file does on a first install.
- name: Look for a Caddyfile that imports the missing certificate snippet
  ansible.builtin.command:
    argv: [grep, -qF, "{{ caddy_certificate_dir }}/tls.caddy", /etc/caddy/Caddyfile]
  register: caddy_imports_missing
  changed_when: false
  failed_when: false
  when: not caddy_tls_snippet.stat.exists

- name: Give Caddy a placeholder Caddyfile until the certificate snippet exists
  ansible.builtin.copy:
    dest: /etc/caddy/Caddyfile
    content: |
      # Written by Portikus setup, which replaces it once the certificate is set up.
      :80 {
        respond "Portikus setup is not finished" 503
      }
    owner: root
    group: root
    mode: "0644"
  when: not caddy_tls_snippet.stat.exists and caddy_imports_missing.rc == 0

- name: Deploy the Caddyfile
  ansible.builtin.import_tasks: caddyfile.yml
  when: caddy_tls_snippet.stat.exists

# Workspaces may together promise more memory than the VM has; when it runs
# out, the kernel kills workspace processes before Caddy.  Caddy faces the
# network, so a cap keeps a flood of connections from taking the VM instead
# (about 80 MiB measured; docs/CAPACITY.md).  Caddy is everyone's only way
# in, so a crash or a kill at the cap restarts it after 5 seconds, which
# never reaches systemd's start limit (docs/CAPACITY.md).
- name: Protect Caddy from the out-of-memory killer and restart it on failure
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/10-portikus-oom.conf
    content: |
      [Service]
      OOMScoreAdjust=-900
      MemoryMax=1G
      Restart=on-failure
      RestartSec=5
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for Caddy
    - Restart caddy

# With Caddy down nobody reaches the admin page, so systemd reports it
# (STACK.md section 15).  A unit-section change needs no restart.
- name: Alert the administrator when Caddy fails
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/20-portikus-alert.conf
    content: |
      [Unit]
      OnFailure=portikus-alert@%n.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for Caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
