---
# Caddy is the only thing listening on the VM's public interface: it
# terminates TLS and proxies to the control-plane services, which stay
# bound to loopback (SPEC 24.3).  The certificate is the admin page's: setup
# only seeds it on first install (docs/SPEC.md section 21.12).
# Follows the same apt-repo-with-checksum pattern as the incus role.

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Caddy signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    checksum: "sha256:{{ caddy_gpg_checksum }}"
    owner: root
    group: root
    mode: "0644"
  register: caddy_repo_key

- name: Add the Caddy stable repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: /etc/apt/keyrings/caddy-stable.asc
    state: present
  register: caddy_repo

# Base's refresh can be an hour old, so a rerun after a failed first
# refresh would not see the repository's packages.
- name: Read the installed packages
  ansible.builtin.package_facts:
    manager: apt

# When the repository is new, or its package is not installed yet.
- name: Refresh the apt index for the Caddy repository
  ansible.builtin.apt:
    update_cache: true
  register: caddy_apt_refresh
  retries: 3
  delay: 10
  until: caddy_apt_refresh is succeeded
  when: caddy_repo is changed or caddy_repo_key is changed or 'caddy' not in ansible_facts.packages

# Pinned to the version CI tests against (.github/workflows/ci.yml); change both together.
- name: Install Caddy
  ansible.builtin.apt:
    name: "caddy={{ caddy_version | regex_replace('^v', '') }}"
    state: present

# The API fetches the identity provider's discovery document over the public
# host name.  This entry keeps that fetch on loopback, where the units'
# IPAddressAllow permits it.
- name: Resolve the public host name to loopback on the VM
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+{{ portikus_public_host | regex_escape }}$'
    line: "127.0.0.1 {{ portikus_public_host }}"
    owner: root
    group: root
    mode: "0644"

- name: Create the portikus configuration directory
  ansible.builtin.file:
    path: /etc/portikus
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the Caddy drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# ── Caddy with the DNS plugins (docs/SPEC.md section 21.12) ───────
- name: Put the Caddy build with the DNS plugins in place
  ansible.builtin.include_tasks: plugin.yml

# ── The certificate's state ──────────────────────────────────────
# Seeded once from the install answer; after that only the admin page's
# root job and `portikus reset-certificate` change it.
- name: Look for the certificate state
  ansible.builtin.stat:
    path: "{{ caddy_certificate_dir }}/settings.json"
  register: caddy_certificate_state

- name: Seed the certificate state on first install
  ansible.builtin.include_tasks: seed.yml
  when: not caddy_certificate_state.stat.exists

# Releases before the certificate page gave Caddy the Cloudflare token
# through an environment file; seeding moved it into the state directory.
# The running Caddy no longer reads its environment, so a reload of the new
# Caddyfile is enough and nobody's connection is cut by a restart.
- name: Remove the old token file, its drop-in and the old certificate copy
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/portikus/caddy-dns.env
    - /etc/systemd/system/caddy.service.d/20-portikus-dns.conf
    - /etc/caddy/portikus-tls
  notify: Reload systemd for Caddy

- name: Deploy the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: Reload caddy

# Workspaces may together promise more memory than the VM has; when it runs
# out, the kernel kills workspace processes before Caddy.  Caddy faces the
# network, so a cap keeps a flood of connections from taking the VM instead
# (about 80 MiB measured; docs/CAPACITY.md).  Caddy is everyone's only way
# in, so a crash or a kill at the cap restarts it after 5 seconds, which
# never reaches systemd's start limit (docs/CAPACITY.md).
- name: Protect Caddy from the out-of-memory killer and restart it on failure
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/10-portikus-oom.conf
    content: |
      [Service]
      OOMScoreAdjust=-900
      MemoryMax=1G
      Restart=on-failure
      RestartSec=5
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for Caddy
    - Restart caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started

# The certificate tasks below need the running configuration, so the reload
# cannot wait until the end of the play.
- name: Apply the Caddy configuration now
  ansible.builtin.meta: flush_handlers

- name: Read the certificate settings in force
  ansible.builtin.slurp:
    src: "{{ caddy_certificate_dir }}/settings.json"
  register: caddy_settings_file

- name: Note the certificate's source
  ansible.builtin.set_fact:
    caddy_certificate_source: "{{ (caddy_settings_file.content | b64decode | from_json).source }}"

# ── What the API trusts (Epic 27 R14) ────────────────────────────
# The system's authorities, Caddy's internal root and any uploaded
# certificate (so a self-signed one is trusted too), whatever the source,
# so a change on the admin page never breaks the API's own calls through
# Caddy.  The root job writes the same file in the same order.
- name: Wait for Caddy to write its internal root certificate
  ansible.builtin.wait_for:
    path: "{{ caddy_root_cert }}"
    timeout: 60
  when: caddy_certificate_source == 'internal'

- name: Find the uploaded certificates
  ansible.builtin.find:
    paths: "{{ caddy_certificate_dir }}/files"
    patterns: "*.crt"
  register: caddy_uploaded_certs

- name: Look for Caddy's internal root
  ansible.builtin.stat:
    path: "{{ caddy_root_cert }}"
  register: caddy_root_cert_stat

- name: Read the parts of the trust bundle
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: >-
    {{ ['/etc/ssl/certs/ca-certificates.crt']
       + ([caddy_root_cert] if caddy_root_cert_stat.stat.exists else [])
       + (caddy_uploaded_certs.files | map(attribute='path') | sort) }}
  register: caddy_trust_parts

- name: Write the trust bundle
  ansible.builtin.copy:
    content: "{{ caddy_trust_parts.results | map(attribute='content') | map('b64decode') | map('trim') | join('\n') }}\n"
    dest: "{{ portikus_caddy_root_cert }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart a running API for the new trust

# Caddy asks for both certificates when it starts.  A first install waits,
# so a token or DNS problem stops the play here rather than at a browser.
- name: Wait for the ACME certificates
  when: caddy_seeded | default(false) and caddy_certificate_source == 'acme'
  block:
    - name: Wait for the site's and the preview wildcard's certificates
      ansible.builtin.find:
        paths: "/var/lib/caddy/.local/share/caddy/certificates/{{ portikus_acme_ca | regex_replace('^https://', '') | replace('/', '-') }}"
        patterns:
          - "{{ portikus_public_host }}.crt"
          - "wildcard_.{{ portikus_preview_suffix }}.crt"
        recurse: true
      register: caddy_acme_certs
      until: caddy_acme_certs.matched == 2
      retries: 30
      delay: 10

  rescue:
    - name: Say why the certificates are missing
      ansible.builtin.fail:
        msg: >-
          Caddy has not got certificates for {{ portikus_public_host }} and
          *.{{ portikus_preview_suffix }} after five minutes.  Its log says
          why: journalctl -u caddy.  Check that the Cloudflare token may edit
          DNS in that zone.
