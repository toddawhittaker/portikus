---
- name: Reload systemd for Caddy
  ansible.builtin.systemd:
    daemon_reload: true

# OOMScoreAdjust and the new binary apply only to a newly started process.
- name: Restart caddy
  ansible.builtin.systemd:
    name: caddy
    state: restarted

# NODE_EXTRA_CA_CERTS is read at start.  On a fresh host the API is not
# started yet, and the portikus role starts it later.
- name: Restart a running API for the new trust
  ansible.builtin.command:
    argv: [systemctl, try-restart, portikus-api.service]
  changed_when: true
