---
# Incus stages each export here before streaming it to the host (ADR 0024).
backup_volume_name: portikus-backups
# One export at a time is staged, so this must exceed the largest volume: a
# full home plus the recovery quota, and 2 GiB for tar and gzip overhead.
backup_volume_size_gib: "{{ portikus_workspace_home_size_gib + portikus_workspace_recovery_size_gib + 2 }}"
