---
# Install and initialise Incus (STACK.md section 24, SPEC.md section 24.4).

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Incus stable repository key
  # Zabbly signing key 4EFC590696CB15B87C73A3AD82CC8797C838DCFD, verified 2026-09-16
  ansible.builtin.get_url:
    url: https://pkgs.zabbly.com/key.asc
    dest: /etc/apt/keyrings/zabbly-incus.asc
    checksum: "sha256:f1adb44fdf82083f983a392b5b406d34e473dce3d66a51de3118cdc1f51d3f87"
    owner: root
    group: root
    mode: "0644"
  register: incus_repo_key

- name: Add Incus stable repository
  ansible.builtin.deb822_repository:
    name: incus-stable
    types: deb
    uris: https://pkgs.zabbly.com/incus/stable
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: /etc/apt/keyrings/zabbly-incus.asc
    state: present
  register: incus_repo

# Only when the repository is new; base refreshes every run.
- name: Refresh the apt index for the Incus repository
  ansible.builtin.apt:
    update_cache: true
  register: incus_apt_refresh
  retries: 3
  delay: 10
  until: incus_apt_refresh is succeeded
  when: incus_repo is changed or incus_repo_key is changed

- name: Install Incus
  ansible.builtin.apt:
    name: incus
    state: present

- name: Enable and start Incus
  ansible.builtin.systemd:
    name: incus
    enabled: true
    state: started

# The account Ansible connects as runs incus without sudo (smoke test,
# day-to-day admin).  A local run as root, as `portikus setup` does, has none.
- name: Add the operator account to the incus-admin group
  ansible.builtin.user:
    name: "{{ portikus_operator_user }}"
    groups: incus-admin
    append: true
  when: portikus_operator_user | length > 0

- name: Check if Incus storage pool exists
  ansible.builtin.command:
    cmd: incus storage show {{ incus_storage_pool_name }}
  register: incus_pool_check
  changed_when: false
  failed_when: false

- name: Create Incus LVM thin storage pool on data disk
  ansible.builtin.command:
    cmd: >-
      incus storage create {{ incus_storage_pool_name }} lvm
      source={{ lvm_vg_name }}
      lvm.thinpool_name={{ lvm_thinpool_name }}
      lvm.use_thinpool=true
      lvm.vg.force_reuse=true
  # force_reuse: after a platform-VM rebuild the data disk keeps the volume
  # group, which the previous Incus tagged as its own. Without this the
  # fresh Incus refuses it ("already used by Incus") and workspace data
  # would be unreachable. Harmless on a first install.
  when: incus_pool_check.rc != 0
  changed_when: true
