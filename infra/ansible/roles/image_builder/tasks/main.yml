---
# Install distrobuilder and its dependencies so the platform VM can build
# workspace images with the image job (STACK.md section 25, SPEC.md section 22.4).

# ── Build dependencies ────────────────────────────────────────────

- name: Install image-builder prerequisites
  ansible.builtin.apt:
    name:
      - debootstrap
      - git
      - gnupg
      - rsync
      - squashfs-tools
      - build-essential
      - pkg-config
      - libgpgme-dev
      - libbtrfs-dev
    state: present

# Trixie ships Go 1.24 in main, which is enough to bootstrap.
# distrobuilder's go.mod wants Go 1.25; GOTOOLCHAIN=auto lets
# Go 1.24 download the exact version automatically (docs/adr/0004).
- name: Install Go
  ansible.builtin.apt:
    name: golang-go
    state: present

# ── distrobuilder from source ────────────────────────────────────
# The v3.3.1 tag does not compile: its go.mod pins filepath-securejoin
# 0.6, which moved two functions that the pinned podman storage library
# still expects.  Upstream main fixed the pair, so we build a pinned main
# commit.  Its go.mod wants Go 1.25, newer than trixie's Go 1.24; the
# trixie Go is only the bootstrap, and GOTOOLCHAIN=auto lets it fetch
# the exact toolchain go.mod names, verified against Go's checksum
# database (docs/adr/0004).

- name: Read the installed distrobuilder commit marker
  ansible.builtin.slurp:
    src: /usr/local/share/portikus/distrobuilder-commit
  register: image_builder_marker
  failed_when: false

- name: Set the installed distrobuilder commit fact
  ansible.builtin.set_fact:
    image_builder_installed_commit: >-
      {{ (image_builder_marker.content | default('') | b64decode | trim)
         if image_builder_marker.content is defined else '' }}

- name: Build distrobuilder at the pinned commit
  when: image_builder_installed_commit != image_builder_distrobuilder_commit
  block:
    - name: Clone distrobuilder at the pinned commit
      ansible.builtin.git:
        repo: https://github.com/lxc/distrobuilder.git
        dest: /root/go/src/distrobuilder
        version: "{{ image_builder_distrobuilder_commit }}"
        depth: 1

    # Several GiB of module and build cache, removed after the build.
    - name: Make a scratch directory for the Go caches
      ansible.builtin.tempfile:
        state: directory
        path: /root/go
        prefix: distrobuilder-build-
      register: image_builder_go_tmp

    - name: Build and install distrobuilder
      ansible.builtin.command:
        cmd: go install ./distrobuilder
        chdir: /root/go/src/distrobuilder
      environment:
        GOBIN: /usr/local/bin
        GOPATH: "{{ image_builder_go_tmp.path }}"
        GOCACHE: "{{ image_builder_go_tmp.path }}/cache"
        GOMODCACHE: "{{ image_builder_go_tmp.path }}/pkg/mod"
        GOFLAGS: -buildvcs=false
        GOTOOLCHAIN: auto
      changed_when: true

  always:
    - name: Remove the Go caches of the distrobuilder build
      ansible.builtin.file:
        path: "{{ image_builder_go_tmp.path }}"
        state: absent
      when: image_builder_go_tmp.path is defined

# Earlier builds kept their caches here; they took several GiB of the main disk.
- name: Remove the Go caches of earlier builds
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/go/pkg
    - /root/go/cache
    - /root/go/dex-cache
    - /root/go/bin
    - /root/go/caddy-portikus

# A build killed outright skips its cleanup and leaves its scratch directory.
- name: Find scratch directories of interrupted Go builds
  ansible.builtin.find:
    paths: /root/go
    patterns: "*-build-*"
    file_type: directory
  register: image_builder_stale_builds

- name: Remove scratch directories of interrupted Go builds
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ image_builder_stale_builds.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Create the marker directory
  ansible.builtin.file:
    path: /usr/local/share/portikus
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record the installed distrobuilder commit
  ansible.builtin.copy:
    dest: /usr/local/share/portikus/distrobuilder-commit
    content: "{{ image_builder_distrobuilder_commit }}\n"
    owner: root
    group: root
    mode: "0644"

# ── Working directories ──────────────────────────────────────────
# `make build-workspace-image` rsyncs workspace.sh in as the SSH user, so
# the directory belongs to that account (root on a local run, which has none).

# The image job builds images now; this was the old build's staging copy.
- name: Remove the old image-build staging directory
  ansible.builtin.file:
    path: /var/lib/portikus/image-build
    state: absent

# Every converge from a checkout brings the VM's copy in step with the
# repository, so a rebuilt or long-lived VM never runs a stale workspace.sh
# (Epic 12b B1).  The package ships no copy, so a packaged run has neither
# the directory nor the scripts, and the smoke test brings its own.
- name: Keep the Incus helper scripts in step with the checkout
  when: (playbook_dir ~ '/../incus') is directory
  block:
    - name: Create workspace script directory
      ansible.builtin.file:
        path: /var/lib/portikus/incus
        state: directory
        owner: "{{ portikus_operator_user or 'root' }}"
        group: "{{ portikus_operator_user or 'root' }}"
        mode: "0755"

    - name: Sync the Incus helper scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../incus/"
        dest: /var/lib/portikus/incus/
        owner: "{{ portikus_operator_user or 'root' }}"
        group: "{{ portikus_operator_user or 'root' }}"
        mode: "0755"
