# Ansible inventory for the pilot platform VM, run from a workstation.
# The address is read from the PORTIKUS_VM_IP environment variable, which
# `make configure-vm` sets from the OpenTofu output, and the account from
# PORTIKUS_SSH_USER (deploy, the account cloud-init makes, by default).
# Nothing here needs editing per deployment.
[platform]
portikus ansible_host="{{ lookup('env', 'PORTIKUS_VM_IP') }}" ansible_user="{{ lookup('env', 'PORTIKUS_SSH_USER') | default('deploy', true) }}"
