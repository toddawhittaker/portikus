---
# Ansible collections required by Portikus playbooks, installed from their
# GitHub repositories at pinned release tags so that neither CI nor the
# operator depends on galaxy.ansible.com being up. Install before running
# ansible-lint or ansible-playbook:
#   ansible-galaxy collection install -r requirements.yml
collections:
  - name: https://github.com/ansible-collections/community.general.git
    type: git
    version: "13.4.0"
  - name: https://github.com/ansible-collections/ansible.posix.git
    type: git
    version: "2.2.2"
  - name: https://github.com/ansible-collections/ansible.utils.git
    type: git
    version: "v6.1.0"
  - name: https://github.com/ansible-collections/community.postgresql.git
    type: git
    version: "4.2.0"
  # Dependency of community.general; listed so it is not fetched from Galaxy.
  - name: https://github.com/ansible-collections/community.library_inventory_filtering.git
    type: git
    version: "1.1.5"
