---
# Portikus platform-VM configuration (STACK.md section 22).
# Roles are applied in dependency order.  This playbook is idempotent
# and safe to run repeatedly.
- name: Configure Portikus platform VM
  hosts: platform
  become: true

  vars:
    data_disk_device: /dev/vdb
    lvm_vg_name: portikus-data
    lvm_thinpool_name: thinpool
    lvm_thinpool_size: "90%FREE"
    incus_storage_pool_name: workspace-data
    incus_network_name: portikus-ws
    incus_network_cidr: "10.200.0.1/24"
    incus_project_name: portikus
    workspace_root_disk_quota: 10GB
    # SPEC 19.1 suggests 4 vCPU and 6 GiB for a real pilot.  The pilot VM
    # has 8 GB total, so these defaults are deliberately lower.  Adjust
    # once pilot telemetry shows real usage.
    workspace_cpu_limit: "2"
    workspace_memory_limit: "4GB"
    workspace_process_limit: "2000"
    # distrobuilder is built from source at this upstream commit (docs/adr/0004).
    image_builder_distrobuilder_commit: "86713967673400934b605a0a24f45ceb5c371082"
    management_cidr: "{{ lookup('env', 'PORTIKUS_MANAGEMENT_CIDR') | default('10.100.0.0/24', true) }}"

    # ── Node.js runtime ──────────────────────────────────────────
    # NodeSource GPG signing checksum, verified 2026-09-16.
    nodesource_gpg_checksum: "b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d"

    # ── Portikus control-plane services ───────────────────────────
    # Empty means install the newest GitHub release.  Set
    # PORTIKUS_VERSION=<ver> to roll back to an older release.
    # See "Release and rollback" in infra/README.md.
    portikus_version: "{{ lookup('env', 'PORTIKUS_VERSION') }}"
    # A path on the Ansible host to a locally built .deb, for testing a
    # branch on a fresh VM without publishing a release.  Empty means none.
    portikus_deb: "{{ lookup('env', 'PORTIKUS_DEB') }}"
    portikus_node_env: production
    portikus_api_port: 3000
    portikus_controller_port: 3001
    portikus_database_url: "postgresql://portikus@/portikus?host=/var/run/postgresql"
    portikus_controller_url: "http://127.0.0.1:3001"
    # Seeds the grace period on the worker's first start; the /admin page
    # owns it afterwards, so changing this later has no effect (ADR 0011).
    portikus_shutdown_grace_seconds: 600
    portikus_presence_ttl_seconds: 60
    portikus_sweep_interval_seconds: 1
    portikus_start_timeout_seconds: 60
    portikus_stop_timeout_seconds: 30
    portikus_status_refresh_seconds: 15
    portikus_incus_socket: "/var/lib/incus/unix.socket"
    portikus_incus_project: "{{ incus_project_name }}"
    portikus_incus_pool: "{{ incus_storage_pool_name }}"
    portikus_incus_profile: workspace
    portikus_incus_image_alias: portikus
    # The TCP port the workspace agent listens on inside each container.
    portikus_agent_port: 7400
    portikus_workspace_home_size_gib: 25
    portikus_workspace_docker_size_gib: 20

    # ── Authentication (SPEC 5.3, ADR 0008) ───────────────────────
    # The in-repo mock identity provider is off unless it is asked for:
    # while it is on, anyone who can reach the site can sign in as any mock
    # account, including the administrator.  A pilot VM passes
    # PORTIKUS_MOCK_IDP=true; otherwise set the PORTIKUS_OIDC_* variables
    # below to point at a real identity provider.
    portikus_mock_idp: "{{ lookup('env', 'PORTIKUS_MOCK_IDP') | default('false', true) | bool }}"
    portikus_mock_idp_port: 3002
    portikus_oidc_issuer: "{{ lookup('env', 'PORTIKUS_OIDC_ISSUER') }}"
    portikus_oidc_client_id: "{{ lookup('env', 'PORTIKUS_OIDC_CLIENT_ID') }}"
    portikus_oidc_client_secret: "{{ lookup('env', 'PORTIKUS_OIDC_CLIENT_SECRET') }}"
    portikus_oidc_groups_claim: groups
    portikus_oidc_student_group: >-
      {{ lookup('env', 'PORTIKUS_OIDC_STUDENT_GROUP') | default('portikus-students', true) }}
    portikus_oidc_admin_group: >-
      {{ lookup('env', 'PORTIKUS_OIDC_ADMIN_GROUP') | default('portikus-administrators', true) }}
    portikus_session_ttl_seconds: 43200

    # ── Browser access (Caddy) ────────────────────────────────────
    # nip.io resolves portikus.<ip>.nip.io to <ip>, so a fresh VM has a
    # hostname for TLS without anyone editing DNS.  PORTIKUS_PUBLIC_HOST
    # overrides it.
    portikus_public_host: >-
      {{ lookup('env', 'PORTIKUS_PUBLIC_HOST')
         | default('portikus.' ~ ansible_host ~ '.nip.io', true) }}
    portikus_public_url: "https://{{ portikus_public_host }}"
    # Caddy signing key from Cloudsmith, verified 2026-09-16.
    caddy_gpg_checksum: "783dfee04b19e851a928cd87b34710213ebbe7628f98d9f34595ab83be578c00"
    # Caddy's internal certificate authority root, written on first start.
    caddy_root_cert: /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt
    portikus_caddy_root_cert: /etc/portikus/caddy-root.crt

  # Checked before any role runs, so bad identity-provider settings change
  # nothing on the VM.  The secret rules match packages/config: portikus-api
  # refuses to start in production on a short or default secret.
  pre_tasks:
    - name: Require identity provider settings when the mock is off
      ansible.builtin.assert:
        that:
          - portikus_oidc_issuer | default('', true) | length > 0
          - portikus_oidc_client_id | default('', true) | length > 0
          - portikus_oidc_client_secret | default('', true) | length >= 32
          - portikus_oidc_client_secret | default('', true) != 'portikus-dev-secret'
        fail_msg: >-
          With PORTIKUS_MOCK_IDP=false, set PORTIKUS_OIDC_ISSUER,
          PORTIKUS_OIDC_CLIENT_ID and PORTIKUS_OIDC_CLIENT_SECRET.
          The client secret must be at least 32 characters and must not be
          the development default, or portikus-api will refuse to start.
      when: not portikus_mock_idp

  # Each role carries its own name as a tag, so a single part of the VM
  # can be converged on its own with --tags <role>.
  roles:
    - role: base
      tags: base
    - role: firewall
      tags: firewall
    - role: lvm
      tags: lvm
    - role: incus
      tags: incus
    - role: incus_network
      tags: incus_network
    - role: portikus_workspace_profile
      tags: portikus_workspace_profile
    - role: image_builder
      tags: image_builder
    - role: postgresql
      tags: postgresql
    - role: node
      tags: node
    - role: caddy
      tags: caddy
    - role: portikus
      tags: portikus
