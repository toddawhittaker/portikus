---
# Portikus platform-VM configuration (STACK.md section 22).
# Roles are applied in dependency order.  This playbook is idempotent
# and safe to run repeatedly.
- name: Configure Portikus platform VM
  hosts: platform
  become: true

  vars:
    data_disk_device: /dev/vdb
    lvm_vg_name: portikus-data
    lvm_thinpool_name: thinpool
    lvm_thinpool_size: "90%FREE"
    incus_storage_pool_name: workspace-data
    incus_network_name: portikus-ws
    incus_network_cidr: "10.200.0.1/24"
    incus_project_name: portikus
    workspace_root_disk_quota: 10GB
    # SPEC 19.1 suggests 4 vCPU and 6 GiB for a real pilot.  The pilot VM
    # has 8 GB total, so these defaults are deliberately lower.  Adjust
    # once pilot telemetry shows real usage.
    workspace_cpu_limit: "2"
    workspace_memory_limit: "4GB"
    workspace_process_limit: "2000"
    # distrobuilder is built from source at this upstream commit (docs/adr/0004).
    image_builder_distrobuilder_commit: "86713967673400934b605a0a24f45ceb5c371082"
    management_cidr: "{{ lookup('env', 'PORTIKUS_MANAGEMENT_CIDR') | default('10.100.0.0/24', true) }}"

    # ── Node.js runtime ──────────────────────────────────────────
    # NodeSource GPG signing checksum, verified 2026-09-16.
    nodesource_gpg_checksum: "b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d"

    # ── Portikus control-plane services ───────────────────────────
    # Pinned to a published release; the orchestrator updates it when a new
    # release is cut.  See "Release and rollback" in infra/README.md.
    portikus_version: "0.1.0+g0000000"
    portikus_node_env: production
    portikus_api_port: 3000
    portikus_controller_port: 3001
    portikus_database_url: "postgresql://portikus@/portikus?host=/var/run/postgresql"
    portikus_controller_url: "http://127.0.0.1:3001"
    portikus_shutdown_grace_seconds: 600
    portikus_presence_ttl_seconds: 60
    portikus_sweep_interval_seconds: 1
    portikus_start_timeout_seconds: 60
    portikus_stop_timeout_seconds: 30
    portikus_status_refresh_seconds: 15
    portikus_incus_socket: "/var/lib/incus/unix.socket"
    portikus_incus_project: "{{ incus_project_name }}"
    portikus_incus_pool: "{{ incus_storage_pool_name }}"
    portikus_incus_profile: workspace
    portikus_incus_image_alias: portikus
    portikus_workspace_home_size_gib: 25
    portikus_workspace_docker_size_gib: 20

  roles:
    - base
    - firewall
    - lvm
    - incus
    - incus_network
    - portikus_workspace_profile
    - image_builder
    - postgresql
    - node
    - portikus
