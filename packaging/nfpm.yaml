# nfpm configuration for the portikus control plane (ADR 0007, SPEC.md Epic 3.5).
# Built by scripts/build-deb.sh, which sets PORTIKUS_VERSION.
name: portikus
arch: amd64
platform: linux
version: ${PORTIKUS_VERSION}
section: net
priority: optional
maintainer: Portikus <portikus@example.invalid>
description: |
  Portikus control plane: the API, the worker, and the workspace controller.
vendor: Portikus
homepage: https://github.com/toddawhittaker/portikus
license: MIT

# Debian-archive packages only; setup installs the rest (docs/SPEC.md section 21.12).
depends:
  - ansible-core
  - python3-apt
  - debconf
  - whiptail | dialog
  - ca-certificates
  - gpg
  - curl
  # The install questions check certificate and key files with it.
  - openssl

# The tree file modes come from the build: scripts/build-deb.sh chmods them,
# because nfpm would apply a file_info mode to the directories as well.
contents:
  - src: ./dist/deploy/api
    dst: /usr/lib/portikus/api
    type: tree
    file_info:
      owner: root
      group: root
  - src: ./dist/deploy/worker
    dst: /usr/lib/portikus/worker
    type: tree
    file_info:
      owner: root
      group: root
  - src: ./dist/deploy/controller
    dst: /usr/lib/portikus/controller
    type: tree
    file_info:
      owner: root
      group: root
  # Bind-mounted read-only into every workspace container, where the
  # container's own uid range cannot map root, so the tree must stay
  # world-readable. prune_tree in build-deb.sh sets those modes.
  - src: ./dist/deploy/workspace-agent
    dst: /usr/lib/portikus/workspace-agent
    type: tree
    file_info:
      owner: root
      group: root
  # The browser bundle Caddy serves.
  - src: ./apps/web/dist
    dst: /usr/lib/portikus/web
    type: tree
    file_info:
      owner: root
      group: root

  # Node, bundled so the package needs nothing outside Debian (ruling 11).
  - src: ./dist/deploy/node
    dst: /usr/lib/portikus/node
    type: tree
    file_info:
      owner: root
      group: root
  # The play that `portikus setup` runs on this host (ruling 8, ADR 0029).
  - src: ./dist/deploy/ansible
    dst: /usr/share/portikus/ansible
    type: tree
    file_info:
      owner: root
      group: root
  # The install settings keys postinst reads (docs/SPEC.md section 21.12).
  - src: ./packaging/debian/settings-keys
    dst: /usr/share/portikus/settings-keys
    file_info:
      owner: root
      group: root
      mode: 0644
  - src: ./packaging/debian/preseed.example
    dst: /usr/share/doc/portikus/preseed.example
  # The apt repository's public key (ruling 17), dearmored by build-deb.sh.
  - src: ./dist/deploy/portikus-archive-keyring.gpg
    dst: /usr/share/keyrings/portikus-archive-keyring.gpg
    file_info:
      owner: root
      group: root
      mode: 0644

  - src: ./packaging/systemd/portikus-api.service
    dst: /usr/lib/systemd/system/portikus-api.service
    file_info: &unit_info
      owner: root
      group: root
      mode: 0644
  - src: ./packaging/systemd/portikus-worker.service
    dst: /usr/lib/systemd/system/portikus-worker.service
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-controller.service
    dst: /usr/lib/systemd/system/portikus-controller.service
    file_info: *unit_info
  # The workspace egress helper, root, started by its path unit (ADR 0038).
  # Enabled by Ansible, which writes the settings it needs.
  - src: ./packaging/systemd/portikus-egress-apply.service
    dst: /usr/lib/systemd/system/portikus-egress-apply.service
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-egress-apply.path
    dst: /usr/lib/systemd/system/portikus-egress-apply.path
    file_info: *unit_info
  # Its Node-free guard, which fails closed when the helper itself fails.
  - src: ./packaging/egress-guard.sh
    dst: /usr/lib/portikus/egress-guard.sh
    file_info:
      owner: root
      group: root
      mode: 0755
  # Shipped but never enabled by the package; Ansible enables it (ADR 0008).
  - src: ./packaging/systemd/portikus-mock-idp.service
    dst: /usr/lib/systemd/system/portikus-mock-idp.service
    file_info: *unit_info

  # Started by postinst without waiting (ruling 10); never enabled.
  - src: ./packaging/systemd/portikus-setup.service
    dst: /usr/lib/systemd/system/portikus-setup.service
    file_info: *unit_info
  # The root workspace image job and its trigger (ruling 28, ADR 0030).
  # Enabled by Ansible, which creates the directories they need.
  - src: ./packaging/systemd/portikus-image-job.path
    dst: /usr/lib/systemd/system/portikus-image-job.path
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-image-job.service
    dst: /usr/lib/systemd/system/portikus-image-job.service
    file_info: *unit_info
  # The daily read-only release check (issue #861), also enabled by Ansible.
  - src: ./packaging/systemd/portikus-image-check.service
    dst: /usr/lib/systemd/system/portikus-image-check.service
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-image-check.timer
    dst: /usr/lib/systemd/system/portikus-image-check.timer
    file_info: *unit_info
  - src: ./packaging/image/image-job
    dst: /usr/lib/portikus/image-job
    file_info:
      owner: root
      group: root
      mode: 0755
  # The Docker pull-through caches and their root helper (issue #840).
  # Enabled by Ansible, which installs docker-registry and makes their
  # filesystem, user and certificates.
  - src: ./packaging/systemd/portikus-registry-hub.service
    dst: /usr/lib/systemd/system/portikus-registry-hub.service
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-registry-ghcr.service
    dst: /usr/lib/systemd/system/portikus-registry-ghcr.service
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-registry-job.path
    dst: /usr/lib/systemd/system/portikus-registry-job.path
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-registry-job.service
    dst: /usr/lib/systemd/system/portikus-registry-job.service
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-registry-status.service
    dst: /usr/lib/systemd/system/portikus-registry-status.service
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-registry-status.timer
    dst: /usr/lib/systemd/system/portikus-registry-status.timer
    file_info: *unit_info
  - src: ./packaging/registry/registry-job
    dst: /usr/lib/portikus/registry-job
    file_info:
      owner: root
      group: root
      mode: 0755
  # Backups on the server itself (ADR 0044): the same scripts a separate
  # backup host runs, in local mode, and the root key helper.  Enabled by
  # setup's backup role only on a local install.
  - src: ./infra/host/backup.sh
    dst: /usr/lib/portikus/backup/portikus-backup
    file_info: &backup_script
      owner: root
      group: root
      mode: 0755
  - src: ./infra/host/portikus-backup-export
    dst: /usr/lib/portikus/backup/portikus-backup-export
    file_info: *backup_script
  - src: ./infra/host/portikus-backup-mac
    dst: /usr/lib/portikus/backup/portikus-backup-mac
    file_info: *backup_script
  - src: ./infra/host/backup-channel.sh
    dst: /usr/lib/portikus/backup/portikus-backup-channel
    file_info: *backup_script
  - src: ./infra/host/restore.sh
    dst: /usr/lib/portikus/backup/portikus-restore
    file_info: *backup_script
  - src: ./infra/host/restore-copy.sh
    dst: /usr/lib/portikus/backup/portikus-restore-copy
    file_info: *backup_script
  - src: ./packaging/backup/backup-key
    dst: /usr/lib/portikus/backup/portikus-backup-key
    file_info: *backup_script
  - src: ./packaging/systemd/portikus-backup.service
    dst: /usr/lib/systemd/system/portikus-backup.service
    file_info: *unit_info
  # The same schedules a separate backup host uses.
  - src: ./infra/host/systemd/portikus-backup.timer
    dst: /usr/lib/systemd/system/portikus-backup.timer
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-backup-channel.service
    dst: /usr/lib/systemd/system/portikus-backup-channel.service
    file_info: *unit_info
  - src: ./infra/host/systemd/portikus-backup-channel.timer
    dst: /usr/lib/systemd/system/portikus-backup-channel.timer
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-backup-key.socket
    dst: /usr/lib/systemd/system/portikus-backup-key.socket
    file_info: *unit_info
  - src: ./packaging/systemd/portikus-backup-key@.service
    dst: /usr/lib/systemd/system/portikus-backup-key@.service
    file_info: *unit_info
  # The recipe a "rebuild" job builds from (ruling 23).
  - src: ./infra/workspace-image/portikus.yaml
    dst: /usr/share/portikus/workspace-image/portikus.yaml
    file_info: &recipe_info
      owner: root
      group: root
      mode: 0644
  - src: ./infra/workspace-image/VERSION
    dst: /usr/share/portikus/workspace-image/VERSION
    file_info: *recipe_info

  # The host command, run by root (SPEC.md section 5.1).
  - src: ./packaging/bin/portikus
    dst: /usr/bin/portikus
    file_info:
      owner: root
      group: root
      mode: 0755

  - dst: /etc/portikus
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root
  # A shared parent: other roles and the image builder create subdirectories here.
  - dst: /var/lib/portikus
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root

# The install questions (docs/SPEC.md section 21.12).
deb:
  scripts:
    templates: ./packaging/debian/templates
    config: ./packaging/debian/config

scripts:
  postinstall: ./packaging/scripts/postinst
  preremove: ./packaging/scripts/prerm
  postremove: ./packaging/scripts/postrm
